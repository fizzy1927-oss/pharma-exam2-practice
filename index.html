 ["Acetylcysteine aerosol","3–5 ml of <b>20%</b> or 6–10 ml of <b>10%</b>","3–4× daily by SVN, <b>with a bronchodilator</b>"],
 ["Acetylcysteine instillation","1–2 ml of 10–20%","As needed (about every 1–4 h), then suction"],
 ["Hypertonic saline (CF)","4 ml of 7%","Twice daily, <b>after a bronchodilator</b>, before or with airway clearance"],
 ["Trikafta","See the table below","<b>Oral, with fat-containing food, twice daily ~12 h apart</b>"],
])}
${NOTE("Doses other than Trikafta’s are standard textbook values; the Trikafta table is straight from slide 30. NAC: 10% = 100 mg/ml, 20% = 200 mg/ml. Opened vial: refrigerate and <b>discard after 96 hours</b>; a light purple color change doesn’t affect efficacy.")}
<h4>Trikafta dosing (slide 30)</h4>
${T(["Age","Weight","Morning","Evening"],[
 ["12+ years (and adults)","Any","2 <b>orange</b> tablets (elexacaftor 100 / tezacaftor 50 / ivacaftor 75 mg)","1 light blue tablet (ivacaftor <b>150 mg</b>)"],
 ["6 to &lt;12 years","<b>≥30 kg</b> (66 lb)","2 orange tablets (100/50/75 mg), the <b>adult dose</b>","Ivacaftor 150 mg"],
 ["6 to &lt;12 years","<b>&lt;30 kg</b>","2 <b>light orange</b> tablets (50/25/37.5 mg)","1 light blue tablet (ivacaftor <b>75 mg</b>)"],
 ["2 to &lt;6 years","<b>≥14 kg</b> (31 lb)","1 packet <b>granules</b> (100/50/75 mg)","1 packet ivacaftor 75 mg"],
 ["2 to &lt;6 years","<b>&lt;14 kg</b>","1 packet granules (80/40/60 mg)","1 packet ivacaftor <b>59.5 mg</b>"],
])}
<h4>Practice the decision</h4>
${T(["Patient","Answer"],[
 ["15 y","2 orange AM + ivacaftor 150 mg PM"],
 ["10 y, 35 kg","≥30 kg → adult dose: 2 orange AM + 150 mg PM"],
 ["8 y, 25 kg","2 light orange AM + ivacaftor 75 mg PM"],
 ["5 y, 16 kg","Granules 100/50/75 AM + ivacaftor 75 mg granules PM"],
 ["4 y, 12 kg","Granules 80/40/60 AM + ivacaftor 59.5 mg granules PM"],
 ["18 months","<b>Not eligible</b> (must be ≥2 years)"],
])}
${HOOK("Weight cut-offs: <b>“30 for the 6–11s, 14 for the 2–5s.”</b> Heavier kids get the next-bigger dose.")}
`},
{o:"m5", h:"Candidates for CFTR modulator therapy", body:`
<div class="key">Trikafta is indicated for patients <b>aged 2 years and older</b> with <b>at least ONE copy of the F508del mutation</b> in the CFTR gene <b>or another responsive mutation</b>.</div>
<ul>
 <li><b>Why CF happens:</b> CFTR gene mutations → defective or absent CFTR protein → salt/water imbalance → thick, sticky mucus that clogs the lungs and affects other organs (pancreas).</li>
 <li><b>Correctors</b> (<b>elexacaftor, tezacaftor</b>): fix the misfolded protein’s 3-D shape so it reaches the cell surface.</li>
 <li><b>Potentiator</b> (<b>ivacaftor</b>): opens the “gate” of CFTR channels already at the surface so chloride flows.</li>
 <li><b>Trikafta</b> = 2 correctors + 1 potentiator: it first increases the number of channels, then boosts their function → thinner mucus, better lung function, fewer infections.</li>
 <li><b>FDA-approved modulators:</b> Trikafta, Symdeko, Orkambi, Kalydeco.</li>
 <li><b>Serious side effects:</b> life-threatening <b>liver damage</b>; vision problems such as <b>cataracts in children</b>. Many <b>drug interactions</b>.</li>
 <li><b>Compliance:</b> the patient <b>continues all previous therapies</b> (dornase, airway clearance, etc.) unless advised otherwise.</li>
</ul>
${HOOK("Correctors fix the <b>shape</b> (they get the door built and installed). The potentiator <b>opens</b> the door. Names: e-<b>lexa</b>/<b>teza</b> = correctors; <b>iva</b> = “I-va open the gate”.")}
${TRAP("One F508del copy is enough; two are not required. Age 2 is the floor: an 18-month-old with the mutation is NOT a candidate. Pulmozyme is NOT a CFTR modulator.")}
`},
]},
{u:"steroids", title:"Corticosteroids & Anti-asthmatics", objs:[
{o:"s1", h:"Physiology of corticosteroids", body:`
<ul>
 <li>Corticosteroids block the <b>initial immune response</b> AND the <b>subsequent inflammatory process</b>, making them the <b>backbone of treatment for allergic asthma</b>.</li>
 <li>Two classes: <b>mineralocorticoids</b> (salt/water balance) and <b>glucocorticoids</b> (anti-inflammatory). Synthetic versions <b>optimize anti-inflammatory activity</b>.</li>
</ul>
<h4>The HPA axis</h4>
<div class="flow"><span>Hypothalamus</span>→<span>Pituitary</span>→<span>Adrenal glands</span>→<span>Cortisol</span><em>negative feedback ↺</em></div>
<ul>
 <li>A hormonal cascade and feedback loop that controls the stress response, digestion, immunity, mood and energy storage. It is responsible for the <b>normal diurnal variation</b> in blood steroid levels.</li>
 <li>The body <b>can’t tell exogenous drug from its own cortisol</b>, so long-term steroid therapy → <b>HPA suppression</b> → <b>adrenal atrophy</b>.</li>
 <li><b>Abrupt withdrawal</b> after prolonged use → the atrophied adrenals can’t make cortisol → <b>acute adrenal crisis</b>. Prevention: <b>taper over weeks or months</b>.</li>
</ul>
<div class="say"><b>Say it to the patient</b>“Your body makes its own steroid hormone, called cortisol, in two small glands on top of your kidneys. Your brain works like a thermostat: when cortisol is low, it tells those glands to make more. When you take steroid pills for a long time, your brain sees plenty of steroid and tells the glands to rest, so they get lazy and shrink. If you suddenly stop the pills, your body is left with too little cortisol until the glands wake up, which can make you very weak, dizzy, or even dangerously sick. That’s why we lower the dose slowly instead of stopping all at once.”</div>
<h4>Mechanism of action (slide 8)</h4>
${T(["Cellular","Clinical"],[
 ["Block arachidonic-acid metabolites (<b>leukotrienes and prostaglandins</b>)","↓ airway inflammation"],
 ["↓ monocytes, <b>eosinophils</b>, basophils","↓ airway obstruction"],
 ["↓ lymphocytes and macrophages","↑ oxygenation"],
 ["Inhibit <b>late-phase</b> inflammation","↑ <b>response to β-agonists</b>"],
])}
<h4>Time dependence (slide 9)</h4>
${T(["Effect","Timing"],[
 ["↑ number and availability of β receptors (restores β-agonist response)","<b>2–4 h</b> after IV dose, the rationale for an <b>IV bolus in status asthmaticus</b>"],
 ["Reverse seasonal bronchial hyperresponsiveness","At least <b>1 week</b>"],
 ["↓ exercise-induced bronchospasm sensitivity","After <b>4 weeks</b>"],
])}
`},
{o:"s2", h:"Recommend & manage a patient on inhaled corticosteroids", body:`
<h4>Patient-teaching checklist</h4>
<ul class="check">
 <li>It’s a <b>daily controller</b> for long-term maintenance and prevention, <b>not a rescue inhaler</b>. Keep a SABA (albuterol) for attacks.</li>
 <li>Use it <b>every day, even when you feel well</b>.</li>
 <li>Use a <b>spacer/valved holding chamber</b> with a pMDI.</li>
 <li><b>Rinse, gargle and spit</b> after each dose (spacer + gargling ↓ oropharyngeal deposition → ↓ thrush).</li>
 <li><b>Set expectations:</b> symptoms improve in <b>1–2 weeks</b> with maximum benefit at <b>4–8 weeks</b>; FEV₁/PEF peak at <b>3–6 weeks</b>; BHR improves over <b>1–3 months</b> and keeps improving for a year.</li>
</ul>
<h4>Ongoing management</h4>
${T(["Finding","What to do"],[
 ["“It’s not working” after a few days","Reassure: onset is 1–2 weeks. Reinforce daily use."],
 ["Using it only when wheezy","Re-teach controller vs rescue."],
 ["White patches in mouth / sore throat","Oropharyngeal candidiasis: treat it, add a spacer, rinse and spit. <b>Don’t stop the ICS.</b>"],
 ["Hoarseness / voice change, white spots, “funny taste”","Classic <b>ICS local side effects</b>: dysphonia plus oral thrush. Antifungal (e.g., nystatin swish or clotrimazole troche) per prescriber, spacer, rinse/gargle and spit, check technique, consider the lowest effective dose or a different device. Follow up to confirm it clears."],
 ["Rising rescue-inhaler use","Check <b>technique and adherence first</b>, then step up (higher-dose ICS or ICS-LABA combination)."],
 ["Also on oral steroids","Higher thrush risk. Never stop long-term OCS abruptly; <b>taper</b>."],
])}
<p><b>Remodeling:</b> ICS prevent or reduce airway remodeling and reduce BHR, but <b>can’t completely reverse</b> established smooth-muscle hyperplasia or fibrosis. That’s a reason to start a controller early.</p>
${TRAP("ICS for an acute attack = wrong (onset is weeks). ICS + thrush = keep the ICS and fix the technique, don’t discontinue.")}
`},
{o:"s3", h:"Side effects & adverse effects", body:`
<div class="two">
<div><h4>Systemic (oral / IV, long-term)</h4>
<p><b>Iatrogenic Cushing syndrome (slide 11):</b></p>
<ul>
 <li>Moon face</li><li>Buffalo hump</li><li>Obesity; abdominal striae</li><li>Osteoporosis</li><li>Muscle <b>wasting</b> of the extremities</li><li>Skin ulcers / poor wound healing</li><li>Cardiac hypertrophy</li><li>Women: dark facial hair, amenorrhea</li>
</ul>
<p><b>HPA suppression</b> → adrenal atrophy → <b>adrenal crisis</b> if stopped abruptly.</p>
${NOTE("Even short courses commonly cause hyperglycemia, fluid retention and mood changes/insomnia (see Table 7–3 below).")}
</div>
<div><h4>Local (inhaled)</h4>
<ul>
 <li><b>Oropharyngeal fungal infection</b>, <i>Candida albicans</i> or <i>Aspergillus niger</i>, in the mouth, pharynx and larynx.</li>
 <li>Occurrence and severity are <b>dose-related</b>, and more likely if the patient is <b>also taking oral steroids</b>.</li>
 <li>Prevent it with a <b>spacer</b> and <b>gargling</b> after treatment.</li>
</ul>
${NOTE("Also seen (textbook): dysphonia/hoarseness, cough.")}
<p>Systemic risk with ICS is <b>very low at therapeutic doses</b>.</p>
</div></div>
<h4>Side effects by body system (Table 7–3)</h4>
${T(["Category","Side effects"],[
 ["Immunologic","Immunosuppression; <b>increased susceptibility to infections</b>"],
 ["Cardiovascular","<b>Edema</b>; <b>hypertension</b>"],
 ["CNS","<b>Euphoria</b>; <b>insomnia</b>"],
 ["Dermatologic","<b>Thin skin</b>; impaired wound healing; <b>bruising</b>; altered fat distribution"],
 ["Endocrinologic","<b>Diabetes</b> (hyperglycemia); Cushingoid state"],
 ["Metabolic","<b>Electrolyte imbalance</b>; <b>negative nitrogen balance</b> (protein breakdown)"],
 ["Musculoskeletal","Muscle weakness; <b>osteoporosis</b>; <b>growth suppression</b> (children)"],
 ["Ophthalmic","<b>Glaucoma</b>"],
])}
${HOOK("Steroids make you <b>Sweet</b> (diabetes), <b>Puffy</b> (edema, HTN), <b>Wired</b> (euphoria, insomnia), <b>Fragile</b> (thin skin, bruising, osteoporosis, weak muscles), <b>Infected</b> (immunosuppression), <b>Short</b> (growth suppression) and <b>Pressured eyes</b> (glaucoma).")}
${HOOK("Cushingoid = <b>“round in the middle, thin at the edges”</b>: moon face, buffalo hump and belly fat, but skinny, wasted arms and legs.")}
${TRAP("Muscle HYPERtrophy is a wrong answer; it’s muscle WASTING.")}
`},
{o:"s4", h:"Pharmacotherapy: oral, parenteral and inhaled corticosteroids", body:`
${T(["Feature","Oral (OCS)","Parenteral (IV)","Inhaled (ICS)"],[
 ["Primary use","Acute flare-ups / severe exacerbations (short “burst”)","Severe exacerbation, <b>status asthmaticus</b>, patients who can’t take PO","<b>Long-term daily maintenance / prevention</b>"],
 ["Onset","<b>4–6 h</b>","β-receptor effect in <b>2–4 h</b>","<b>1–2 weeks</b>"],
 ["Peak","<b>24–48 h</b>","—","<b>4–8 weeks</b>"],
 ["Delivery","Systemic","Systemic","<b>Localized</b>"],
 ["Systemic side-effect risk","<b>High</b>","<b>High</b>","<b>Very low</b> at therapeutic doses"],
 ["Examples*","Prednisone","Methylprednisolone","Beclomethasone, budesonide, fluticasone"],
])}
${NOTE("*Example drug names are general knowledge, not from the slides. A short (~5-day) burst doesn’t need a taper; prolonged therapy does.")}
${HOOK("<b>O</b>ral = <b>O</b>nset in hours. <b>I</b>nhaled = <b>I</b>nvestment over weeks. <b>IV</b> = fastest route back to β-agonist responsiveness.")}
`},
{o:"s5", h:"Leukotriene modifiers in asthma", body:`
<p><b>What leukotrienes do (slide 19):</b></p>
<ul>
 <li>Contract airway smooth muscle</li><li>Vasodilation</li><li>↑ vascular permeability</li><li>↑ mucus secretion</li><li>↓ mucociliary clearance</li>
</ul>
<div class="key"><b>Leukotriene modifiers</b> block the action of leukotrienes (triggers for asthma attacks). They are <b>alternatives to low-dose inhaled steroids in mild persistent asthma</b> and are used for <b>long-term control, NOT acute treatment</b>.</div>
${NOTE("Example (general knowledge): montelukast, an oral tablet taken daily. Corticosteroids also block leukotriene production upstream by blocking arachidonic-acid metabolites.")}
${TRAP("“Take your montelukast during the attack” = wrong; use the rescue SABA. For moderate/severe persistent asthma, an ICS-based controller is preferred over an LTM alone.")}
`},
{o:"s6", h:"Allergic inflammation, mast cell stabilizers & antihistamines (textbook review)", body:`
<h4>The allergic cascade</h4>
<div class="flow"><span>Allergen</span>→<span>binds <b>IgE</b> on mast cells</span>→<span>mast cell degranulates</span>→<span>histamine, leukotrienes, prostaglandins</span></div>
<ul>
 <li><b>IgE</b> is the antibody behind allergic asthma and allergic rhinitis. It coats mast cells, and when an allergen cross-links two IgE molecules, the mast cell releases its mediators.</li>
 <li>The mediators cause bronchospasm, mucosal edema (vascular leak) and mucus secretion. In the nose and eyes they cause congestion, itching, sneezing and watery eyes.</li>
</ul>
<h4>Early vs late phase</h4>
${T(["","Early (immediate) phase","Late phase"],[
 ["Timing","Within minutes (peaks ~15–30 min); resolves in about 1–2 h","Develops ~4–8 h later; can last 24 h or more"],
 ["What drives it","Mast-cell mediators: histamine, leukotrienes, prostaglandins","Recruited inflammatory cells: <b>eosinophils</b>, neutrophils, lymphocytes"],
 ["Result","Bronchospasm, edema, mucus","Ongoing airway inflammation, ↑ bronchial hyperresponsiveness, prolonged obstruction"],
 ["Drugs that help","<b>SABA</b> reverses the bronchospasm; <b>cromolyn</b> taken beforehand prevents it","<b>Corticosteroids</b> block it; <b>cromolyn</b> taken beforehand blunts it"],
])}
<p><b>Why it matters for drug therapy:</b> a rescue bronchodilator treats only the early bronchospasm. If the late phase isn’t controlled with an anti-inflammatory, the patient gets worse hours later and the airways become more twitchy over time.</p>
<h4>Factors that influence mediator release from mast cells</h4>
<ul>
 <li><b>Allergen exposure</b> cross-linking IgE on the mast cell surface (the main trigger)</li>
 <li><b>Intracellular cAMP:</b> ↑ cAMP <i>inhibits</i> release (β-agonists raise cAMP). ↑ cGMP from cholinergic/vagal stimulation <i>promotes</i> release</li>
 <li><b>Calcium influx</b> into the mast cell, which is needed for degranulation (cromolyn interferes with it)</li>
 <li><b>Non-allergic triggers:</b> exercise, cold or dry air, irritants and pollutants (smoke), respiratory infections</li>
</ul>
<h4>Comparing the anti-asthma and anti-allergy drugs</h4>
${T(["Drug","Class / action","Acute or chronic?","Key points"],[
 ["Albuterol (SABA)","β₂-agonist bronchodilator; also ↑ cAMP → <b>blocks histamine RELEASE</b>","<b>Acute</b> rescue","Treats early-phase bronchospasm; no effect on late-phase inflammation"],
 ["Prednisone (OCS)","Corticosteroid; <b>blocks mediator/histamine PRODUCTION</b> and inflammatory cells","<b>Both</b>: short burst for acute exacerbations; long-term only for severe persistent asthma","Onset 4–6 h. Taper after prolonged use"],
 ["Inhaled corticosteroid","Corticosteroid, localized","<b>Chronic</b> control","1–2 wk onset; spacer + rinse"],
 ["Cromolyn sodium","<b>Mast cell stabilizer</b>: <b>blocks histamine RELEASE</b> (degranulation)","<b>Chronic</b> / prophylactic only","Must be taken <b>before</b> exposure (e.g., 10–60 min before exercise or allergen) and regularly (nebulized 20 mg QID). Full benefit takes 2–4 weeks. Very few side effects (cough, throat irritation)"],
 ["Zileuton","Leukotriene modifier: <b>5-lipoxygenase inhibitor</b> (blocks leukotriene <i>production</i>)","<b>Chronic</b>","Oral; <b>monitor liver enzymes</b>"],
 ["Montelukast / zafirlukast","Leukotriene <b>receptor antagonists</b>","<b>Chronic</b>","Oral. Montelukast once daily in the evening (watch for mood/behavior changes); zafirlukast on an empty stomach"],
 ["Antihistamines","H₁-receptor blockers: block histamine’s <i>effects</i> after release","Allergic rhinitis / conjunctivitis","Not for acute asthma"],
])}
${HOOK("<b>Release vs production:</b> β-agonists and cromolyn keep the mast cell’s “bag” <b>closed</b> (block release). Corticosteroids <b>shut down the factory</b> (block production).")}
<h4>Antihistamines: important side effects</h4>
${T(["Effect","Notes"],[
 ["<b>Sedation / drowsiness</b>","Mainly <b>first-generation</b> drugs (diphenhydramine, chlorpheniramine) that cross into the brain. Worse with alcohol. No driving or operating machinery"],
 ["<b>Anticholinergic (drying)</b> effects","Dry mouth, blurred vision, urinary retention, constipation, tachycardia"],
 ["<b>Thickened, dried secretions</b>","Relevant to RTs: can make airway secretions harder to clear"],
 ["Paradoxical excitation","Especially in young children"],
 ["Second-generation drugs","Loratadine, cetirizine, fexofenadine: much <b>less sedating</b> (fexofenadine least; cetirizine can still cause drowsiness)"],
])}
<h4>Corticosteroid basics from the chapter review</h4>
<ul>
 <li>Classified as <b>mineralocorticoids and glucocorticoids</b>.</li>
 <li>Routes: <b>inhaled, oral, intranasal and parenteral</b> (all of them).</li>
</ul>
<h4>Using a SABA, an ICS and cromolyn together</h4>
<ol class="steps">
 <li><b>Bronchodilator first</b> (albuterol): opens the airways in minutes so the next drugs reach deeper.</li>
 <li><b>Mast cell stabilizer</b> (cromolyn): preventive, taken every day and before triggers; it won’t stop an attack already happening.</li>
 <li><b>Inhaled corticosteroid last</b>, then <b>rinse, gargle and spit</b>.</li>
</ol>
<p><b>Positive outcomes to expect:</b> fewer and milder attacks, less rescue-inhaler use, fewer night symptoms, higher and steadier peak flows, and less late-phase “second wave” worsening. These build over <b>weeks</b>, not minutes.</p>
${TRAP("Cromolyn and leukotriene modifiers are <b>never</b> rescue drugs. Prednisone can be <b>both</b> acute and chronic, while cromolyn and zileuton are chronic only.")}
`},
]},
{u:"calc", title:"Calculating Drug Doses", objs:[
{o:"c1", h:"Terms used to describe medication solutions", body:`
${DL([
 ["Percentage","Parts of active ingredient in a solution containing <b>100 parts</b>."],
 ["Strength","Amount of <b>solute</b> in a solution, usually expressed as a percentage."],
 ["Schedule","Amount of drug needed <b>based on the patient’s weight</b> (e.g., mg/kg)."],
 ["Solute","The substance or <b>active ingredient that is dissolved</b>; liquid or solid."],
 ["Solvent","The substance that <b>dissolves the solute</b> to make the solution."],
 ["Solution","A <b>physically homogeneous mixture</b> of two or more substances."],
 ["Diluent","Liquid (usually normal saline) added to a nebulized drug. It does <b>not</b> change the dose."],
])}
${HOOK("The sol<b>ute</b> is the cute little thing that gets dissolved; the sol<b>vent</b> is the big ocean that does the dissolving.")}
`},
{o:"c2", h:"Strength of solutions in percentage form", body:`
<div class="key"><b>% → mg/ml:</b> move the decimal <b>1 place RIGHT</b> (×10). <b>mg/ml → %:</b> move it <b>1 place LEFT</b> (÷10).<br><span class="small">Why: 1% = 1 g/100 ml = 1,000 mg/100 ml = <b>10 mg/ml</b>.</span></div>
${T(["Solution","%","mg/ml"],[
 ["Albuterol","0.5%","5 mg/ml"],
 ["Albuterol unit dose","0.083%","0.83 mg/ml (3 ml ≈ 2.5 mg)"],
 ["Ipratropium","0.02%","0.2 mg/ml"],
 ["Cromolyn","1%","10 mg/ml"],
 ["Acetylcysteine","10% / 20%","100 / 200 mg/ml"],
 ["Normal saline","0.9%","9 mg/ml"],
 ["Slide examples","2% · 7.5%","20 · 75 mg/ml"],
 ["Reverse","1% · 7.5%","from 10 · 75 mg/ml"],
])}
`},
{o:"c3", h:"Drug dosage calculations", body:`
<h4>The proportion method (slides 7–8)</h4>
<ol class="steps">
 <li><b>Convert</b> to consistent units (% → mg/ml; lb → kg ÷ 2.2; g → kg ÷ 1000).</li>
 <li><b>Set up</b>: Original dose / per amount = Desired dose / per amount.</li>
 <li><b>Solve</b>: ml = desired mg ÷ concentration (mg/ml).</li>
</ol>
<h4>Slide examples, worked</h4>
${T(["Order","Have","Concentration","Give"],[
 ["Albuterol 5 mg","0.5%","5 mg/ml","<b>1 ml</b>"],
 ["Albuterol 2.5 mg","0.5%","5 mg/ml","<b>0.5 ml</b>"],
 ["Acetylcysteine 500 mg","20%","200 mg/ml","<b>2.5 ml</b>"],
 ["Acetylcysteine 800 mg","10%","100 mg/ml","<b>8 ml</b>"],
])}
<h4>Weight-based (dosage schedule, slide 14)</h4>
<p>Get the weight first. <b>Dose = mg/kg × kg</b>, then use the proportion.</p>
<div class="work">Order: 0.1 mg/kg · child 44 lb · 0.5% solution<br>① 44 ÷ 2.2 = 20 kg ② 0.1 × 20 = 2 mg ③ 0.5% = 5 mg/ml ④ 2 ÷ 5 = <b>0.4 ml</b></div>
<h4>Diluent misconception (slide 15)</h4>
<p>Diluent does <b>not</b> weaken the dose. ½ ml of a 1% drug = <b>5 mg</b> whether diluted with 2 ml or 10 ml of saline. What’s left in the nebulizer is only diluent.</p>
<h4>Surfactant (review quizzes)</h4>
<p>Convert g → kg, then multiply: <b>Survanta 4 ml/kg · Infasurf 3 ml/kg · Curosurf 2.5 ml/kg</b> (1.25 ml/kg repeat). Example: Survanta for 800 g → 0.8 × 4 = <b>3.2 ml</b>.</p>
${TRAP("The commonest error is using the % as if it were mg/ml (e.g., drawing up 5 ml of 0.5% albuterol = 25 mg, 10× the 2.5 mg dose). Always convert first, and sanity-check that nebulizer drug volumes are usually 0.5–5 ml.")}
`},
]}
];

 ["IV steroid","β receptors ↑ in 2–4 h"],

 ["ICS","1–2 wk initial, 4–8 wk max; FEV₁ 3–6 wk; BHR 1–3 mo"],
 ["Seasonal BHR / EIB","≥1 week / 4 weeks"],
 ["Stop long-term steroids","Taper (weeks–months), or adrenal crisis"],

function renderGuide(){
  const cnt = o => Q.filter(q=>q.o===o).length;
  app.innerHTML = `
  <section class="card no-print-shadow">
    <div class="row between"><h2 style="margin:0">Exam study guide</h2>
      <div class="row no-print"><button class="btn" data-act="guideAll">Expand all</button><button class="btn" data-act="print">Print</button></div></div>
    <p class="muted small" style="margin:8px 0 0">Organized by your learning objectives and built from the lecture slides (Goss). Tap a section to open it, then use <b>Practice this</b> to quiz just that objective.</p>
    <div class="toc no-print">${GUIDE.map(g=>`<div><b>${g.title}</b><ol>${g.objs.map(x=>`<li><a href="#g-${x.o}" data-act="jump" data-k="${x.o}">${esc(x.h)}</a></li>`).join("")}</ol></div>`).join("")}</div>
  </section>
  <section class="card hy">
    <h3>Highest-yield facts</h3>
    ${T(["Topic","Know this"], HIGH_YIELD)}
  </section>
  ${GUIDE.map(g=>`
    <h2 class="unit-h">${unitTag(g.u)} ${g.title}</h2>
    ${g.objs.map((x,i)=>`
      <details class="card gsec" id="g-${x.o}">
        <summary><span class="onum">${i+1}</span><span>${esc(x.h)}</span></summary>
        <div class="gbody">${x.body}
          <div class="row end no-print" style="margin-top:14px"><button class="btn primary" data-act="practiceObj" data-k="${x.o}">Practice this · ${cnt(x.o)} questions</button></div>
        </div>
      </details>`).join("")}`).join("")}
  `;
}

/* ======================= ROUTING & EVENTS ======================= */
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab===state.tab));
  ({guide:renderGuide, quiz:renderQuiz, cases:renderCases, calc:renderCalc, terms:renderTerms})[state.tab]();
}

document.querySelector("nav.tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if (!b) return;
  state.tab = b.dataset.tab; render(); window.scrollTo(0,0);
});

app.addEventListener("input", e => {
  const k = e.target.dataset.draft;
  if (k && state.caseId) (state.caseDraft[state.caseId] ||= {med:"", why:""})[k] = e.target.value;
});
app.addEventListener("change", e => {
  const act = e.target.dataset.act;
  if (act==="obj"){ state.obj = e.target.value; render(); }
  if (act==="missed"){ state.missedOnly = e.target.checked; render(); }
});

app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const act = b.dataset.act, z = state.quiz;
  switch (act){
    case "set": {
      const k = b.dataset.k, v = b.dataset.v;
      state[k] = (k==="len" && v!=="all") ? Number(v) : v;
      if (k==="unit") state.obj = "all";
      if (k==="calcType") state.calc = null;
      render(); break;
    }
    case "quizObj": state.obj = b.dataset.k; state.unit = OBJ[b.dataset.k].u; render(); window.scrollTo(0,0); break;
    case "start": {
      const p = shuffle(pool().slice());
      startQuiz(p.slice(0, state.len==="all" ? p.length : state.len)); break;
    }
    case "pick": {
      const it = z.items[z.i];
      if (z.mode==="practice" && it.pick!==null) return;
      it.pick = Number(b.dataset.i);
      if (z.mode==="practice") markMissed(it.q.id, !isRight(it));
      render(); break;
    }
    case "next": z.i++; render(); window.scrollTo(0,0); break;
    case "prev": z.i--; render(); window.scrollTo(0,0); break;
    case "finish":
      z.done = true;
      if (z.mode==="exam") z.items.forEach(it => markMissed(it.q.id, !isRight(it)));
      render(); window.scrollTo(0,0); break;
    case "quit": state.quiz = null; render(); window.scrollTo(0,0); break;
    case "retryWrong": startQuiz(shuffle(z.items.filter(it=>!isRight(it)).map(it=>it.q))); break;
    case "openCase": openCase(b.dataset.k); break;
    case "closeCase": state.caseId = null; render(); window.scrollTo(0,0); break;
    case "casePick": {
      const i = Number(b.dataset.s), a = state.caseAns[i];
      if (a.pick!==null) return;
      a.pick = Number(b.dataset.i);
      if (state.caseAns.every(x => x.pick!==null)){
        const r = state.caseAns.filter(x => x.order[x.pick]===0).length;
        saved.cases[state.caseId] = Math.max(saved.cases[state.caseId] ?? 0, r); save();
      }
      render(); const el = $("#step"+i); if (el) el.scrollIntoView({block:"nearest"});
      break;
    }
    case "caseNext": {
      state.caseStep++; render();
      const el = $("#step"+state.caseStep); if (el) el.scrollIntoView({behavior:"smooth", block:"start"});
      break;
    }
    case "calcCheck": checkCalc(); break;
    case "calcSkip": state.calc = null; render(); break;
    case "calcNext": state.calc = null; render(); setTimeout(()=>{ const i=$("#calcIn"); if(i) i.focus(); }, 0); break;
    case "term": b.classList.toggle("open"); break;
    case "practiceObj": {
      const k = b.dataset.k;
      Object.assign(state, {tab:"quiz", quiz:null, obj:k, unit:OBJ[k].u, set:"all", missedOnly:false});
      render(); window.scrollTo(0,0); break;
    }
    case "guideAll": {
      const all = [...app.querySelectorAll("details.gsec")], open = all.some(d => !d.open);
      all.forEach(d => d.open = open); b.textContent = open ? "Collapse all" : "Expand all"; break;
    }
    case "print": app.querySelectorAll("details.gsec").forEach(d => d.open = true); window.print(); break;
    case "jump": {
      e.preventDefault(); const d = document.getElementById("g-"+b.dataset.k);
      if (d){ d.open = true; d.scrollIntoView({behavior:"smooth", block:"start"}); } break;
    }
    case "expandAll": {
      const all = [...app.querySelectorAll(".term")], open = all.some(t => !t.classList.contains("open"));
      all.forEach(t => t.classList.toggle("open", open)); b.textContent = open ? "Hide all" : "Show all"; break;
    }
  }
});

window.addEventListener("beforeprint", () => { if (state.tab!=="guide"){ state.tab="guide"; render(); } app.querySelectorAll("details.gsec").forEach(d => d.open = true); });
/* Theme */
const root = document.documentElement;
try { const t = localStorage.getItem(KEY+"-theme"); if (t) root.dataset.theme = t; } catch(e){}
$("#themeBtn").addEventListener("click", () => {
  const dark = root.dataset.theme ? root.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem(KEY+"-theme", root.dataset.theme); } catch(e){}
});
$("#resetBtn").addEventListener("click", () => {
  if (!confirm("Clear missed questions and case scores saved in this browser?")) return;
  saved = {missed:[], cases:{}, quizzes:0}; save(); state.quiz = null; state.calcStats = {c:0,t:0,streak:0}; render();
});

render();
</script>
</body>
