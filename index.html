{id:"m10",u:"mucus",o:"m3",q:"Which statement about aerosolized NAC is supported by the lecture?",c:["Despite in-vitro mucolytic activity and long use, there are no data showing it is effective therapy for any lung disease","It is first-line maintenance therapy for COPD","It is the preferred agent for sputum induction","It works mainly by improving ciliary activity"],e:"Despite in-vitro mucolytic activity and a long history of use, there are no data showing aerosolized NAC is effective therapy for any lung disease.",s:"Mucus slide 20"},
{id:"m11",u:"mucus",o:"m1",q:"What is the difference between sterile and distilled water?",c:["Sterile water is free of microorganisms (may contain bacteriostatic additives); distilled water is both sterile and pure, with all other constituents removed","Distilled water may contain bacteria; sterile water cannot","They are identical terms","Sterile water is hypertonic; distilled water is hypotonic"],e:"Sterile = free of microorganisms (may have bacteriostatic additives). Distilled = sterile AND pure, with no additives and all other constituents removed.",s:"Mucus slide 10"},
{id:"m12",u:"mucus",o:"m3",q:"Any solution intended for inhalation must be:",c:["Sterile — it does not need to be distilled","Distilled — it does not need to be sterile","Both sterile and hypertonic","Bacteriostatic and isotonic"],e:"Any solution intended for inhalation must be sterile; water does not need to be distilled.",s:"Mucus slide 10"},
{id:"m13",u:"mucus",o:"m2",q:"Why may sterile water thin mucus more effectively than normal saline?",c:["It is hypotonic and more readily absorbed by mucus","It is hypertonic and draws water into the airway","It breaks disulfide bonds","It is isotonic and non-irritating"],e:"Sterile water is hypotonic, so it is more readily absorbed by mucus and may thin it more effectively than saline.",s:"Mucus slide 11"},
{id:"m14",u:"mucus",o:"m3",q:"Which bland aerosol is MOST likely to cause bronchospasm?",c:["Hypertonic saline (1.8%–10%)","Normal saline (0.9%)","Hypotonic saline (0.45%)","Bacteriostatic normal saline"],e:"Hypertonic saline is more likely to cause bronchospasm than any of the other bland aerosols.",s:"Mucus slide 14"},
{id:"m15",u:"mucus",o:"m3",q:"Which bland aerosol is commonly used to induce a cough and obtain a sputum sample?",c:["Hypertonic saline","Hypotonic saline 0.45%","Normal saline 0.9%","Distilled water as a croup-tent mist"],e:"Hypertonic saline (1.8%–10%) is commonly used to induce a cough and sputum sample. The irritation and cough from dense aerosols make them useful for sputum induction.",s:"Mucus slides 11 & 14"},
{id:"m16",u:"mucus",o:"m3",q:"Hypertonic saline is beneficial in which population, but may decrease lung function in which population?",c:["Beneficial in cystic fibrosis; may decrease lung function in COPD","Beneficial in COPD; harmful in cystic fibrosis","Beneficial in asthma; harmful in croup","Beneficial in croup; harmful in CF"],e:"Hypertonic saline may cause a decrease in lung function in COPD, but is beneficial in CF, where it improves mucus clearance and subsequently lung function.",s:"Mucus slide 14"},
{id:"m17",u:"mucus",o:"m3",q:"Which solution is described as less irritating than both sterile water and hypertonic saline and is used with ultrasonic and large-volume nebulizers?",c:["0.45% (hypotonic) saline","3% saline","7% saline","Undiluted 20% acetylcysteine"],e:"0.45% saline is less irritating than sterile water or hypertonic saline and is used with ultrasonic nebulizers, any large-volume nebulizer, or as a diluent.",s:"Mucus slide 12"},
{id:"m18",u:"mucus",o:"m3",q:"Why is 0.9% saline well tolerated and frequently used as a diluent?",c:["It is isotonic to the body, less irritating, and less likely to cause bronchospasm","It is hypotonic and readily absorbed into mucus","It contains a mucolytic additive","It is hypertonic and induces cough"],e:"Normal saline is isotonic to the body, so it is well tolerated, less irritating, less likely to cause bronchospasm, and frequently used as a diluent.",s:"Mucus slide 13"},
{id:"m19",u:"mucus",o:"m3",q:"A drawback of large-volume and ultrasonic nebulizers delivering bland aerosol is that they:",c:["Can produce runny, watery secretions that impair the mucociliary system","Cannot deliver significant volumes of aerosol","Cause adrenal suppression","Only work with distilled water"],e:"Large-volume and ultrasonic nebulizers deliver significant volumes of aerosol and have been shown to cause runny, watery secretions — and thin secretions impair mucociliary function.",s:"Mucus slide 6"},
{id:"m20",u:"mucus",o:"m3",q:"Which patient is MOST likely to benefit from mucoactive drug therapy?",c:["A patient with an impaired cough and reduced expiratory airflow","A patient with a strong cough and normal airflow","A patient with seasonal rhinitis and no sputum","Every patient with any amount of sputum"],e:"Not all patients with retained mucus benefit. Those with impaired cough clearance and reduced expiratory airflow benefit most; a strong cough with preserved airflow usually clears secretions without drugs.",s:"Mucus slide 17"},
{id:"m21",u:"mucus",o:"m4",q:"When should mucoactive drugs be given relative to airway clearance techniques?",c:["Before airway clearance, to decrease viscosity and enhance clearance","After airway clearance, to soothe the airway","Only on days airway clearance is skipped","Timing does not matter"],e:"Mucoactive therapy should be given BEFORE physical airway clearance to decrease viscosity, enhance clearance, and reduce infection/inflammation risk.",s:"Mucus slide 17"},
{id:"m22",u:"mucus",o:"m3",q:"Which is NOT one of the listed goals of mucus-controlling therapy?",c:["Directly relaxing airway smooth muscle","Improving pulmonary function","Improving gas exchange","Preventing repeated infection and airway damage"],e:"The clinical indication is to reduce accumulated secretions with improvement in pulmonary function and gas exchange, and to prevent repeated infection and airway damage.",s:"Mucus slide 16"},
{id:"m23",u:"mucus",o:"m1",q:"Direct instillation of a drug into the respiratory tract is performed through all of the following EXCEPT:",c:["A simple oxygen mask","An artificial airway","Bronchoscopy","A transtracheal catheter"],e:"Direct instillation is performed in patients with artificial airways, during bronchoscopy, or through a transtracheal catheter.",s:"Mucus slide 7"},
{id:"m24",u:"mucus",o:"m5",q:"The CFTR protein normally functions as:",c:["A cell-surface channel controlling movement of chloride and water","An enzyme that digests extracellular DNA","A β2 receptor on airway smooth muscle","A mucin protein linked by disulfide bonds"],e:"CFTR acts as a channel on the cell surface controlling chloride and water movement — essential for thin, slippery mucus. Defective or absent CFTR causes thick, sticky mucus.",s:"Mucus slide 25"},
{id:"m25",u:"mucus",o:"m5",q:"Which CFTR modulator is a potentiator?",c:["Ivacaftor","Elexacaftor","Tezacaftor","Dornase alfa"],e:"Potentiators (ivacaftor) act on CFTR channels already at the cell surface and help open the gate. Correctors (elexacaftor, tezacaftor) help misfolded protein fold and reach the surface.",s:"Mucus slide 26"},
{id:"m26",u:"mucus",o:"m5",q:"What does a CFTR corrector such as elexacaftor or tezacaftor do?",c:["Helps misfolded CFTR protein form its correct 3-D shape and move to the cell surface","Holds open the gate of channels already at the surface","Breaks DNA strands in mucus","Blocks leukotriene receptors"],e:"Correctors fix folding and trafficking so more CFTR reaches the cell surface; the potentiator then boosts the function of those channels.",s:"Mucus slides 26–27"},
{id:"m27",u:"mucus",o:"m5",q:"Trikafta is indicated for which patients?",c:["Age 2 years and older with at least one F508del mutation or another responsive CFTR mutation","Any age with two copies of any CFTR mutation","Adults only, with any CF diagnosis","Age 12 and older with COPD"],e:"Trikafta (elexacaftor/tezacaftor/ivacaftor) is indicated for individuals aged 2 years and older with at least one copy of F508del or another responsive mutation.",s:"Mucus slide 28"},
{id:"m28",u:"mucus",o:"m5",q:"Which patient is NOT a candidate for Trikafta based on lecture criteria?",c:["An 18-month-old with two F508del copies","A 3-year-old with one F508del copy","A 25-year-old homozygous for F508del","A 10-year-old with one F508del copy and one other mutation"],e:"The 18-month-old has the mutation but does not meet the age criterion (2 years and older).",s:"Mucus slide 28"},
{id:"m29",u:"mucus",o:"m4",q:"A 15-year-old with CF (one F508del copy) starts Trikafta. What is the correct regimen?",c:["AM: two orange tablets (elexacaftor 100/tezacaftor 50/ivacaftor 75 mg); PM: one light blue tablet (ivacaftor 150 mg)","AM: one orange tablet; PM: one orange tablet","AM: two light orange tablets (50/25/37.5 mg); PM: ivacaftor 75 mg","AM: one packet of granules; PM: one packet of granules"],e:"Adults and children 12+: two orange tablets in the morning and one light blue ivacaftor 150 mg tablet in the evening.",s:"Mucus slide 30"},
{id:"m30",u:"mucus",o:"m4",q:"An 8-year-old weighing 25 kg is prescribed Trikafta. Which regimen is correct?",c:["AM: two light orange tablets (elexacaftor 50/tezacaftor 25/ivacaftor 37.5 mg); PM: one light blue tablet (ivacaftor 75 mg)","AM: two orange tablets (100/50/75 mg); PM: ivacaftor 150 mg","AM: one packet granules (80/40/60 mg); PM: ivacaftor 59.5 mg","AM: one orange tablet only"],e:"Age 6 to <12 years and <30 kg: two light orange tablets AM, one light blue ivacaftor 75 mg tablet PM. (≥30 kg uses the adult dose.)",s:"Mucus slide 30"},
{id:"m31",u:"mucus",o:"m4",q:"A 4-year-old weighing 12 kg is prescribed Trikafta. Which regimen is correct?",c:["AM: one packet of granules (elexacaftor 80/tezacaftor 40/ivacaftor 60 mg); PM: one packet ivacaftor 59.5 mg","AM: one packet (100/50/75 mg); PM: one packet ivacaftor 75 mg","AM: two light orange tablets; PM: ivacaftor 75 mg tablet","Not eligible until age 6"],e:"Age 2 to <6 years and <14 kg: AM granules 80/40/60 mg; PM granules ivacaftor 59.5 mg.",s:"Mucus slide 30"},
{id:"m32",u:"mucus",o:"m4",q:"A 5-year-old weighing 16 kg is prescribed Trikafta. Which regimen is correct?",c:["AM: one packet of granules (elexacaftor 100/tezacaftor 50/ivacaftor 75 mg); PM: one packet ivacaftor 75 mg","AM: one packet (80/40/60 mg); PM: one packet ivacaftor 59.5 mg","AM: two orange tablets; PM: ivacaftor 150 mg","AM: two light orange tablets; PM: none"],e:"Age 2 to <6 years and ≥14 kg: AM granules 100/50/75 mg; PM granules ivacaftor 75 mg.",s:"Mucus slide 30"},
{id:"m33",u:"mucus",o:"m4",q:"How is Trikafta taken?",c:["Orally with fat-containing food, usually twice daily about 12 hours apart","By nebulizer twice daily","Orally on an empty stomach once daily","IV once weekly"],e:"Trikafta is oral, taken with fatty foods, usually twice a day about 12 hours apart.",s:"Mucus slide 29"},
{id:"m34",u:"mucus",o:"m5",q:"Which serious adverse effects of Trikafta were highlighted?",c:["Life-threatening liver damage and vision problems such as cataracts in children","Oral candidiasis and dysphonia","Adrenal crisis on abrupt withdrawal","Bronchospasm and hypernatremia"],e:"Potential serious side effects: life-threatening liver damage and vision problems such as cataracts in children. It also has drug interactions.",s:"Mucus slide 29"},
{id:"m35",u:"mucus",o:"m5",q:"A teen on Trikafta feels much better and wants to stop dornase alfa and airway clearance. Best response?",c:["Continue all previous therapies unless the prescriber advises otherwise","Stop all inhaled therapies since Trikafta replaces them","Stop airway clearance but keep dornase alfa","Double the Trikafta dose instead"],e:"Compliance and education are key — the patient should continue all previous therapies unless advised otherwise.",s:"Mucus slide 29"},
{id:"m36",u:"mucus",o:"m5",q:"Which is NOT an FDA-approved CFTR modulator product?",c:["Pulmozyme","Trikafta","Symdeko","Kalydeco"],e:"FDA-approved CFTR modulators: Trikafta, Symdeko, Orkambi, Kalydeco. Pulmozyme is dornase alfa, a peptide mucolytic.",s:"Mucus slide 27"},

/* ---------- STEROIDS ---------- */
{id:"s01",u:"steroids",o:"s1",q:"Corticosteroids are classified into which two groups?",c:["Mineralocorticoids and glucocorticoids","Agonists and antagonists","Correctors and potentiators","Leukotrienes and prostaglandins"],e:"Corticosteroids are classified into mineralocorticoids and glucocorticoids; synthetic versions were developed to optimize anti-inflammatory activity.",s:"Steroids slide 3"},
{id:"s02",u:"steroids",o:"s1",q:"Why are corticosteroids the backbone of treatment for allergic asthma?",c:["They block the initial immune response and the subsequent inflammatory process","They relax bronchial smooth muscle within minutes","They break down mucus","They block muscarinic receptors"],e:"Corticosteroids can block both the initial immune response and the subsequent inflammatory process.",s:"Steroids slide 3"},
{id:"s03",u:"steroids",o:"s1",q:"The HPA axis consists of which three glands?",c:["Hypothalamus, pituitary, adrenal glands","Hypothalamus, pancreas, adrenal glands","Pituitary, thyroid, adrenal glands","Hypothalamus, pituitary, thyroid"],e:"The hypothalamic–pituitary–adrenal axis is a hormonal cascade and feedback loop that controls corticosteroid release.",s:"Steroids slide 4"},
{id:"s04",u:"steroids",o:"s1",q:"The HPA axis is responsible for which normal pattern of steroid levels?",c:["Diurnal (daily) variation in blood steroid levels","Constant levels around the clock","A monthly cycle","Seasonal variation only"],e:"The HPA axis controls corticosteroid release and is responsible for the normal diurnal variation in steroid blood levels.",s:"Steroids slide 4"},
{id:"s05",u:"steroids",o:"s1",q:"Why does long-term exogenous corticosteroid therapy cause HPA suppression?",c:["The body cannot distinguish exogenous glucocorticoids from its own, so production shuts down and the adrenals atrophy","The drug destroys the pituitary gland","Exogenous steroids are pure mineralocorticoids","The liver stops metabolizing cortisol"],e:"Because the body cannot tell endogenous from exogenous glucocorticoids, it suppresses the HPA axis and the adrenal glands atrophy.",s:"Steroids slide 5"},
{id:"s06",u:"steroids",o:"s3",q:"A patient on prednisone for a year stops it abruptly. What is the major risk?",c:["Acute adrenal crisis","Oral candidiasis","Cataracts","Paradoxical bronchospasm"],e:"Atrophied adrenal glands cannot immediately manufacture cortisol when steroids are stopped suddenly, leading to an acute adrenal crisis.",s:"Steroids slide 6"},
{id:"s07",u:"steroids",o:"s2",q:"How should prolonged systemic corticosteroid therapy be discontinued?",c:["Gradually tapered over weeks or months","Stopped abruptly once symptoms resolve","Switched immediately to a leukotriene modifier","Stopped and restarted only during flares"],e:"Tapering protocols: gradually taper exogenous steroids over weeks or months.",s:"Steroids slide 6"},
{id:"s08",u:"steroids",o:"s1",q:"Corticosteroids reduce inflammation by all of the following EXCEPT:",c:["Increasing circulating eosinophils and basophils","Blocking arachidonic acid metabolites (leukotrienes and prostaglandins)","Decreasing lymphocytes and macrophages","Inhibiting late-phase inflammation"],e:"Corticosteroids DECREASE monocytes, eosinophils, basophils, lymphocytes and macrophages, block arachidonic acid metabolites, and inhibit late-phase inflammation.",s:"Steroids slide 8"},
{id:"s09",u:"steroids",o:"s4",q:"What is the rationale for an IV corticosteroid bolus in status asthmaticus?",c:["Glucocorticoids increase the number and availability of β receptors within 2–4 hours, restoring responsiveness to β-agonists","IV steroids cause immediate bronchodilation within 5 minutes","IV steroids prevent oral thrush","IV steroids replace the need for oxygen"],e:"Within 2–4 hours after IV administration, glucocorticoids increase the number and availability of β receptors — the rationale for a bolus in status asthmaticus.",s:"Steroids slide 9"},
{id:"s10",u:"steroids",o:"s4",q:"Seasonal bronchial hyperresponsiveness requires how much steroid therapy to reverse?",c:["At least one week","2–4 hours","24 hours","One year"],e:"Seasonal BHR requires at least a week of therapy to reverse.",s:"Steroids slide 9"},
{id:"s11",u:"steroids",o:"s4",q:"Sensitivity to exercise-induced bronchospasm (EIB) decreases after about how long of corticosteroid therapy?",c:["4 weeks","2–4 hours","3 days","6 months"],e:"EIB sensitivity decreases after about 4 weeks of therapy.",s:"Steroids slide 9"},
{id:"s12",u:"steroids",o:"s2",q:"A patient started on an ICS 5 days ago says it “isn’t working.” Best response?",c:["Improvement typically begins in 1–2 weeks with maximum benefit at 4–8 weeks, so keep using it daily","Stop the ICS and use it only during attacks","Double the dose immediately","Switch to an oral steroid for maintenance"],e:"ICS produce symptom improvement in the first 1–2 weeks, with maximum improvement at 4–8 weeks.",s:"Steroids slide 16"},
{id:"s13",u:"steroids",o:"s4",q:"When do FEV1 and PEF typically reach maximum improvement on inhaled corticosteroids?",c:["3–6 weeks","24–48 hours","4–6 hours","1–2 days"],e:"FEV1 and PEF may take 3–6 weeks for maximum improvement.",s:"Steroids slide 16"},
{id:"s14",u:"steroids",o:"s4",q:"Improvement in bronchial hyperresponsiveness on ICS:",c:["Can take 1–3 months and may continue over a year","Is complete within 24 hours","Occurs only with oral steroids","Never occurs"],e:"BHR improvement can take one to three months and continue over a year.",s:"Steroids slide 16"},
{id:"s15",u:"steroids",o:"s4",q:"Initial onset and peak effect of oral corticosteroids:",c:["Onset 4–6 hours; peak 24–48 hours","Onset 1–2 weeks; peak 4–8 weeks","Onset 5 minutes; peak 1 hour","Onset 2 days; peak 2 weeks"],e:"OCS: initial onset 4–6 hours, peak effect 24–48 hours. ICS: initial improvement 1–2 weeks, full effect 4–8 weeks.",s:"Steroids slide 17"},
{id:"s16",u:"steroids",o:"s4",q:"Which statement correctly compares oral and inhaled corticosteroids?",c:["OCS: acute flare-ups, systemic, high side-effect risk; ICS: long-term maintenance, localized, very low risk at therapeutic doses","OCS: maintenance, localized; ICS: acute flare-ups, systemic","Both have identical onset and side-effect risk","ICS are preferred for severe acute exacerbations"],e:"OCS are for acute flare-ups/severe exacerbations, act systemically and carry high systemic side-effect risk. ICS are for daily maintenance/prevention, act locally, and have very low systemic risk at therapeutic doses.",s:"Steroids slide 17"},
{id:"s17",u:"steroids",o:"s3",q:"Which finding is NOT a feature of iatrogenic Cushing syndrome?",c:["Muscle hypertrophy of the extremities","Moon face","Buffalo hump","Abdominal striae and poor wound healing"],e:"Cushingoid features include moon face, buffalo hump, osteoporosis, muscle WASTING in the extremities, skin ulcers/poor wound healing, abdominal striae, obesity, and cardiac hypertrophy (plus dark facial hair and amenorrhea in women).",s:"Steroids slide 11"},
{id:"s18",u:"steroids",o:"s3",q:"Which organisms are associated with oropharyngeal infections from ICS use?",c:["Candida albicans and Aspergillus niger","Pseudomonas aeruginosa and Staph aureus","Mycobacterium tuberculosis","Influenza A and RSV"],e:"Infections with Candida albicans or Aspergillus niger may occur in the mouth, pharynx and larynx.",s:"Steroids slide 12"},
{id:"s19",u:"steroids",o:"s3",q:"The occurrence and severity of oropharyngeal fungal infection with ICS is:",c:["Dose-related, and more likely if the patient also takes oral steroids","Unrelated to dose","Only seen with leukotriene modifiers","Prevented by inhaling without a spacer"],e:"Fungal infection is dose-related and more likely in patients who are also taking oral steroids.",s:"Steroids slide 14"},
{id:"s20",u:"steroids",o:"s2",q:"Which two measures reduce oropharyngeal deposition of an ICS?",c:["Using a spacer and gargling/rinsing after each treatment","Taking it at bedtime without rinsing","Using it only during acute attacks","Taking two puffs back-to-back as fast as possible"],e:"Use of a spacer device and gargling after treatment reduce oropharyngeal deposition, lowering the risk of thrush.",s:"Steroids slide 14"},
{id:"s21",u:"steroids",o:"s3",q:"Which statement about corticosteroids and airway remodeling is correct?",c:["They can prevent or reduce remodeling but cannot completely reverse established smooth muscle hyperplasia or fibrosis","They completely reverse all fibrotic airway changes","They cause airway remodeling","They have no effect on airway inflammation"],e:"By suppressing inflammation, steroids reduce BHR and help prevent/reduce remodeling, but cannot completely reverse established smooth muscle hyperplasia or fibrotic tissue.",s:"Steroids slide 15"},
{id:"s22",u:"steroids",o:"s5",q:"Leukotrienes cause all of the following EXCEPT:",c:["Increased mucociliary clearance","Airway smooth muscle contraction","Increased vascular permeability","Increased mucus secretion"],e:"Leukotrienes cause smooth muscle contraction, vasodilation, increased vascular permeability, increased mucus secretion and DECREASED mucociliary clearance.",s:"Steroids slide 19"},
{id:"s23",u:"steroids",o:"s5",q:"Leukotriene modifiers are considered:",c:["Alternatives to low-dose inhaled corticosteroids in mild persistent asthma, for long-term control","First-line rescue drugs for acute attacks","Replacements for IV steroids in status asthmaticus","Mucolytics"],e:"Leukotriene modifiers block leukotriene action and are alternatives to low-dose ICS in mild persistent asthma — for long-term control, not acute treatment.",s:"Steroids slide 20"},
{id:"s24",u:"steroids",o:"s5",q:"A patient wants to take their leukotriene modifier tablet to stop an asthma attack. Best response?",c:["Leukotriene modifiers are for long-term control, not acute treatment — use the prescribed rescue inhaler","Take two tablets for faster effect","Yes, it works within seconds","Take it with an ICS to turn it into a rescue drug"],e:"Leukotriene modifiers are used for long-term control, not acute treatment.",s:"Steroids slide 20"},
{id:"s25",u:"steroids",o:"s1",q:"Synthetic corticosteroids were developed to:",c:["Optimize anti-inflammatory activity","Maximize salt-retaining (mineralocorticoid) activity","Act as direct bronchodilators","Stimulate the adrenal glands"],e:"Synthetic corticosteroids have been developed to optimize anti-inflammatory activity.",s:"Steroids slide 3"},
{id:"s26",u:"steroids",o:"s4",q:"Clinically, corticosteroids do all of the following EXCEPT:",c:["Provide immediate rescue bronchodilation","Reduce airway inflammation","Improve oxygenation","Increase the response to β-agonists"],e:"Clinically, steroids reduce inflammation and obstruction, improve oxygenation and increase β-agonist response — but they are not immediate rescue bronchodilators.",s:"Steroids slide 8"},
{id:"s27",u:"steroids",o:"s2",q:"A patient asks why their ICS is safer long-term than daily oral prednisone. Best explanation?",c:["Inhaled delivery is localized to the airway, so systemic side-effect risk is very low at therapeutic doses","Inhaled steroids are not actually corticosteroids","Inhaled steroids work faster","Inhaled steroids cannot cause any side effects"],e:"ICS act locally, giving very low systemic risk at therapeutic doses — though local effects like thrush can still occur.",s:"Steroids slides 14 & 17"},

/* ---------- CALC ---------- */
{id:"c01",u:"calc",o:"c1",q:"In drug calculations, “percentage” refers to:",c:["Parts of active ingredient in a solution containing 100 parts","Milligrams per liter","The patient’s dose per kilogram","The ratio of diluent to drug"],e:"Percentage = the part of the active ingredient in a solution containing 100 parts.",s:"Calc slide 2"},
{id:"c02",u:"calc",o:"c1",q:"A drug’s “schedule” is:",c:["The amount of drug needed based on the patient’s weight","The drug’s expiration date","The strength in percent","The volume of diluent added"],e:"Schedule = the amount of drug needed based on a patient’s weight (e.g., mg/kg).",s:"Calc slide 2"},
{id:"c03",u:"calc",o:"c1",q:"The “strength” of a solution refers to:",c:["The amount of solute in a solution, usually expressed as a percentage","The volume of diluent added","The patient’s weight-based dose","The pH of the solution"],e:"Strength = amount of solute in a solution, usually as a percentage.",s:"Calc slide 2"},
{id:"c04",u:"calc",o:"c1",q:"The substance that is dissolved is the ___; the substance that dissolves it is the ___.",c:["Solute; solvent","Solvent; solute","Diluent; solute","Solution; solvent"],e:"Solute = active ingredient that is dissolved (liquid or solid). Solvent = substance that dissolves the solute.",s:"Calc slide 3"},
{id:"c05",u:"calc",o:"c1",q:"A solution is best defined as:",c:["A physically homogeneous mixture of two or more substances","Any liquid medication","The active ingredient only","A suspension of particles that settles out"],e:"A solution is a physically homogeneous mixture of two or more substances.",s:"Calc slide 3"},
{id:"c06",u:"calc",o:"c2",q:"A 2% solution contains:",c:["20 mg/ml","2 mg/ml","200 mg/ml","0.2 mg/ml"],e:"% → mg/ml: move the decimal one place right. 2% = 20 mg/ml.",s:"Calc slide 5"},
{id:"c07",u:"calc",o:"c2",q:"Albuterol 0.5% solution contains:",c:["5 mg/ml","0.5 mg/ml","50 mg/ml","0.05 mg/ml"],e:"0.5% → move decimal one place right → 5 mg/ml.",s:"Calc slide 5"},
{id:"c08",u:"calc",o:"c2",q:"75 mg/ml expressed as a percentage is:",c:["7.5%","75%","0.75%","750%"],e:"mg/ml → %: move the decimal one place left. 75 mg/ml = 7.5%.",s:"Calc slide 5"},
{id:"c09",u:"calc",o:"c2",q:"Acetylcysteine 20% contains:",c:["200 mg/ml","20 mg/ml","2 mg/ml","2,000 mg/ml"],e:"20% → 200 mg/ml (decimal one place right).",s:"Calc slide 6"},
{id:"c10",u:"calc",o:"c2",q:"10 mg/ml expressed as a percentage is:",c:["1%","10%","0.1%","100%"],e:"10 mg/ml → move decimal one place left → 1%.",s:"Calc slide 5"},
{id:"c11",u:"calc",o:"c3",q:"Albuterol 5 mg per aerosol dose is ordered. You have a 0.5% solution. How many ml?",c:["1 ml","0.5 ml","10 ml","0.1 ml"],e:"0.5% = 5 mg/ml. 5 mg / 1 ml = 5 mg / x ml → x = 1 ml.",s:"Calc slide 9"},
{id:"c12",u:"calc",o:"c3",q:"Albuterol 2.5 mg per aerosol dose is ordered. You have a 0.5% solution. How many ml?",c:["0.5 ml","1 ml","5 ml","0.25 ml"],e:"0.5% = 5 mg/ml. 2.5 mg ÷ 5 mg/ml = 0.5 ml.",s:"Calc slide 10"},
{id:"c13",u:"calc",o:"c3",q:"Acetylcysteine 500 mg per aerosol dose is ordered. You have a 20% solution. How many ml?",c:["2.5 ml","25 ml","5 ml","0.4 ml"],e:"20% = 200 mg/ml. 500 mg ÷ 200 mg/ml = 2.5 ml.",s:"Calc slide 11"},
{id:"c14",u:"calc",o:"c3",q:"Acetylcysteine 800 mg per aerosol dose is ordered. You have a 10% solution. How many ml?",c:["8 ml","4 ml","0.8 ml","80 ml"],e:"10% = 100 mg/ml. 800 mg ÷ 100 mg/ml = 8 ml.",s:"Calc slide 12"},
{id:"c15",u:"calc",o:"c3",q:"0.5 ml of a 1% drug is diluted with 2 ml of saline in one nebulizer and 10 ml in another. Which contains more active drug?",c:["Neither — both contain 5 mg of active ingredient","The 2 ml dilution","The 10 ml dilution","Cannot be determined"],e:"Diluent does not “weaken” the dose. 1% = 10 mg/ml × 0.5 ml = 5 mg, regardless of diluent volume.",s:"Calc slide 15"},
{id:"c16",u:"calc",o:"c1",q:"Per lecture, the medication left in the nebulizer at the end of treatment is:",c:["Only diluent","Concentrated drug that should be re-dosed","Half of the original dose","Pure solute"],e:"The misconception slide notes that medication left in the nebulizer is only diluent.",s:"Calc slide 15"},
{id:"c17",u:"calc",o:"c3",q:"A drug is ordered at 0.1 mg/kg. The child weighs 25 kg and you have a 0.5% solution. How many ml?",c:["0.5 ml","2.5 ml","5 ml","0.25 ml"],e:"Dose = 0.1 mg/kg × 25 kg = 2.5 mg. 0.5% = 5 mg/ml → 2.5 ÷ 5 = 0.5 ml.",s:"Calc slide 14"},
{id:"c18",u:"calc",o:"c3",q:"A child weighs 44 lb. What is the weight in kg?",c:["20 kg","96.8 kg","22 kg","40 kg"],e:"44 lb ÷ 2.2 lb/kg = 20 kg. Always convert to kg before applying an mg/kg schedule.",s:"Calc slide 14"},
{id:"c19",u:"calc",o:"c3",q:"Ipratropium 0.02% contains 0.2 mg/ml. How many ml provide 0.5 mg?",c:["2.5 ml","0.25 ml","25 ml","1 ml"],e:"0.5 mg ÷ 0.2 mg/ml = 2.5 ml.",s:"Calc slide 8"},
{id:"c20",u:"calc",o:"c3",q:"The first step of the proportion method is to:",c:["Convert all quantities to consistent units of measure","Add the diluent","Multiply by body weight","Divide the percent by 100"],e:"Convert to consistent units, then set up Original dose/Per amount = Desired dose/Per amount.",s:"Calc slide 8"},
{id:"c21",u:"calc",o:"c3",q:"How is a weight-based dose calculated?",c:["After obtaining body weight: mg/kg × weight (kg), then use the proportion formula for volume","Use an average adult weight","Only for adults","Only if the drug is a tablet"],e:"Dose must be calculated after body weight is obtained: schedule (mg/kg) × kg, then follow the proportion formula.",s:"Calc slide 14"},
{id:"c22",u:"calc",o:"c2",q:"How many mg of active drug are in 3 ml of a 1% solution?",c:["30 mg","3 mg","300 mg","0.3 mg"],e:"1% = 10 mg/ml × 3 ml = 30 mg.",s:"Calc slide 5"}
];

{id:"c71",ws:1,u:"steroids",title:"Case Study 7–1 — Fall flare-ups on rescue inhaler only",who:"24-year-old woman · persistent mild asthma",text:"A 24-year-old woman with persistent mild asthma is having more acute episodes, especially in the fall. During these periods her peak flows often drop to 50% of predicted, and she uses her quick-acting rescue bronchodilator frequently. That is the only respiratory medication she takes.",
 answer:{med:"Add a daily anti-inflammatory controller. Preferred: a low-dose inhaled corticosteroid twice daily (spacer + rinse), or a combination ICS-formoterol. Alternatives: a leukotriene modifier (e.g., montelukast once daily in the evening) or cromolyn (taken regularly and before exposure). Start before and continue through the fall season. Keep the SABA for rescue only, use an asthma action plan with peak-flow monitoring, and treat severe episodes with a short oral steroid burst.",why:"Her frequent symptoms and big peak-flow drops show uncontrolled allergic inflammation, which a SABA alone doesn’t treat; it only relieves the early-phase bronchospasm. A daily controller blocks late-phase inflammation and lowers bronchial hyperresponsiveness, so episodes become fewer and milder. Controllers take time (ICS: 1–2 weeks for initial improvement, 4–8 weeks for maximum; seasonal BHR needs at least a week), so they should be started ahead of her known fall trigger season and used every day."},
 steps:[
