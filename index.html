<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RC Pharm Exam Prep</title>
<meta name="description" content="Practice questions, case studies, dose-calculation drills and key terms for mucus-controlling drugs, corticosteroids and drug dose calculations.">
<style>
:root{
  --bg:#f6f9ff;--surface:#ffffff;--surface2:#eef3ff;--text:#1a1f33;--muted:#586079;--border:#dce4f7;
  --accent:#4f6ddb;--accent-ink:#ffffff;--accent-soft:#e7eeff;--gold:#f2b705;
  --ok:#1d7f47;--ok-soft:#e2f4e9;--bad:#b83227;--bad-soft:#fbe6e3;
  --shadow:0 1px 2px rgba(40,70,150,.06),0 6px 20px rgba(40,70,150,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10141f;--surface:#182030;--surface2:#212a3d;--text:#e8edf9;--muted:#9ba6c4;--border:#2f3a52;
    --accent:#a6bcff;--accent-ink:#101833;--accent-soft:#263256;--gold:#f2c230;
    --ok:#5fd393;--ok-soft:#173326;--bad:#ff8a7d;--bad-soft:#3a1d1b;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#10141f;--surface:#182030;--surface2:#212a3d;--text:#e8edf9;--muted:#9ba6c4;--border:#2f3a52;
  --accent:#a6bcff;--accent-ink:#101833;--accent-soft:#263256;--gold:#f2c230;
  --ok:#5fd393;--ok-soft:#173326;--bad:#ff8a7d;--bad-soft:#3a1d1b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px}
.brand h1{font-size:1.15rem;margin:0;letter-spacing:-.01em}
.brand p{margin:2px 0 0;font-size:.82rem;color:var(--muted)}
.brand h1 span{color:var(--accent)}
.icon-btn{border:1px solid var(--border);background:var(--surface);border-radius:10px;width:40px;height:40px;cursor:pointer;flex:none}
nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--surface2);padding:4px;border-radius:12px;margin-bottom:12px}
nav.tabs button{border:0;background:transparent;padding:8px 4px;border-radius:9px;cursor:pointer;font-weight:600;font-size:.9rem;color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
main{padding:16px 0 40px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{margin:0 0 6px;font-size:1.15rem;line-height:1.35}
.card h3{margin:0 0 8px;font-size:1rem}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{display:block;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border);background:var(--surface);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:.9rem}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
select,input[type=text],input[type=search]{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.toggle{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:.95rem;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.btn{border:1px solid var(--border);background:var(--surface);padding:11px 16px;border-radius:12px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%;margin-top:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-right:4px}
.tag.gold{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--text)}
.progress{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:4px 0 14px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.choices{display:grid;gap:8px;margin-top:14px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--border);background:var(--surface);border-radius:12px;padding:12px;cursor:pointer;line-height:1.4}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice .letter{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;background:var(--surface2)}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.correct{border-color:var(--ok);background:var(--ok-soft)}
.choice.correct .letter{background:var(--ok);color:#fff}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice.wrong .letter{background:var(--bad);color:#fff}
.choice.dim{opacity:.6}
.choice:disabled{cursor:default}
.feedback{margin-top:14px;border-radius:12px;padding:12px 14px;border-left:4px solid var(--ok);background:var(--ok-soft)}
.feedback.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.feedback b{display:block;margin-bottom:4px}
.src{display:block;margin-top:6px;font-size:.78rem;color:var(--muted)}
.nav{margin-top:16px}
.score-big{font-size:2.6rem;font-weight:800;letter-spacing:-.02em;color:var(--accent);line-height:1}
.bar{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;margin:8px 0}
.bar .track{grid-column:1/-1;height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--accent)}
.review{border-top:1px solid var(--border);padding-top:12px;margin-top:12px}
.review p{margin:4px 0}
.ok{color:var(--ok)} .bad{color:var(--bad)}
.case-card{display:block;width:100%;text-align:left;cursor:pointer}
.case-card:hover{border-color:var(--accent)}
.scenario{background:var(--surface2);border-radius:12px;padding:12px 14px;margin:10px 0}
.scenario .who{font-weight:700;margin-bottom:4px}
.step{border-top:1px dashed var(--border);margin-top:16px;padding-top:14px}
.step .num{font-size:.78rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.info{background:color-mix(in srgb,var(--gold) 14%,var(--surface));border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.95rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--surface2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.3rem}
.stat span{font-size:.75rem;color:var(--muted)}
.prompt{font-size:1.05rem;margin:6px 0 14px}
.answer-row{display:flex;gap:8px}
.answer-row input{flex:1}
.unit-suffix{align-self:center;color:var(--muted);font-weight:600;white-space:nowrap}
ol.steps{margin:6px 0 0;padding-left:20px}
ol.steps li{margin:3px 0}
.terms{display:grid;gap:8px;margin-top:12px}
.term{display:block;width:100%;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer}
.term .t{font-weight:700;display:flex;justify-content:space-between;gap:8px}
.term .t::after{content:"+";color:var(--muted);font-weight:400}
.term.open .t::after{content:"–"}
.term .d{display:none;margin-top:6px;color:var(--muted);font-size:.95rem}
.term.open .d{display:block}
.obj-list{margin:0;padding-left:18px}
.obj-list li{margin:4px 0}
.obj-list button{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;text-align:left;font:inherit}
.section-h{font-weight:700;margin:22px 4px 10px;font-size:1rem}
textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);font:inherit;color:inherit;resize:vertical}
details.draft{border:1px dashed var(--border);border-radius:12px;padding:10px 14px;margin-top:12px}
details.draft summary{cursor:pointer;font-weight:600;color:var(--accent)}
.model{background:var(--ok-soft);border-left:4px solid var(--ok);border-radius:12px;padding:12px 14px}
.model p,.mine p{margin:4px 0 10px}
.model p:last-child,.mine p:last-child{margin-bottom:0}
.mine{background:var(--surface2);border-radius:12px;padding:12px 14px;margin-top:10px}
.unit-h{display:flex;align-items:center;gap:8px;font-size:1.1rem;margin:26px 4px 10px}
.toc{display:grid;gap:12px;margin-top:14px}
.toc ol{margin:4px 0 0;padding-left:20px}
.toc li{margin:3px 0;font-size:.92rem}
.toc a{color:var(--accent);text-decoration:none}
.toc a:hover{text-decoration:underline}
details.gsec{padding:0;overflow:hidden}
details.gsec summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:flex-start;padding:16px 18px;font-weight:700;line-height:1.35}
details.gsec summary::-webkit-details-marker{display:none}
details.gsec summary::after{content:"+";margin-left:auto;color:var(--muted);font-weight:400;font-size:1.2rem;line-height:1}
details.gsec[open] summary::after{content:"–"}
details.gsec[open] summary{border-bottom:1px solid var(--border)}
.onum{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:.8rem}
.gbody{padding:4px 18px 18px}
.gbody h4{margin:18px 0 8px;font-size:.95rem;color:var(--accent)}
.gbody ul,.gbody ol{padding-left:20px;margin:8px 0}
.gbody li{margin:4px 0}
.tbl{overflow-x:auto;margin:10px 0;border:1px solid var(--border);border-radius:12px}
.tbl table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:420px}
.tbl th{background:var(--surface2);text-align:left;font-weight:700;padding:8px 10px;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tbl td{padding:8px 10px;border-top:1px solid var(--border);vertical-align:top}
.hy .tbl table{min-width:0}
.hy .tbl td:first-child{font-weight:700;white-space:nowrap}
.dl{margin:10px 0;display:grid;gap:2px}
.dl dt{font-weight:700;margin-top:8px}
.dl dd{margin:0;color:var(--muted)}
.key{background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:12px;padding:12px 14px;margin:12px 0}
.trap,.hook{border-radius:12px;padding:10px 14px;margin:12px 0;font-size:.93rem}
.trap{background:var(--bad-soft);border-left:4px solid var(--bad)}
.hook{background:color-mix(in srgb,var(--gold) 16%,var(--surface));border-left:4px solid var(--gold)}
.trap b,.hook b{display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0;font-size:.9rem}
.flow span{background:var(--surface2);border-radius:8px;padding:5px 9px;font-weight:600}
.flow em{color:var(--muted);font-size:.82rem}
.two{display:grid;gap:4px}
@media (max-width:600px){
  .tbl:not(.stack) table{min-width:0}
  .tbl.stack{border:0;overflow:visible}
  .tbl.stack table{min-width:0}
  .tbl.stack thead{display:none}
  .tbl.stack tr{display:block;border:1px solid var(--border);border-radius:12px;padding:6px 12px;margin-bottom:8px;background:var(--surface)}
  .tbl.stack td{display:block;border:0;padding:4px 0}
  .tbl.stack td:empty{display:none}
  .tbl.stack td[data-l]:not([data-l=""])::before{content:attr(data-l);display:block;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .tbl.stack td:first-child{font-weight:700;color:var(--accent)}
  .tbl.stack td:first-child::before{display:none!important}
}
@media (min-width:640px){.two{grid-template-columns:1fr 1fr;gap:20px}.toc{grid-template-columns:repeat(3,1fr)}}
.say{background:var(--surface2);border-left:4px solid var(--accent);border-radius:12px;padding:12px 14px;margin:12px 0;font-style:italic}
.say b{display:block;font-style:normal;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:4px}
.work{background:var(--surface2);border-radius:12px;padding:10px 14px;font-size:.93rem;margin:8px 0}
ul.check{list-style:none;padding-left:0}
ul.check li{padding-left:26px;position:relative}
ul.check li::before{content:"✓";position:absolute;left:4px;color:var(--ok);font-weight:800}
@media print{
  header,footer,.no-print{display:none!important}
  body{background:#fff;color:#000;font-size:11pt}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:auto}
  details.gsec summary::after,details.gsec[open] summary::after{content:none}
  .tbl{overflow:visible}.tbl table{min-width:0}
  .unit-h{break-before:page}
  .unit-h:first-of-type{break-before:auto}
}
footer{padding:20px 0 40px;color:var(--muted);font-size:.82rem;text-align:center}
footer button{border:0;background:none;color:var(--accent);cursor:pointer;text-decoration:underline;font-size:inherit}
@media (max-width:420px){.card{padding:15px}.score-big{font-size:2.2rem}nav.tabs button{font-size:.8rem;padding:8px 2px}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <h1>RC Pharm <span>Exam Prep</span></h1>
        <p>Mucus-controlling drugs · Corticosteroids · Dose calculations</p>
      </div>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode">◐</button>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="guide">Guide</button>
      <button role="tab" data-tab="quiz">Quiz</button>
      <button role="tab" data-tab="cases">Cases</button>
      <button role="tab" data-tab="calc">Calc</button>
      <button role="tab" data-tab="terms">Terms</button>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer class="wrap">
  Study aid built from Respiratory Care Pharmacology lecture slides (Goss). Not clinical guidance.<br>
  Progress is saved in this browser. <button id="resetBtn">Reset progress</button>
</footer>

<script>
/* ======================= DATA ======================= */
const UNITS = {
  mucus:   {name:"Mucus-Controlling Drug Therapy", short:"Mucus"},
  steroids:{name:"Corticosteroids & Anti-asthmatics", short:"Steroids"},
  calc:    {name:"Calculating Drug Doses", short:"Calc"}
};
const OBJ = {
  m1:{u:"mucus",t:"Define key terms related to mucokinetic agents"},
  m2:{u:"mucus",t:"Compare mechanisms: bland aerosols vs mucolytics"},
  m3:{u:"mucus",t:"Indications for bland aerosols and mucolytics"},
  m4:{u:"mucus",t:"Standard dose & administration frequency"},
  m5:{u:"mucus",t:"CFTR modulator candidates (mutation & age)"},
  m6:{u:"mucus",t:"Mucus & mucociliary physiology (review)"},
  m7:{u:"mucus",t:"Expectorants & antitussives (review)"},
  m8:{u:"mucus",t:"Surfactant replacement therapy (review)"},
  s1:{u:"steroids",t:"Physiology of corticosteroids"},
  s2:{u:"steroids",t:"Managing a patient on inhaled corticosteroids"},
  s3:{u:"steroids",t:"Side effects & adverse effects"},
  s4:{u:"steroids",t:"Oral, parenteral & inhaled pharmacotherapy"},
  s5:{u:"steroids",t:"Leukotriene modifiers in asthma"},
  s6:{u:"steroids",t:"Allergic inflammation, cromolyn & antihistamines (review)"},
  c1:{u:"calc",t:"Terms used to describe medication solutions"},
  c2:{u:"calc",t:"Strength of solutions in percentage form"},
  c3:{u:"calc",t:"Drug dosage calculations"}
};

/* Questions: c[0] is always the correct answer (choices are shuffled on screen). */
const Q = [
/* ---------- Chapter 7 review (allergy, cromolyn, antihistamines) ---------- */
{id:"r701",b:1,u:"steroids",o:"s6",q:"The most common antibody involved in allergic asthma and rhinitis is:",c:["IgE","IgG","IgF","IgT"],e:"IgE sits on mast cells. When an allergen cross-links it, the mast cell releases histamine and other mediators. (IgF, IgT and IgB don’t exist.)",s:"Chapter 7 review · #1"},
{id:"r702",b:1,u:"steroids",o:"s1",q:"Corticosteroids can be classified as:",c:["Both mineralocorticoid and glucocorticoid","Mineralocorticoid only","Potassium sparing","Glucose sparing"],e:"The two classes are mineralocorticoids (salt and water) and glucocorticoids (anti-inflammatory).",s:"Chapter 7 review · #2"},
{id:"r703",b:1,u:"steroids",o:"s4",q:"Routes used for corticosteroids include:",c:["All of these: inhalational, oral, intranasal and parenteral","Inhalational only","Oral and parenteral only","Intranasal only"],e:"Examples: inhaled (asthma), oral (prednisone burst), intranasal (allergic rhinitis) and parenteral/IV (status asthmaticus).",s:"Chapter 7 review · #3"},
{id:"r704",b:1,u:"steroids",o:"s4",q:"Which indication is appropriate for prednisone?",c:["Both acute asthma (short burst) and chronic asthma (severe persistent)","Acute only","Chronic only","Neither; it isn’t used in asthma"],e:"Oral prednisone is used as a short burst for exacerbations, and long-term only when severe persistent asthma can’t be controlled otherwise (lowest dose, taper when stopping).",s:"Chapter 7 review · #4"},
{id:"r705",b:1,u:"steroids",o:"s6",q:"Which indication is appropriate for cromolyn sodium?",c:["Chronic (preventive) asthma treatment only","Acute asthma treatment only","Both acute and chronic","Acute allergic reactions (anaphylaxis)"],e:"Cromolyn is a mast cell stabilizer. It prevents mediator release, so it must be taken before exposure and regularly. It does nothing for an attack already underway.",s:"Chapter 7 review · #4"},
{id:"r706",b:1,u:"steroids",o:"s5",q:"Which indication is appropriate for zileuton?",c:["Chronic asthma treatment only","Acute asthma treatment only","Both acute and chronic","Allergic rhinitis rescue"],e:"Zileuton is a leukotriene modifier (5-lipoxygenase inhibitor) for long-term control, never rescue. Monitor liver enzymes.",s:"Chapter 7 review · #4"},
{id:"r707",b:1,u:"steroids",o:"s6",q:"Which effect relates MOST closely to β-agonists?",c:["Block histamine release","Block histamine production","Block H₁ receptors","Digest histamine"],e:"β-agonists raise mast-cell cAMP, which inhibits degranulation (release). Their main job is still bronchodilation.",s:"Chapter 7 review · #5"},
{id:"r708",b:1,u:"steroids",o:"s6",q:"Which effect relates MOST closely to cromolyn sodium?",c:["Blocks histamine release","Blocks histamine production","Blocks H₁ receptors","Increases β-receptor numbers"],e:"Cromolyn stabilizes the mast cell membrane so it doesn’t degranulate and release its mediators.",s:"Chapter 7 review · #5"},
{id:"r709",b:1,u:"steroids",o:"s6",q:"Which effect relates MOST closely to corticosteroids?",c:["Block histamine (mediator) production","Block histamine release only","Block H₁ receptors","Act as bronchodilators"],e:"Corticosteroids work upstream: they reduce mediator synthesis and inflammatory cells. Remember “release vs production.”",s:"Chapter 7 review · #5"},
{id:"r710",b:1,u:"steroids",o:"s6",q:"Which statement about the early and late phases of allergic inflammation is correct?",c:["Early phase occurs within minutes from mast-cell mediators; late phase develops hours later (~4–8 h) with eosinophils and other inflammatory cells","Early phase is caused by eosinophils; late phase by histamine","Both phases happen within 5 minutes","The late phase is relieved completely by albuterol"],e:"SABAs treat the early bronchospasm. Anti-inflammatories (corticosteroids, or cromolyn given beforehand) are needed for the late phase.",s:"Chapter 7 review · #6"},
{id:"r711",b:1,u:"steroids",o:"s6",q:"Why does the late phase of allergic inflammation matter for drug choice?",c:["A rescue bronchodilator treats only the early phase. Without an anti-inflammatory, the patient worsens hours later and BHR increases","The late phase only responds to antihistamines","The late phase is harmless","Antibiotics prevent the late phase"],e:"This is why persistent allergic asthma needs a controller (ICS) and not just albuterol.",s:"Chapter 7 review · #6"},
{id:"r712",b:1,u:"steroids",o:"s1",q:"Which is the best lay explanation of why a patient must not suddenly stop long-term prednisone?",c:["“Your adrenal glands have been resting because of the pills; if you stop suddenly, your body won’t have enough of its own steroid hormone until they wake up, which can be dangerous.”","“Prednisone is addictive, so you’ll crave it.”","“Stopping will make your lungs scar.”","“Prednisone stays in your body for months, so stopping doesn’t matter.”"],e:"HPA suppression → adrenal atrophy → adrenal crisis if stopped abruptly. Taper slowly.",s:"Chapter 7 review · #7"},
{id:"r713",b:1,u:"steroids",o:"s6",q:"Which factor INHIBITS mediator release from mast cells?",c:["Increased intracellular cAMP (e.g., from β-agonists)","Allergen cross-linking of IgE","Increased cGMP from cholinergic stimulation","Calcium influx into the mast cell"],e:"↑ cAMP stabilizes mast cells. Allergen–IgE cross-linking, ↑ cGMP and calcium influx all promote release.",s:"Chapter 7 review · #8"},
{id:"r714",b:1,u:"steroids",o:"s6",q:"Which can trigger mediator release from mast cells? I) Allergen exposure II) Exercise / cold dry air III) Irritants such as smoke IV) Respiratory infection",c:["I, II, III, and IV","I only","I and II","II and IV"],e:"Besides allergen–IgE cross-linking, nonspecific triggers such as exercise, cold air, irritants and infections can provoke release in sensitive airways.",s:"Chapter 7 review · #8"},
{id:"r715",b:1,u:"steroids",o:"s6",q:"What are the most important side effects of first-generation antihistamines?",c:["Sedation/drowsiness and anticholinergic drying effects (dry mouth, blurred vision, urinary retention, thickened secretions)","Bronchospasm and hyperglycemia","Oral thrush and hoarseness","Hypertension and edema"],e:"First-generation drugs (e.g., diphenhydramine) cross into the brain and are strongly anticholinergic.",s:"Chapter 7 review · #9"},
{id:"r716",b:1,u:"steroids",o:"s2",q:"A 57-year-old asthmatic has hoarseness, white spots on his throat and tongue, and a “funny taste.” Which medication and route are most likely responsible?",c:["An inhaled corticosteroid","An oral leukotriene modifier","A nebulized SABA","An intranasal antihistamine"],e:"Dysphonia and oropharyngeal candidiasis are classic ICS local side effects from drug deposited in the mouth and throat.",s:"Chapter 7 review · #10"},
{id:"r717",b:1,u:"steroids",o:"s2",q:"For the patient with ICS-related thrush and hoarseness, which plan is best?",c:["Antifungal treatment per prescriber, add a spacer, rinse/gargle and spit after every dose, check technique and dose, and follow up","Stop the ICS permanently","Switch to daily oral prednisone","Double the ICS dose"],e:"Keep the controller and reduce oropharyngeal deposition. Thrush risk is dose-related, so use the lowest effective dose.",s:"Chapter 7 review · #10"},
{id:"r718",b:1,u:"steroids",o:"s6",q:"A patient uses albuterol, an inhaled corticosteroid and cromolyn each morning. What is the best sequence?",c:["Albuterol → cromolyn → inhaled corticosteroid (then rinse)","Inhaled corticosteroid → cromolyn → albuterol","Cromolyn → albuterol → corticosteroid","Order doesn’t matter"],e:"Open the airways first so the controllers deposit deeper. Give the ICS last so the patient can rinse afterward.",s:"Chapter 7 review · #11"},
{id:"r719",b:1,u:"steroids",o:"s6",q:"In lay terms, when is cromolyn indicated?",c:["“Every day and before your triggers (like exercise or allergens) to keep attacks from starting; it won’t stop an attack once it begins.”","“Only when you’re wheezing.”","“Once a month.”","“Only in the emergency room.”"],e:"Cromolyn is prophylactic. Its full benefit builds over 2–4 weeks of regular use.",s:"Chapter 7 review · #11"},

{id:"x701",b:2,u:"steroids",o:"s6",q:"Cromolyn sodium is classified as a:",c:["Mast cell stabilizer","Leukotriene receptor antagonist","Corticosteroid","β₂-agonist"],e:"It prevents mast-cell degranulation, so mediators aren’t released.",s:"Built from chapter 7"},
{id:"x702",b:2,u:"steroids",o:"s6",q:"A child with exercise-induced asthma is prescribed cromolyn. When should it be taken relative to soccer practice?",c:["Shortly before exercise (about 10–60 minutes)","Only after symptoms start","The night after practice","Once a week"],e:"Cromolyn must be on board before the trigger to block mast-cell release.",s:"Built from chapter 7"},
{id:"x703",b:2,u:"steroids",o:"s6",q:"Nebulized cromolyn is typically dosed as:",c:["20 mg (one 2 ml ampule of 1%) four times daily","2.5 mg once daily","500 mg three times daily","0.5 ml of 0.5% every 4 hours"],e:"1% = 10 mg/ml × 2 ml = 20 mg, given QID for maintenance.",s:"Built from chapter 7"},
{id:"x704",b:2,u:"steroids",o:"s5",q:"Zileuton differs from montelukast because zileuton:",c:["Inhibits 5-lipoxygenase, blocking leukotriene production; montelukast blocks the leukotriene receptor","Is a rescue inhaler","Is a corticosteroid","Is given IV"],e:"Both are oral leukotriene modifiers for chronic control. Zileuton needs liver-enzyme monitoring.",s:"Built from chapter 7"},
{id:"x705",b:2,u:"steroids",o:"s5",q:"Which lab should be monitored in a patient taking zileuton?",c:["Liver enzymes","Serum potassium","Blood cultures","Sweat chloride"],e:"Zileuton can elevate liver enzymes (hepatotoxicity).",s:"Built from chapter 7"},
{id:"x706",b:2,u:"steroids",o:"s6",q:"Which antihistamine is LEAST likely to cause drowsiness?",c:["Fexofenadine","Diphenhydramine","Chlorpheniramine","Hydroxyzine"],e:"Second-generation antihistamines (fexofenadine, loratadine) are far less sedating. Diphenhydramine, chlorpheniramine and hydroxyzine are sedating first-generation drugs.",s:"Built from chapter 7"},
{id:"x707",b:2,u:"steroids",o:"s6",q:"Why might an RT be cautious about antihistamines in a patient with thick airway secretions?",c:["Their anticholinergic drying effect can thicken secretions and make them harder to clear","They break disulfide bonds","They cause bronchorrhea","They increase surfactant"],e:"Drying (anticholinergic) effects are among the main antihistamine side effects.",s:"Built from chapter 7"},
{id:"x708",b:2,u:"steroids",o:"s6",q:"Antihistamines relieve allergy symptoms by:",c:["Blocking H₁ receptors so released histamine can’t act","Stabilizing mast cells to prevent release","Digesting histamine","Increasing IgE"],e:"Antihistamines block histamine’s effects after release. Cromolyn prevents the release itself.",s:"Built from chapter 7"},
{id:"x709",b:2,u:"steroids",o:"s6",q:"Which inflammatory cell is most characteristic of the LATE asthmatic response?",c:["Eosinophil","Red blood cell","Platelet","Mast cell only"],e:"Eosinophils (with neutrophils and lymphocytes) are recruited hours later. Corticosteroids decrease eosinophils.",s:"Built from chapter 7"},
{id:"x710",b:2,u:"steroids",o:"s6",q:"A patient has a “second wave” of wheezing 6 hours after allergen exposure even though albuterol helped at first. What is happening?",c:["A late-phase response; an anti-inflammatory such as a corticosteroid is needed","The albuterol caused it","An early-phase response","An adrenal crisis"],e:"SABAs don’t prevent the late phase.",s:"Built from chapter 7"},
{id:"x711",b:2,u:"steroids",o:"s4",q:"For allergic rhinitis with significant nasal congestion, which steroid route is commonly used?",c:["Intranasal","Intravenous","Oral daily for years","Nebulized through a mask"],e:"Intranasal corticosteroids act locally on nasal inflammation, much as ICS do in the lungs.",s:"Built from chapter 7"},
{id:"x712",b:2,u:"steroids",o:"s6",q:"Which statement about montelukast is correct?",c:["It is an oral leukotriene receptor antagonist for long-term control, usually taken once daily in the evening for asthma; watch for mood or behavior changes","It is a rescue inhaler","It is a mast cell stabilizer","It is a 5-lipoxygenase inhibitor"],e:"Montelukast carries a warning about neuropsychiatric effects (mood or behavior changes, sleep disturbance).",s:"Built from chapter 7"},
/* ---------- Table 7-3 side effects ---------- */
{id:"t01",b:1,u:"steroids",o:"s3",q:"A patient on long-term prednisone keeps getting pneumonias and skin infections. Which category of corticosteroid side effect is this?",c:["Immunologic: immunosuppression with increased susceptibility to infections","Ophthalmic","Metabolic","Cardiovascular"],e:"Table 7–3: immunologic effects are immunosuppression and increased susceptibility to infections.",s:"Textbook Table 7–3"},
{id:"t02",b:1,u:"steroids",o:"s3",q:"Which pair is listed as CARDIOVASCULAR side effects of corticosteroids?",c:["Edema and hypertension","Hypotension and bradycardia","Glaucoma and cataracts","Euphoria and insomnia"],e:"Corticosteroids cause sodium and fluid retention, which leads to edema and hypertension.",s:"Textbook Table 7–3"},
{id:"t03",b:1,u:"steroids",o:"s3",q:"A hospitalized patient on IV methylprednisolone is awake all night and unusually cheerful. These are which type of side effect?",c:["CNS: euphoria and insomnia","Dermatologic","Endocrinologic","Immunologic"],e:"Table 7–3 lists euphoria and insomnia as the CNS effects.",s:"Textbook Table 7–3"},
{id:"t04",b:1,u:"steroids",o:"s3",q:"Which is NOT listed as a dermatologic side effect of corticosteroids?",c:["Thickened skin","Bruising","Impaired wound healing","Altered fat distribution"],e:"Steroids cause THIN skin, along with bruising, impaired wound healing and altered fat distribution.",s:"Textbook Table 7–3"},
{id:"t05",b:1,u:"steroids",o:"s3",q:"A patient with no history of diabetes has a blood glucose of 280 mg/dl after three days of high-dose steroids. This is which category of side effect?",c:["Endocrinologic (steroid-induced diabetes/hyperglycemia)","Metabolic (negative nitrogen balance)","Musculoskeletal","Ophthalmic"],e:"Table 7–3 lists diabetes and the Cushingoid state as the endocrinologic effects.",s:"Textbook Table 7–3"},
{id:"t06",b:1,u:"steroids",o:"s3",q:"Electrolyte imbalance and negative nitrogen balance are classified as which type of corticosteroid side effect?",c:["Metabolic","Cardiovascular","CNS","Immunologic"],e:"Both are metabolic. Negative nitrogen balance means protein breakdown, which contributes to muscle weakness and poor healing.",s:"Textbook Table 7–3"},
{id:"t07",b:1,u:"steroids",o:"s3",q:"A child needing long-term systemic steroids should be monitored for which musculoskeletal effect?",c:["Growth suppression","Muscle hypertrophy","Increased bone density","Joint hypermobility"],e:"The musculoskeletal effects are muscle weakness, osteoporosis and growth suppression.",s:"Textbook Table 7–3"},
{id:"t08",b:1,u:"steroids",o:"s3",q:"Which OPHTHALMIC side effect of corticosteroids is listed in Table 7–3?",c:["Glaucoma","Retinal detachment","Conjunctivitis","Color blindness"],e:"Glaucoma (increased intraocular pressure) is the listed ophthalmic effect. Cataracts are another well-known long-term steroid eye effect.",s:"Textbook Table 7–3"},
{id:"t09",b:1,u:"steroids",o:"s3",q:"Which set contains ONLY corticosteroid side effects?",c:["Hypertension, osteoporosis, glaucoma, insomnia","Hypotension, weight loss, thick skin, hypoglycemia","Bradycardia, muscle hypertrophy, increased height, euphoria","Hypokinesis, bone growth, improved healing, edema"],e:"Every other option contains at least one opposite effect: hypotension, hypoglycemia, thick skin, muscle hypertrophy or improved healing.",s:"Textbook Table 7–3"},
{id:"t10",b:1,u:"steroids",o:"s3",q:"Thin skin, bruising and poor wound healing on long-term prednisone are best explained partly by:",c:["Negative nitrogen balance (protein breakdown)","Increased collagen production","Hypoglycemia","Glaucoma"],e:"Protein breakdown (a metabolic effect) weakens skin and connective tissue, causing dermatologic effects like thin skin, bruising and impaired healing.",s:"Textbook Table 7–3"},
/* ---------- MORE PRACTICE (round 2) ---------- */
{id:"e01",b:2,u:"mucus",o:"m1",q:"Which delivery method for water to the airway is described as “highly variable”?",c:["Humidifiers","Small-volume nebulizers","Direct instillation","Ultrasonic nebulizers"],e:"Humidifiers are highly variable in output. SVNs are used for medication delivery and sputum induction, and LVNs and ultrasonics deliver significant aerosol volumes.",s:"Mucus slide 6"},
{id:"e02",b:2,u:"mucus",o:"m3",q:"Small-volume (hand-held) nebulizers are mainly used for:",c:["Medication delivery and sputum induction","Continuous high-volume humidification","Croup tents","Direct instillation"],e:"Slide 6 lists SVN uses as medication delivery and sputum induction.",s:"Mucus slide 6"},
{id:"e03",b:2,u:"mucus",o:"m3",q:"Sterile water is commonly used in all of the following EXCEPT:",c:["As an IV injection to thin mucus","As a diluent for aerosolized medications","In humidifiers and large-volume nebulizers","In croup tents"],e:"Slide 10 lists sterile water as a diluent and for humidifiers, LVNs and croup tents.",s:"Mucus slide 10"},
{id:"e04",b:2,u:"mucus",o:"m2",q:"After a day of continuous ultrasonic aerosol, a patient’s secretions are very thin and watery, yet clearance is worse. Why?",c:["Thin, watery secretions impair mucociliary function","The aerosol broke disulfide bonds","Ultrasonic nebulizers deliver too little aerosol","Watery mucus always means infection"],e:"Large-volume and ultrasonic nebulizers can cause runny, watery secretions, and thin secretions impair the mucociliary system.",s:"Mucus slide 6"},
{id:"e05",b:2,u:"mucus",o:"m2",q:"The airway irritation caused by bland aerosols tends to:",c:["Increase production of thinner mucus","Break down the mucus molecule","Paralyze the cilia permanently","Decrease all mucus production"],e:"Bland aerosols are somewhat irritating, and that irritation tends to increase production of thinner mucus.",s:"Mucus slide 9"},
{id:"e06",b:2,u:"mucus",o:"m5",q:"A CF patient’s CFTR protein reaches the cell surface, but its channel gate doesn’t open well. Which type of modulator targets this?",c:["Potentiator (ivacaftor)","Corrector (tezacaftor)","Peptide mucolytic (dornase alfa)","Leukotriene modifier"],e:"Potentiators act on channels already at the cell surface and help open the gate so chloride can flow.",s:"Mucus slide 26"},
{id:"e07",b:2,u:"mucus",o:"m5",q:"A CF patient’s CFTR protein is misfolded and never reaches the cell surface. Which drug type addresses this first?",c:["Corrector (elexacaftor/tezacaftor)","Potentiator alone (ivacaftor)","Hypertonic saline","Inhaled corticosteroid"],e:"Correctors help the protein take its proper 3-D shape and move to the cell surface. A potentiator alone can’t open a channel that isn’t there.",s:"Mucus slide 26"},
{id:"e08",b:2,u:"mucus",o:"m5",q:"What ultimately creates the thick, sticky mucus of cystic fibrosis?",c:["A defective or absent CFTR protein → salt and water imbalance at the airway surface","Too much extracellular DNA from birth","Overactive β receptors","Excess leukotriene production"],e:"CFTR gene mutations cause a defective or absent channel, and the resulting salt/water imbalance makes mucus thick and sticky.",s:"Mucus slide 25"},
{id:"e09",b:2,u:"mucus",o:"m5",q:"Besides the lungs, which organ does the lecture name as affected by thick CF mucus?",c:["Pancreas","Kidneys","Thyroid","Spleen"],e:"Slide 25: the mucus clogs airways and affects other organs like the pancreas.",s:"Mucus slide 25"},
{id:"e10",b:2,u:"mucus",o:"m4",q:"A 7-year-old weighing 32 kg starts Trikafta. Which regimen?",c:["AM: two orange tablets (100/50/75 mg); PM: ivacaftor 150 mg","AM: two light orange tablets (50/25/37.5 mg); PM: ivacaftor 75 mg","AM: granules 100/50/75 mg; PM: granules ivacaftor 75 mg","Not eligible until age 12"],e:"For ages 6 to <12, a weight of ≥30 kg gets the adult dose.",s:"Mucus slide 30"},
{id:"e11",b:2,u:"mucus",o:"m4",q:"A 3-year-old weighing exactly 14 kg starts Trikafta. Which regimen?",c:["AM: granules 100/50/75 mg; PM: granules ivacaftor 75 mg","AM: granules 80/40/60 mg; PM: granules ivacaftor 59.5 mg","AM: two light orange tablets; PM: ivacaftor 75 mg","Not eligible"],e:"Ages 2 to <6: “14 kg or more” gets the higher granule dose, so exactly 14 kg counts.",s:"Mucus slide 30"},
{id:"e12",b:2,u:"mucus",o:"m4",q:"An 11-year-old weighing 29 kg starts Trikafta. Which regimen?",c:["AM: two light orange tablets (50/25/37.5 mg); PM: ivacaftor 75 mg","AM: two orange tablets; PM: ivacaftor 150 mg","AM: granules 80/40/60 mg; PM: ivacaftor 59.5 mg","Adult dose, because he is over 10"],e:"Ages 6 to <12 under 30 kg get the light orange tablets. Weight, not just age, decides the dose.",s:"Mucus slide 30"},
{id:"e13",b:2,u:"mucus",o:"m1",q:"Mucolytics facilitate expectoration by:",c:["Liquefying mucus through breaking down its complex molecular strands","Suppressing the cough reflex","Drying the airway","Constricting bronchial glands"],e:"Mucolytics act directly on the mucus molecule to liquefy it.",s:"Mucus slide 19"},
{id:"e14",b:2,u:"mucus",o:"m4",q:"A CF family asks how to store dornase alfa ampules at home.",c:["In the refrigerator, protected from light","At room temperature in a sunny window","Frozen","Mixed in advance with albuterol"],e:"Dornase is a fragile enzyme: refrigerate it, protect it from light, and don’t mix it with other drugs.",s:"Chapter review"},

{id:"e20",b:2,u:"steroids",o:"s1",q:"Besides corticosteroid release, the HPA axis helps regulate:",c:["The stress response, digestion, immunity, mood and energy storage","Only blood pressure","Only red blood cell production","Lung surfactant production"],e:"Slide 4: the HPA axis is a primary neuroendocrine system controlling the response to stress, digestion, immunity, mood and energy storage.",s:"Steroids slide 4"},
{id:"e21",b:2,u:"steroids",o:"s1",q:"What is the correct order of the HPA cascade?",c:["Hypothalamus → pituitary → adrenal glands","Adrenal glands → pituitary → hypothalamus","Pituitary → hypothalamus → adrenal glands","Hypothalamus → adrenal glands → pituitary"],e:"The hypothalamus signals the pituitary, which signals the adrenal glands to release cortisol. Cortisol then feeds back to shut the loop down.",s:"Steroids slide 4"},
{id:"e22",b:2,u:"steroids",o:"s1",q:"Which class of corticosteroids provides the anti-inflammatory effect used in asthma?",c:["Glucocorticoids","Mineralocorticoids","Catecholamines","Leukotrienes"],e:"Synthetic glucocorticoids are designed to optimize anti-inflammatory activity. Mineralocorticoids regulate salt and water.",s:"Steroids slide 3"},
{id:"e23",b:2,u:"steroids",o:"s1",q:"Corticosteroids block the metabolites of which pathway?",c:["Arachidonic acid (leukotrienes and prostaglandins)","Glycolysis","The Krebs cycle","Nitric oxide synthesis"],e:"Blocking arachidonic-acid metabolites is one of the main anti-inflammatory actions on slide 8.",s:"Steroids slide 8"},
{id:"e24",b:2,u:"steroids",o:"s1",q:"Which phase of the allergic inflammatory response do corticosteroids inhibit?",c:["Late-phase inflammation","Only the immediate (early) bronchospasm","Neither phase","Only the recovery phase"],e:"Corticosteroids inhibit late-phase inflammation. They are not immediate bronchodilators.",s:"Steroids slide 8"},
{id:"e25",b:2,u:"steroids",o:"s1",q:"“Glucocorticoids restore responsiveness to β-adrenergic stimulation” means that:",c:["Patients respond better to β-agonists such as albuterol","Steroids act as β-agonists themselves","Steroids block β receptors","Albuterol is no longer needed"],e:"Steroids increase the number and availability of β receptors, so bronchodilators work better.",s:"Steroids slide 9"},
{id:"e26",b:2,u:"steroids",o:"s3",q:"A patient on prednisone for 3 years has a vertebral compression fracture. The most likely steroid-related cause is:",c:["Osteoporosis","Cardiac hypertrophy","Oral candidiasis","Adrenal crisis"],e:"Osteoporosis is a cushingoid effect of long-term systemic corticosteroids.",s:"Steroids slide 11"},
{id:"e27",b:2,u:"steroids",o:"s3",q:"Which cushingoid effects are specific to women on long-term systemic steroids?",c:["Dark facial hair and amenorrhea","Moon face and buffalo hump","Abdominal striae","Muscle wasting"],e:"The Cushing diagram lists dark facial hair and amenorrhea “in women.” The other options occur in both sexes.",s:"Steroids slide 11"},
{id:"e28",b:2,u:"steroids",o:"s3",q:"A patient has a moon face, buffalo hump and abdominal striae after a year of daily prednisone. This is:",c:["Iatrogenic Cushing syndrome","Addison disease","Adrenal crisis","Leukotriene excess"],e:"“Iatrogenic” means caused by treatment, here long-term exogenous glucocorticoids.",s:"Steroids slide 11"},
{id:"e29",b:2,u:"steroids",o:"s3",q:"In which parts of the airway can ICS-related fungal infections occur?",c:["Mouth, pharynx and larynx","Alveoli only","Bronchioles only","Pleural space"],e:"Candida albicans or Aspergillus niger can infect the mouth, pharynx and larynx.",s:"Steroids slide 12"},
{id:"e30",b:2,u:"steroids",o:"s4",q:"Which steroid route carries a VERY LOW systemic side-effect risk at therapeutic doses?",c:["Inhaled","Oral","Intravenous","All routes are equal"],e:"ICS act locally. OCS and IV steroids are systemic with high side-effect risk.",s:"Steroids slide 17"},
{id:"e31",b:2,u:"steroids",o:"s4",q:"Three weeks into ICS therapy, a patient’s peak flows are still slowly improving. Is that expected?",c:["Yes. FEV₁ and PEF can take 3–6 weeks to reach maximum improvement","No, ICS should peak within 48 hours","No, it means the ICS has failed","Only if she is also on oral steroids"],e:"ICS time course: symptoms improve in 1–2 weeks, FEV₁/PEF peak at 3–6 weeks, and maximum overall improvement takes 4–8 weeks.",s:"Steroids slide 16"},
{id:"e32",b:2,u:"steroids",o:"s4",q:"How long can improvement in bronchial hyperresponsiveness continue on inhaled steroids?",c:["Over one year","Only 24 hours","Exactly 2 weeks","It never improves"],e:"BHR improvement can take 1–3 months and continue for over a year.",s:"Steroids slide 16"},
{id:"e33",b:2,u:"steroids",o:"s2",q:"Which ICS instruction is INCORRECT?",c:["“Stop the inhaler once you feel better.”","“Use it every day, even when you feel well.”","“Rinse your mouth and spit after each dose.”","“Use a spacer with your MDI.”"],e:"ICS are daily maintenance and prevention drugs. Stopping when symptoms improve lets the inflammation return.",s:"Steroids slides 14 & 17"},
{id:"e34",b:2,u:"steroids",o:"s2",q:"The main purpose of a spacer with an ICS inhaler is to:",c:["Reduce oropharyngeal deposition (less thrush, more drug to the lungs)","Make the drug act faster than albuterol","Heat the aerosol","Replace the need to rinse"],e:"A spacer device and gargling after treatment reduce oropharyngeal deposition.",s:"Steroids slide 14"},
{id:"e35",b:2,u:"steroids",o:"s2",q:"Why is early, consistent ICS therapy encouraged in persistent asthma?",c:["Steroids can prevent remodeling but cannot completely reverse established hyperplasia or fibrosis","Steroids completely reverse any remodeling at any time","Early therapy prevents all side effects","ICS cure asthma after 4 weeks"],e:"Prevention matters because established remodeling changes in the airway wall can’t be fully undone.",s:"Steroids slide 15"},
{id:"e36",b:2,u:"steroids",o:"s3",q:"Two patients use the same ICS. Patient A also takes daily oral prednisone. Who is more likely to develop oral thrush?",c:["Patient A","Patient B","Equal risk","Neither — ICS never cause thrush"],e:"Fungal infection is dose-related and more likely in patients who are also taking oral steroids.",s:"Steroids slide 14"},
{id:"e37",b:2,u:"steroids",o:"s5",q:"What do leukotrienes do to mucociliary clearance?",c:["Decrease it","Increase it","Have no effect","Double it"],e:"Leukotrienes increase mucus secretion and decrease mucociliary clearance.",s:"Steroids slide 19"},
{id:"e38",b:2,u:"steroids",o:"s5",q:"Which leukotriene effect most directly contributes to airway mucosal edema?",c:["Increased vascular permeability","Decreased mucus secretion","Bronchodilation","Increased ciliary beating"],e:"Vasodilation plus increased vascular permeability lets fluid leak into the airway wall.",s:"Steroids slide 19"},
{id:"e39",b:2,u:"steroids",o:"s5",q:"Which best describes the action of a leukotriene modifier?",c:["Blocks the action of leukotrienes, substances that trigger asthma attacks","Digests extracellular DNA","Increases β-receptor numbers","Suppresses the HPA axis"],e:"Leukotriene modifiers block leukotriene action. They are used for long-term control.",s:"Steroids slide 20"},
{id:"e40",b:2,u:"steroids",o:"s4",q:"A patient in status asthmaticus is given an IV steroid bolus. When should increased β-receptor availability begin?",c:["Within 2–4 hours","Within 5 minutes","After 1–2 weeks","After 4 weeks"],e:"This 2–4 hour window is the rationale for an IV bolus in status asthmaticus. Continue bronchodilators meanwhile.",s:"Steroids slide 9"},

{id:"e50",b:2,u:"calc",o:"c2",q:"3% hypertonic saline contains how many mg/ml of NaCl?",c:["30 mg/ml","3 mg/ml","300 mg/ml","0.3 mg/ml"],e:"3% → move the decimal 1 place right → 30 mg/ml.",s:"Calc slide 5"},
{id:"e51",b:2,u:"calc",o:"c2",q:"A 0.25% solution contains:",c:["2.5 mg/ml","25 mg/ml","0.025 mg/ml","0.25 mg/ml"],e:"0.25% × 10 = 2.5 mg/ml.",s:"Calc slide 5"},
{id:"e52",b:2,u:"calc",o:"c2",q:"200 mg/ml expressed as a percentage is:",c:["20%","2%","200%","0.2%"],e:"mg/ml → %: move the decimal 1 place left. 200 → 20%.",s:"Calc slide 5"},
{id:"e53",b:2,u:"calc",o:"c2",q:"0.2 mg/ml expressed as a percentage is:",c:["0.02%","0.2%","2%","0.002%"],e:"0.2 ÷ 10 = 0.02%, the strength of ipratropium solution.",s:"Calc slide 5"},
{id:"e54",b:2,u:"calc",o:"c1",q:"A 1% solution means:",c:["1 g of solute per 100 ml (1 part in 100 parts), which equals 10 mg/ml","1 mg per ml","1 ml of drug per liter","1 g per ml"],e:"Percentage = parts of active ingredient per 100 parts. 1 g/100 ml = 1,000 mg/100 ml = 10 mg/ml.",s:"Calc slide 2"},
{id:"e55",b:2,u:"calc",o:"c1",q:"In an acetylcysteine solution, the acetylcysteine itself is the ___ and the water it is dissolved in is the ___.",c:["Solute; solvent","Solvent; solute","Schedule; strength","Strength; diluent"],e:"The solute (active ingredient) is dissolved by the solvent.",s:"Calc slide 3"},
{id:"e56",b:2,u:"calc",o:"c3",q:"Albuterol 1.25 mg is ordered. You have 0.5% solution. How many ml?",c:["0.25 ml","2.5 ml","0.125 ml","1.25 ml"],e:"0.5% = 5 mg/ml. 1.25 ÷ 5 = 0.25 ml.",s:"Calc slides 8–10"},
{id:"e57",b:2,u:"calc",o:"c3",q:"Acetylcysteine 300 mg is ordered. You have the 10% solution. How many ml?",c:["3 ml","30 ml","1.5 ml","0.3 ml"],e:"10% = 100 mg/ml. 300 ÷ 100 = 3 ml.",s:"Calc slides 11–12"},
{id:"e58",b:2,u:"calc",o:"c3",q:"Acetylcysteine 1,000 mg is ordered. You have the 20% solution. How many ml?",c:["5 ml","10 ml","2 ml","50 ml"],e:"20% = 200 mg/ml. 1,000 ÷ 200 = 5 ml.",s:"Calc slides 11–12"},
{id:"e59",b:2,u:"calc",o:"c3",q:"Cromolyn sodium 20 mg is ordered. You have a 1% solution. How many ml?",c:["2 ml","20 ml","0.2 ml","1 ml"],e:"1% = 10 mg/ml. 20 ÷ 10 = 2 ml.",s:"Calc slide 8"},
{id:"e60",b:2,u:"calc",o:"c3",q:"Ipratropium 0.25 mg is ordered. You have a 0.02% solution. How many ml?",c:["1.25 ml","12.5 ml","0.125 ml","2.5 ml"],e:"0.02% = 0.2 mg/ml. 0.25 ÷ 0.2 = 1.25 ml.",s:"Calc slide 8"},
{id:"e61",b:2,u:"calc",o:"c3",q:"Order: 0.15 mg/kg of a drug supplied as 0.5%. The child weighs 30 kg. How many ml?",c:["0.9 ml","4.5 ml","9 ml","0.45 ml"],e:"0.15 × 30 = 4.5 mg. 0.5% = 5 mg/ml. 4.5 ÷ 5 = 0.9 ml.",s:"Calc slide 14"},
{id:"e62",b:2,u:"calc",o:"c3",q:"Order: 0.05 mg/kg of a 0.5% drug. The child weighs 66 lb. How many ml?",c:["0.3 ml","1.5 ml","0.66 ml","3 ml"],e:"66 ÷ 2.2 = 30 kg. 0.05 × 30 = 1.5 mg. 1.5 ÷ 5 mg/ml = 0.3 ml.",s:"Calc slide 14"},
{id:"e63",b:2,u:"calc",o:"c3",q:"2 ml of 0.5% albuterol is mixed with 3 ml of normal saline. How much albuterol is in the nebulizer?",c:["10 mg","2 mg","25 mg","4 mg"],e:"0.5% = 5 mg/ml × 2 ml = 10 mg. The 3 ml of diluent doesn’t change the amount of drug.",s:"Calc slide 15"},
{id:"e64",b:2,u:"calc",o:"c3",q:"Prednisone 40 mg is ordered. Tablets on hand are 20 mg each. How many tablets?",c:["2 tablets","0.5 tablet","4 tablets","20 tablets"],e:"Proportions also work for tablets: 20 mg / 1 tab = 40 mg / x tab → x = 2.",s:"Calc slide 7"},
{id:"e65",b:2,u:"calc",o:"c3",q:"Beractant (Survanta, 4 ml/kg) is ordered for a 1,100 g infant. How many ml?",c:["4.4 ml","44 ml","1.1 ml","3.3 ml"],e:"1,100 g = 1.1 kg × 4 ml/kg = 4.4 ml.",s:"Review quizzes"},
{id:"e66",b:2,u:"calc",o:"c2",q:"A 3 ml unit dose of 0.083% albuterol contains about how many mg?",c:["2.5 mg","0.25 mg","25 mg","0.83 mg"],e:"0.083% = 0.83 mg/ml × 3 ml ≈ 2.5 mg.",s:"Calc slide 5"},
{id:"e67",b:2,u:"calc",o:"c3",q:"An order calls for 600 mg of acetylcysteine. Which preparation gives the SMALLEST volume?",c:["20% solution (3 ml)","10% solution (6 ml)","They’re the same volume","Neither can deliver 600 mg"],e:"The higher concentration needs less volume: 600 ÷ 200 = 3 ml vs 600 ÷ 100 = 6 ml.",s:"Calc slides 11–12"},
/* ---------- REVIEW BANK: Set 1 — Mucus & mucociliary physiology ---------- */
{id:"rA01",b:1,u:"mucus",o:"m6",q:"Mucus does NOT normally do which of the following in the healthy lung?",c:["Obstruct the airway","Prevent water movement across epithelia","Lubricate the airway","Prevent infection"],e:"Healthy mucus forms a protective barrier: it traps particles and pathogens, lubricates, and limits water movement across the epithelium. Airway obstruction only happens when mucus is excessive or abnormal.",s:"Review set 1 · #1"},
{id:"rA02",b:1,u:"mucus",o:"m6",q:"Which can cause impaired ciliary activity? I) Dehydration II) Thick mucus III) High FiO₂ IV) Endotracheal tubes",c:["I, II, III, and IV","I, II, and III","I and II","I, II, and IV"],e:"All four impair ciliary function. Dehydration and thick mucus increase the load on the cilia, high oxygen concentrations are toxic to ciliated cells, and an ETT bypasses and damages the mucociliary escalator.",s:"Review set 1 · #2"},
{id:"rA03",b:1,u:"mucus",o:"m6",q:"In which layer of the airways are cilia found?",c:["Mucosa","Submucosa","Adventitia","Endothelium"],e:"Ciliated epithelial cells (with goblet cells) make up the epithelium of the mucosa, the innermost layer lining the airway lumen.",s:"Review set 1 · #3"},
{id:"rA04",b:1,u:"mucus",o:"m2",q:"Ciliary activity is improved by which of the following?",c:["Sympathomimetic bronchodilators and corticosteroids","Water or saline solution and expectorants","Mucolytics","Anticholinergic medications"],e:"Improving ciliary activity is one of the three approaches to secretion management, achieved with sympathomimetic bronchodilators and corticosteroids.",s:"Review set 1 · #4"},
{id:"rA05",b:1,u:"mucus",o:"m2",q:"The gel layer is affected most by the administration of which of the following?",c:["Mucolytics","Water or saline solution and expectorants","Sympathomimetic bronchodilators and corticosteroids","Anticholinergic medications"],e:"Mucolytics alter the consistency of the gel layer, while water/saline and expectorants increase the depth of the sol layer.",s:"Review set 1 · #5"},
{id:"rA06",b:1,u:"mucus",o:"m6",q:"The volume or thickness of mucus can be increased by which of the following?",c:["Infection","Dehydration","Chronic bronchitis","Endotracheal tubes"],e:"Infection increases both the amount of mucus and its thickness (inflammatory cells, DNA and debris make it purulent). Note: answer keys vary on this item. Chronic bronchitis also raises volume and dehydration raises thickness, so check your instructor’s key.",s:"Review set 1 · #6"},
{id:"rA07",b:1,u:"mucus",o:"m2",q:"Which of the following is NOT a means of secretion management?",c:["Increasing the number of bronchial glands","Improving ciliary action","Increasing the depth of the sol layer","Altering the consistency of the gel layer"],e:"The three approaches are altering gel-layer consistency, increasing sol-layer depth, and improving ciliary activity. More bronchial glands means MORE mucus, which is a disease change.",s:"Review set 1 · #7"},
{id:"rA08",b:1,u:"mucus",o:"m6",q:"Repeated, prolonged exposure to irritants causes all of the following airway changes EXCEPT:",c:["Decreased mucus production","Increased number of bronchial glands","Increased size of bronchial glands","Decreased ciliary action"],e:"Chronic irritation (e.g., smoking) causes gland hyperplasia and hypertrophy, more mucus and impaired cilia, so mucus production goes UP.",s:"Review set 1 · #8"},
{id:"rA09",b:1,u:"mucus",o:"m6",q:"Which would NOT occur after inserting an endotracheal tube?",c:["Improved ciliary action","Accumulation of mucus in the lungs","Infection","Impaired ciliary action"],e:"An ETT impairs ciliary action and cough, so mucus accumulates and infection risk rises. It never improves ciliary function.",s:"Review set 1 · #9"},
{id:"rA10",b:1,u:"mucus",o:"m6",q:"The goblet cells and bronchial glands produce about how much mucus per day?",c:["100 ml","10 ml","20 ml","50 ml"],e:"About 100 ml of mucus is produced daily in the healthy lung. Most is reabsorbed or swallowed unnoticed.",s:"Review set 1 · #10"},

/* ---------- REVIEW BANK: Set 2 — Bland aerosols ---------- */
{id:"rB01",b:1,u:"mucus",o:"m1",q:"What is the TRUE statement in regard to sterile water?",c:["It is free of microorganisms and may contain additives to make it bacteriostatic","It is sterile and pure with no additives","It is not commonly used as a diluent for aerosolized medications","It is free of bacteriostatic properties"],e:"Sterile = free of microorganisms, with possible bacteriostatic additives. “Sterile and pure with no additives” describes DISTILLED water.",s:"Review set 2 · #1"},
{id:"rB02",b:1,u:"mucus",o:"m1",q:"Of the following, which is an isotonic solution?",c:["0.9%","5%","10%","0.45%"],e:"0.9% NaCl (normal saline) is isotonic to body fluids. 0.45% is hypotonic, and 5% and 10% are hypertonic.",s:"Review set 2 · #2"},
{id:"rB03",b:1,u:"mucus",o:"m1",q:"Which statements are TRUE about sterile vs distilled water? I) Sterile water contains additives with bacteriostatic properties. II) Sterile water is isotonic. III) Distilled water is isotonic. IV) Distilled water is both sterile and pure.",c:["I and IV","II and III","I only","I and II"],e:"Sterile water may contain bacteriostatic additives, and distilled water is sterile AND pure. Neither water is isotonic; both are hypotonic.",s:"Review set 2 · #3"},
{id:"rB04",b:1,u:"mucus",o:"m3",q:"Of the following solutions, which would you most likely choose to facilitate sputum induction?",c:["5% saline","0.5% saline","0.45% saline","0.9% saline"],e:"Sputum induction uses HYPERTONIC saline (1.8%–10%), and 5% is the only hypertonic choice.",s:"Review set 2 · #4"},
{id:"rB05",b:1,u:"mucus",o:"m3",q:"Which patients would benefit the most from aerosolized hypertonic saline?",c:["Those with cystic fibrosis","Those with asthma","Those with heart failure","Those with COPD"],e:"Hypertonic saline improves mucus clearance and lung function in CF. It can trigger bronchospasm in asthma and may decrease lung function in COPD.",s:"Review set 2 · #5"},
{id:"rB06",b:1,u:"mucus",o:"m3",q:"Sputum induction is best achieved with which of the following solutions?",c:["Hypertonic saline","Hypotonic saline","Sterile water","Normal saline"],e:"Hypertonic saline is irritating and osmotic, so it provokes a cough and draws fluid into the airway to produce a sample.",s:"Review set 2 · #6"},
{id:"rB07",b:1,u:"mucus",o:"m3",q:"Infants should NOT be delivered supplemental oxygen via which of the following?",c:["Ultrasonic nebulizer","Large-volume nebulizer","Small-volume nebulizer","Simple humidifier"],e:"Ultrasonic nebulizers deliver very high-density aerosol and can cause overhydration (fluid overload) in infants and small children.",s:"Review set 2 · #7"},
{id:"rB08",b:1,u:"mucus",o:"m1",q:"Which of the following is NOT a means of delivering particles of water to the lungs?",c:["Humidifiers","Direct instillation","Ultrasonic nebulizers","Large-volume nebulizers"],e:"Humidifiers add molecular water VAPOR, not particles. Nebulizers produce aerosol particles, and instillation places liquid directly.",s:"Review set 2 · #8"},
{id:"rB09",b:1,u:"mucus",o:"m6",q:"Which best describes the effect of having water available during mucus production?",c:["Maintains the viscoelasticity of the mucus","Depletes the gel layer","Depletes the sol layer","Antitussive properties"],e:"Adequate water keeps mucus at the right viscoelasticity (not too thick, not too thin) so cilia can move it efficiently.",s:"Review set 2 · #9"},

/* ---------- REVIEW BANK: Set 3 — Mucolytics, expectorants, antitussives ---------- */
{id:"rC01",b:1,u:"mucus",o:"m2",q:"Mucolytics are important for the health of the mucociliary system because they:",c:["Alter the viscosity of secretions","Stimulate coughing","Promote bronchial smooth muscle relaxation","Prevent atelectasis"],e:"Mucolytics break down the mucus molecule, decreasing viscosity so secretions can be moved by cilia and cough.",s:"Review set 3 · #1"},
{id:"rC02",b:1,u:"mucus",o:"m7",q:"Dextromethorphan is considered a(n):",c:["Antitussive","Mucolytic","Surfactant","Expectorant"],e:"Dextromethorphan is a non-opioid, centrally acting cough suppressant.",s:"Review set 3 · #2"},
{id:"rC03",b:1,u:"mucus",o:"m7",q:"Which are considered antitussives? I) Codeine II) Dextromethorphan III) Guaifenesin IV) Potassium iodide",c:["I and II","I and IV","II and III","III and IV"],e:"Codeine and dextromethorphan suppress cough. Guaifenesin and potassium iodide are EXPECTORANTS.",s:"Review set 3 · #3"},
{id:"rC04",b:1,u:"mucus",o:"m7",q:"Which is a reason to give an antitussive medication?",c:["Dry, hacking, nonproductive cough","Fulminant pulmonary edema","Bronchospasm accompanied by frequent cough","Accumulation of thick secretions leading to shortness of breath"],e:"Antitussives are for a nonproductive cough that serves no purpose. Suppressing a productive cough leads to retained secretions.",s:"Review set 3 · #4"},
{id:"rC05",b:1,u:"mucus",o:"m7",q:"Which is NOT an appropriate treatment plan for someone with thick, retained secretions who is receiving oxygen therapy?",c:["Administration of an antitussive, such as dextromethorphan","Intermittent acetylcysteine with a short-acting bronchodilator","Deep breathing, assisted coughing, and suctioning","Bland aerosol with sterile water via an LVN"],e:"The patient needs to clear secretions. Suppressing cough would make retention worse.",s:"Review set 3 · #5"},
{id:"rC06",b:1,u:"mucus",o:"m7",q:"Guaifenesin is considered which of the following?",c:["Expectorant","Surface-active agent","Antitussive","Mucolytic"],e:"Guaifenesin is an expectorant. It is thought to increase respiratory tract fluid (via a vagal-gastric reflex) to help bring up secretions.",s:"Review set 3 · #6"},
{id:"rC07",b:1,u:"mucus",o:"m7",q:"Which is NOT a way expectorants are thought to work?",c:["Breaking disulfide bonds in the mucus","Being absorbed into respiratory glands, directly stimulating mucus production","Increasing the amount of fluid in the respiratory tract","Increasing the vagal-gastric reflex"],e:"Breaking disulfide bonds is how the MUCOLYTIC acetylcysteine works. The other three are proposed expectorant mechanisms.",s:"Review set 3 · #7"},
{id:"rC08",b:1,u:"mucus",o:"m3",q:"A physician calls about a 68-year-old with chronic bronchitis who has very thick secretions she can’t remove. The drug most indicated is:",c:["Acetylcysteine","Sodium bicarbonate","Survanta®","Dornase alfa"],e:"Acetylcysteine is the mucolytic for thick mucoid secretions in non-CF patients. Dornase alfa is for CF, and Survanta is surfactant for neonatal RDS.",s:"Review set 3 · #8"},
{id:"rC09",b:1,u:"mucus",o:"m3",q:"Which is a potential adverse reaction to acetylcysteine? I) Bronchospasm II) Rhinorrhea III) Bronchorrhea IV) Stomatitis",c:["I, II, III, and IV","I, II, and III","I and IV","II and III"],e:"All four are listed adverse effects. NAC can also cause nausea and has a strong sulfur (“rotten egg”) odor.",s:"Review set 3 · #9"},
{id:"rC10",b:1,u:"mucus",o:"m3",q:"A patient ingested an entire bottle of acetaminophen. Which would you recommend?",c:["Acetylcysteine","Salmeterol","Dornase alfa","Pulmozyme®"],e:"NAC is the antidote for acetaminophen overdose: it replenishes glutathione and protects the liver.",s:"Review set 3 · #10"},

/* ---------- REVIEW BANK: Set 4 — Textbook chapter review ---------- */
{id:"rD01",b:1,u:"mucus",o:"m6",q:"What layer(s) make up the mucosal blanket that covers the airways?",c:["Sol and gel","Sol only","Gel only","None of the above"],e:"The mucus blanket has a watery periciliary SOL layer, where cilia beat, under a viscous GEL layer that traps particles.",s:"Chapter review · #1"},
{id:"rD02",b:1,u:"mucus",o:"m1",q:"Bland aerosols are aerosols that:",c:["Are nonmedicated","Have no taste","Are boring","Are colored"],e:"“Bland” means no drug: sterile water and saline solutions.",s:"Chapter review · #2"},
{id:"rD03",b:1,u:"mucus",o:"m3",q:"A patient with a dry, nonproductive cough needs a sputum induction for TB testing. Which solution may benefit most?",c:["Hypertonic","Hypotonic","Sterile water","Isotonic"],e:"Hypertonic saline is the sputum-induction solution. (Use airborne precautions for suspected TB.)",s:"Chapter review · #3"},
{id:"rD04",b:1,u:"mucus",o:"m3",q:"Dornase alfa (Pulmozyme®): I) is indicated for maintenance therapy of CF secretions II) ruptures disulfide bonds in sputum III) should not be mixed with other medications IV) should be refrigerated and protected from light",c:["I, III, and IV","I, II, and III","I and IV","IV only"],e:"Dornase digests DNA. Breaking disulfide bonds is acetylcysteine’s mechanism, so II is false.",s:"Chapter review · #4"},
{id:"rD05",b:1,u:"mucus",o:"m8",q:"During surfactant replacement, monitor for which hazards? I) Improved lung compliance II) Transient decrease in oxygenation III) Reflux of solution IV) Bradycardia",c:["II, III, and IV","I, II, III, and IV","I and II","I and III"],e:"Instillation can cause transient desaturation, bradycardia and reflux of surfactant up the ETT. Improved compliance is the desired EFFECT (though it means ventilator settings must be weaned quickly).",s:"Chapter review · #5"},
{id:"rD06",b:1,u:"mucus",o:"m6",q:"Which list gives four functions of mucus in a healthy pulmonary system?",c:["Traps and removes particles/pathogens, protects the epithelium (barrier), humidifies inspired air, and limits water loss across the epithelium","Exchanges O₂ and CO₂, lowers surface tension, dilates bronchi, and stimulates cough","Digests bacteria, produces surfactant, warms blood, and filters CO₂","Constricts airways, increases resistance, absorbs drugs, and slows cilia"],e:"For a written answer, you can list: protective barrier, trapping and clearing particles/microbes (mucociliary escalator), humidifying inspired gas, lubrication, and preventing water loss/waterproofing.",s:"Chapter review · #6"},
{id:"rD07",b:1,u:"mucus",o:"m4",q:"What is the typical aerosol dose range for acetylcysteine, and how can it be delivered?",c:["3–5 ml of 20% (or 6–10 ml of 10%) by nebulizer 3–4 times daily; or 1–2 ml of 10–20% by direct instillation","2.5 mg once daily by jet nebulizer only","0.5 ml of 0.5% in 3 ml saline every 4 hours","600 mg orally once weekly"],e:"NAC comes as 10% (100 mg/ml) and 20% (200 mg/ml). It is given by SVN, usually with a bronchodilator, or instilled directly into an artificial airway.",s:"Chapter review · #7"},
{id:"rD08",b:1,u:"mucus",o:"m4",q:"Which is best to prevent bronchospasm in a patient ordered nebulized acetylcysteine?",c:["Add 2.5 mg of albuterol to the acetylcysteine","Give 2 puffs of salmeterol before the acetylcysteine","Give 2.5 mg of albuterol after the acetylcysteine","Pretreat with 2.5 mg of albuterol by nebulizer 20 minutes before the acetylcysteine"],e:"NAC is compatible with albuterol, so mixing them gives bronchodilator coverage during the treatment. Salmeterol is too slow, and giving albuterol after is too late. (Some instructors also accept bronchodilator pretreatment, so check your key.)",s:"Chapter review · #8"},
{id:"rD09",b:1,u:"mucus",o:"m8",q:"You are preparing beractant for an 800 g male with RDS. What is the appropriate dose?",c:["3.2 ml","4 ml","5 ml","2 ml"],e:"Beractant (Survanta) is 4 ml/kg. 800 g = 0.8 kg, and 0.8 × 4 = 3.2 ml.",s:"Chapter review · #9"},
{id:"rD10",b:1,u:"mucus",o:"m8",q:"Critical functions of surfactant: I) improves oxygenation II) prevents alveolar collapse III) reduces risk of intrapulmonary hemorrhage IV) decreases work of breathing",c:["I, II, and IV","I only","I and II","I, II, III, and IV"],e:"Surfactant lowers alveolar surface tension, which prevents collapse, improves oxygenation and decreases WOB. It does NOT reduce hemorrhage risk; pulmonary hemorrhage is a potential complication of surfactant therapy.",s:"Chapter review · #10"},
{id:"rD11",b:1,u:"mucus",o:"m8",q:"What is the primary indication for surfactant replacement therapy?",c:["Respiratory distress syndrome (RDS)","Pneumonia","Meconium aspiration","Pulmonary hemorrhage"],e:"RDS of the premature newborn is caused by surfactant deficiency. Surfactant is given for prevention (prophylaxis) or rescue.",s:"Chapter review · #11"},
{id:"rD12",b:1,u:"mucus",o:"m8",q:"How is surfactant administered?",c:["By instilling the solution directly into the endotracheal tube","By MDI","By aerosol","Intravenously"],e:"Surfactant is instilled through the ETT (often in aliquots, with or without position changes), followed by ventilation to distribute it.",s:"Chapter review · #12"},
{id:"rD13",b:1,u:"mucus",o:"m8",q:"Calfactant is ordered for a baby weighing 1.5 kg. What dose should be given?",c:["4.5 ml","6.0 ml","3.75 ml","7.5 ml"],e:"Calfactant (Infasurf) is 3 ml/kg, so 1.5 × 3 = 4.5 ml. (6.0 ml would be the beractant dose at 4 ml/kg, and 3.75 ml would be poractant at 2.5 ml/kg.)",s:"Chapter review · #13"},

/* ---------- BUILT FROM THE REVIEW TOPICS ---------- */
{id:"x01",b:2,u:"mucus",o:"m6",q:"In which layer of the mucus blanket do the cilia beat?",c:["The sol (periciliary) layer","The gel layer","The basement membrane","The submucosa"],e:"Cilia beat in the thin, watery sol layer. Their tips catch the overlying gel layer and push it toward the pharynx.",s:"Built from review topics"},
{id:"x02",b:2,u:"mucus",o:"m6",q:"Which structures produce most of the airway’s mucus?",c:["Submucosal (bronchial) glands","Goblet cells","Type II pneumocytes","Clara cells"],e:"Goblet cells contribute some mucus, but the submucosal glands produce the majority. Those glands enlarge and multiply in chronic bronchitis.",s:"Built from review topics"},
{id:"x03",b:2,u:"mucus",o:"m6",q:"A patient on 100% oxygen for 24 hours has increasingly retained secretions. One reason is that high FiO₂:",c:["Impairs ciliary activity","Increases sol-layer depth","Breaks disulfide bonds","Stimulates surfactant production"],e:"High oxygen concentrations depress ciliary function, which adds to dehydration, an artificial airway and thick mucus as causes of retention.",s:"Built from review topics"},
{id:"x04",b:2,u:"mucus",o:"m6",q:"A long-time smoker has a chronic productive cough. Which airway change best explains his excess sputum?",c:["Hyperplasia and hypertrophy of bronchial glands with impaired cilia","Decreased mucus production","Increased ciliary beat frequency","Loss of the gel layer"],e:"Chronic irritant exposure increases the number and size of glands and impairs ciliary action, so the result is more mucus and poorer clearance.",s:"Built from review topics"},
{id:"x05",b:2,u:"mucus",o:"m6",q:"Mucus that is too thin (watery) is cleared poorly because:",c:["Cilia need mucus with proper viscoelasticity; too thin or too thick both impair transport","Thin mucus is always infected","Cilia only work in dehydrated mucus","Thin mucus blocks surfactant"],e:"This is why over-hydrating with large-volume or ultrasonic aerosols can impair mucociliary function.",s:"Built from review topics"},
{id:"x06",b:2,u:"mucus",o:"m3",q:"A patient with dried, retained secretions receives continuous bland aerosol and suddenly has worsening airway obstruction. What happened?",c:["Dried secretions absorbed water and swelled, worsening obstruction","Bland aerosol caused an adrenal crisis","The saline digested DNA","The sol layer was depleted"],e:"Swelling of dried, retained secretions is a recognized hazard of bland aerosol, along with bronchospasm, overhydration (infants) and infection from contaminated equipment.",s:"Built from review topics"},
{id:"x07",b:2,u:"mucus",o:"m3",q:"Which is a hazard of bland aerosol therapy?",c:["Cross-contamination/infection from nebulizer equipment","Adrenal suppression","Hepatotoxicity","Cataracts"],e:"Reservoirs of water can grow bacteria. Other hazards are bronchospasm (especially hypertonic saline or sterile water), overhydration and swelling of retained secretions.",s:"Built from review topics"},
{id:"x08",b:2,u:"mucus",o:"m1",q:"What is the key difference between a humidifier and a nebulizer?",c:["A humidifier adds molecular water vapor; a nebulizer produces liquid aerosol particles","A humidifier produces larger particles","A nebulizer produces only vapor","They are identical"],e:"Only nebulizers (SVN, LVN, ultrasonic) and direct instillation deliver liquid particles to the lungs.",s:"Built from review topics"},
{id:"x09",b:2,u:"mucus",o:"m7",q:"A post-op patient with a loose, productive cough asks for a cough syrup with dextromethorphan. Best response?",c:["Suppressing a productive cough can lead to retained secretions; encourage deep breathing and effective coughing instead","Give it to stop the cough completely","Add codeine for faster effect","Give guaifenesin and dextromethorphan with no assessment"],e:"Antitussives are reserved for a dry, nonproductive, exhausting cough.",s:"Built from review topics"},
{id:"x10",b:2,u:"mucus",o:"m7",q:"Which adverse effect is most important to monitor when codeine is used as an antitussive?",c:["Respiratory depression and sedation (plus constipation)","Bronchorrhea","Oral thrush","Hypertension from vasoconstriction"],e:"Codeine is an opioid. Its central effects can depress breathing and suppress the protective cough reflex.",s:"Built from review topics"},
{id:"x11",b:2,u:"mucus",o:"m7",q:"Potassium iodide is classified as a(n):",c:["Expectorant","Antitussive","Mucolytic","Surfactant"],e:"Iodide expectorants are thought to stimulate respiratory gland secretion. Guaifenesin is the more common expectorant.",s:"Built from review topics"},
{id:"x12",b:2,u:"mucus",o:"m7",q:"Mucolytic vs expectorant: which pairing is correct?",c:["Mucolytic: breaks down the mucus molecule (gel layer). Expectorant: increases airway fluid (sol layer) to aid expectoration","Mucolytic: increases airway fluid. Expectorant: breaks disulfide bonds","Both suppress cough","Both are corticosteroids"],e:"Acetylcysteine and dornase alfa are mucolytics. Guaifenesin and potassium iodide are expectorants.",s:"Built from review topics"},
{id:"x13",b:2,u:"mucus",o:"m3",q:"You open a vial of 20% acetylcysteine and use part of it. How should the remainder be stored?",c:["Refrigerated and used within 96 hours","At room temperature for 30 days","Frozen for later use","Discarded immediately in all cases"],e:"Opened NAC vials are refrigerated and used within 96 hours. A light purple color change does not affect its potency.",s:"Built from review topics"},
{id:"x14",b:2,u:"mucus",o:"m3",q:"A patient receiving nebulized acetylcysteine complains of a smell like rotten eggs. This is due to:",c:["The sulfur (thiol) groups in the drug, which is expected and harmless","Bacterial contamination","An allergic reaction","Mixing it with albuterol"],e:"The sulfur odor comes from NAC’s thiol groups and can cause nausea. Reassure the patient.",s:"Built from review topics"},
{id:"x15",b:2,u:"mucus",o:"m4",q:"Acetylcysteine is ordered for direct instillation into a tracheostomy tube. What is a typical dose?",c:["1–2 ml of 10–20% solution","10 ml of 20% solution","0.1 ml of 1% solution","25 ml of 10% solution"],e:"Direct instillation uses small volumes (1–2 ml, about every 1–4 hours as needed), followed by suctioning.",s:"Built from review topics"},
{id:"x16",b:2,u:"mucus",o:"m8",q:"Surfactant replacement works mainly by:",c:["Lowering alveolar surface tension, which stabilizes alveoli and increases compliance","Dilating the bronchi","Thinning mucus","Increasing β-receptor numbers"],e:"Lower surface tension prevents alveolar collapse at end-expiration, improving FRC, oxygenation and compliance.",s:"Built from review topics"},
{id:"x17",b:2,u:"mucus",o:"m8",q:"Shortly after surfactant is given, the infant’s chest rise and SpO₂ improve markedly. What must the RT do?",c:["Promptly wean ventilator pressures/volumes and FiO₂ to avoid overdistension, pneumothorax and hyperoxia","Increase PIP to maintain the effect","Give a second dose immediately","Suction the ETT right away"],e:"Compliance can improve within minutes. Settings that were needed before the dose can then cause barotrauma and hyperoxia. Avoid suctioning right after the dose so the surfactant isn’t removed.",s:"Built from review topics"},
{id:"x18",b:2,u:"mucus",o:"m8",q:"During surfactant instillation, the infant’s heart rate drops to 70 and SpO₂ falls. Best action?",c:["Pause instillation, ventilate/increase FiO₂ until the infant recovers, then resume","Continue instilling faster to finish","Extubate the infant","Give albuterol"],e:"Transient bradycardia and desaturation are common. Stop, stabilize, then continue.",s:"Built from review topics"},
{id:"x19",b:2,u:"mucus",o:"m8",q:"Which surfactant is matched with its correct dose?",c:["Poractant alfa (Curosurf): 2.5 ml/kg initial dose","Beractant (Survanta): 2.5 ml/kg","Calfactant (Infasurf): 4 ml/kg","Poractant alfa: 3 ml/kg"],e:"Beractant 4 ml/kg, calfactant 3 ml/kg, poractant 2.5 ml/kg initially (1.25 ml/kg for repeat doses).",s:"Built from review topics"},
{id:"x20",b:2,u:"mucus",o:"m8",q:"Poractant alfa (Curosurf) is ordered for a 1.2 kg infant (initial dose 2.5 ml/kg). How many ml?",c:["3 ml","2.5 ml","4.8 ml","1.2 ml"],e:"1.2 kg × 2.5 ml/kg = 3 ml.",s:"Built from review topics"},
{id:"x21",b:2,u:"mucus",o:"m8",q:"Beractant (Survanta) 4 ml/kg is ordered for a 1,250 g infant. How many ml?",c:["5 ml","4 ml","3.75 ml","12.5 ml"],e:"1,250 g = 1.25 kg, and 1.25 × 4 = 5 ml. Convert grams to kg first.",s:"Built from review topics"},
{id:"x22",b:2,u:"mucus",o:"m8",q:"Beractant, calfactant and poractant alfa are all:",c:["Natural (animal-derived) surfactants","Synthetic protein-free surfactants","Mucolytics","Corticosteroids"],e:"Beractant (bovine lung extract), calfactant (calf lung lavage) and poractant (porcine lung) are all natural surfactants.",s:"Built from review topics"},
{id:"x23",b:2,u:"mucus",o:"m3",q:"Why should 0.45% saline (rather than sterile water) be used in an ultrasonic nebulizer for an adult needing bland aerosol?",c:["It is less irritating, so it is less likely to cause bronchospasm, while still being hypotonic","It is hypertonic and induces sputum","It contains a mucolytic","It breaks disulfide bonds"],e:"0.45% saline is less irritating than sterile water or hypertonic saline and is used with ultrasonic or large-volume nebulizers or as a diluent.",s:"Built from review topics"},
{id:"x24",b:2,u:"mucus",o:"m2",q:"Match the approach to its target: altering gel consistency / increasing sol depth / improving cilia.",c:["Mucolytics / water, saline & expectorants / sympathomimetics & corticosteroids","Expectorants / mucolytics / anticholinergics","Corticosteroids / mucolytics / saline","Antitussives / expectorants / surfactant"],e:"These are the three pharmacologic approaches to secretion management.",s:"Built from review topics"},
/* ---------- MUCUS ---------- */
{id:"m01",u:"mucus",o:"m1",q:"Normal mucus is composed of approximately what percentage of water?",c:["95%","50%","75%","99.9%"],e:"The mucus molecule is very large and complex, yet it is about 95% water. Its volume, consistency and structure can change in disease states.",s:"Mucus slide 3"},
{id:"m02",u:"mucus",o:"m1",q:"Which statement best defines a mucolytic agent?",c:["A drug that directly alters the structure of the mucus molecule, liquefying it to aid expectoration","A solution that increases the depth of the sol layer by adding water","A drug that improves ciliary beat activity","An agent that suppresses the cough reflex"],e:"Mucolytics control mucus by directly altering the structure of the mucus molecule — they break down the complex molecular strands to thin and liquefy it.",s:"Mucus slide 19"},
{id:"m03",u:"mucus",o:"m1",q:"Which group of agents primarily increases the depth of the sol layer?",c:["Water or saline solutions and expectorants","Mucolytics such as acetylcysteine","Sympathomimetic bronchodilators","Corticosteroids"],e:"Three approaches: mucolytics alter the consistency of the gel layer; water/saline and expectorants increase the depth of the sol layer; sympathomimetic bronchodilators and corticosteroids improve ciliary activity.",s:"Mucus slide 5"},
{id:"m04",u:"mucus",o:"m2",q:"Which drug groups are listed as improving ciliary activity?",c:["Sympathomimetic bronchodilators and corticosteroids","Hypertonic saline and sterile water","Dornase alfa and acetylcysteine","CFTR correctors and potentiators"],e:"Improving ciliary activity is the third pharmacologic approach to secretion management, achieved with sympathomimetic bronchodilators and corticosteroids.",s:"Mucus slide 5"},
{id:"m05",u:"mucus",o:"m2",q:"How do bland aerosols differ from mucolytics in their effect on mucus?",c:["Bland aerosols do not act on the mucus molecule directly and may only dilute it; mucolytics break down the molecule’s structure","Bland aerosols break disulfide bonds; mucolytics only add water","Both digest extracellular DNA","Bland aerosols open CFTR chloride channels; mucolytics do not"],e:"Bland aerosols do not affect the mucus molecule directly — they MAY dilute mucus by altering its water content, and their irritation can increase production of thinner mucus. Mucolytics directly break the molecular strands.",s:"Mucus slides 9 & 19"},
{id:"m06",u:"mucus",o:"m2",q:"N-acetyl-L-cysteine (NAC) thins mucus by:",c:["Substituting free thiol groups for the disulfide bonds that connect mucin proteins","Digesting extracellular DNA","Increasing chloride transport through CFTR","Stimulating β2 receptors to increase ciliary beat"],e:"NAC disrupts the mucus polymer by substituting free thiol (sulfhydryl) groups for the disulfide bonds linking mucin proteins, reducing viscosity immediately.",s:"Mucus slide 21"},
{id:"m07",u:"mucus",o:"m2",q:"Dornase alfa (Pulmozyme) decreases mucus viscosity by:",c:["Digesting extracellular DNA in the secretions","Breaking disulfide bonds in mucin with thiol groups","Osmotically hydrating the sol layer","Correcting misfolded CFTR protein"],e:"Dornase alfa is a peptide mucolytic — a recombinant form of human DNase I — that digests extracellular DNA, decreasing viscosity and restoring the mucus’s ability to flow.",s:"Mucus slide 23"},
{id:"m08",u:"mucus",o:"m3",q:"Dornase alfa is indicated as:",c:["Maintenance therapy for the viscous pulmonary secretions of cystic fibrosis","Rescue therapy for acute bronchospasm","An antidote for acetaminophen overdose","A sputum-induction agent"],e:"Dornase alfa is indicated as maintenance therapy in managing the viscous pulmonary secretions seen in cystic fibrosis.",s:"Mucus slide 22"},
{id:"m09",u:"mucus",o:"m3",q:"Besides its use as a mucolytic, acetylcysteine is used as:",c:["An antioxidant antidote to reduce liver injury from acetaminophen overdose","An anticoagulant","A long-acting bronchodilator","An antifungal for oral candidiasis"],e:"A second use of NAC is as an antioxidant antidote to reduce hepatic injury with acetaminophen overdose.",s:"Mucus slide 20"},
