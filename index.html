 {q:"Which controller is preferred for her?",c:["A low-dose inhaled corticosteroid (or ICS-formoterol)","A second short-acting bronchodilator","Daily oral prednisone year-round","An antihistamine"],e:"ICS are the backbone of persistent asthma control."},
 {q:"Which are acceptable alternatives to a low-dose ICS in mild persistent asthma?",c:["A leukotriene modifier (e.g., montelukast) or cromolyn","Acetylcysteine or dornase alfa","IV methylprednisolone","Antibiotics"],e:"Per lecture, leukotriene modifiers are alternatives to low-dose ICS, and mast cell stabilizers are another preventive option."},
 {q:"Her episodes are seasonal (fall). When should the controller be started?",c:["Before the season begins, and used daily through it","Only on days she’s wheezing","After her peak flow drops below 50%","Once the season ends"],e:"Controllers need time to work (seasonal BHR needs at least a week; ICS 1–2 weeks for initial improvement)."},
 {q:"If she uses cromolyn, how should she take it?",c:["Regularly every day and before allergen exposure; it won’t stop an attack in progress","Only during an attack","Once a month","Only with food"],e:"Cromolyn is a preventive mast cell stabilizer."},
 {info:"During a fall episode her peak flow is 48% of predicted and albuterol helps only briefly.",q:"Which is most appropriate in addition to her rescue inhaler?",c:["A short oral corticosteroid burst and medical evaluation, per her asthma action plan","Start cromolyn now to stop the attack","An antihistamine","Double her montelukast"],e:"A peak flow at or below ~50% signals a serious exacerbation. Systemic steroids treat the acute flare; controllers don’t stop an attack."},
 {q:"Which teaching goes with her new ICS?",c:["Use it every day even when well, with a spacer, and rinse/gargle and spit after each dose","Use it only when peak flow drops","Swallow after each puff","Stop it once the fall season ends without telling her provider"],e:"This reduces thrush and ensures steady anti-inflammatory control."}
]},
{id:"c72",ws:1,u:"steroids",title:"Case Study 7–2 — Crane operator with new spring allergies",who:"40-year-old man · seasonal allergic rhinitis",text:"A 40-year-old man recently changed jobs and now works outdoors at a lumberyard, operating a large crane that moves logs. He has never had significant seasonal allergies, but this spring he developed severe allergy symptoms. He feels fine in the morning, but by lunchtime he has nasal congestion, itching and watery red eyes that affect his work.",
 answer:{med:"A second-generation (non-sedating) oral antihistamine such as fexofenadine or loratadine, taken once daily in the morning before he goes to work and continued every day through the pollen season. An intranasal corticosteroid daily is a good option or add-on for the congestion.",why:"His symptoms come from allergen (pollen/wood dust) exposure at work: IgE-triggered mast cells release histamine, causing itching, sneezing, watery eyes and congestion. Antihistamines block H₁ receptors so released histamine can’t act, and taking one before exposure prevents symptoms. Because he operates a crane, he must avoid sedating first-generation antihistamines (e.g., diphenhydramine) and alcohol, and must not operate machinery if any antihistamine makes him drowsy; anticholinergic effects such as blurred vision also matter for his job. Intranasal steroids treat the nasal inflammation and congestion locally with little systemic effect."},
 steps:[
 {q:"What is causing his symptoms?",c:["Allergen exposure at work triggering IgE-mediated histamine release from mast cells","A viral infection","Side effects of an inhaled corticosteroid","Adrenal insufficiency"],e:"New outdoor exposure (pollen, wood dust) with classic allergic rhinitis and conjunctivitis symptoms."},
 {q:"Which medication type is most appropriate?",c:["A second-generation (non-sedating) oral antihistamine","A first-generation antihistamine such as diphenhydramine","Oral prednisone daily all season","Acetylcysteine"],e:"Second-generation antihistamines relieve itching, sneezing and watery eyes with much less sedation."},
 {q:"When should he take it?",c:["Every morning before work, so it is working before his exposure, daily through the season","Only at lunchtime once symptoms start","At bedtime only, after symptoms","Once a week"],e:"His symptoms start midday at work, so taking it before exposure prevents them."},
 {q:"Given his job, what is the most important caution?",c:["Avoid sedating first-generation antihistamines and alcohol, and don’t operate the crane if he feels drowsy","Avoid drinking water","Take a double dose for faster relief","No precautions are needed"],e:"Sedation and blurred vision from antihistamines could be dangerous while operating heavy machinery."},
 {q:"His nasal congestion is the most bothersome symptom. What could be added?",c:["A daily intranasal corticosteroid","Nebulized cromolyn for his lungs","IV methylprednisolone","Dornase alfa"],e:"Intranasal corticosteroids reduce nasal inflammation and congestion locally."},
 {q:"Which antihistamine side effect could specifically affect his ability to see while operating the crane?",c:["Blurred vision (anticholinergic effect)","Hyperglycemia","Oral thrush","Bronchospasm"],e:"Anticholinergic effects include dry mouth, blurred vision and urinary retention."}
]},
{id:"c73",ws:1,u:"steroids",title:"Chapter 7 Case — Hoarse voice and white spots",who:"57-year-old man · asthma",text:"A 57-year-old asthmatic comes to clinic complaining of voice changes, hoarseness, white spots on his throat and tongue, and a “funny taste in his mouth.” He uses several inhalers but isn’t sure which is which.",
 answer:{med:"Suspect his inhaled corticosteroid (by MDI or DPI). Treatment: an antifungal for the oropharyngeal candidiasis per the prescriber (e.g., nystatin swish-and-swallow or clotrimazole troches), and continue the ICS. Add a spacer/valved holding chamber for MDIs, rinse, gargle and spit after every dose, and recheck technique and dose.",why:"Hoarseness (dysphonia) and white plaques with altered taste are classic local side effects of ICS deposited in the mouth and throat: Candida albicans (or Aspergillus niger) infection of the mouth, pharynx and larynx. Risk is dose-related and higher if he also takes oral steroids. Stopping the ICS would leave his asthma uncontrolled, so the fix is treating the infection and reducing oropharyngeal deposition. Follow-up confirms the thrush has cleared, his voice has improved and his asthma is still controlled."},
 steps:[
 {q:"Which medication and route are most likely causing his symptoms?",c:["An inhaled corticosteroid","An oral leukotriene modifier","A short-acting β-agonist","An oral antihistamine"],e:"These are classic ICS local side effects."},
 {q:"The white spots are most likely:",c:["Oropharyngeal candidiasis (Candida albicans)","Iatrogenic Cushing syndrome","Leukoplakia from albuterol","Allergic reaction to cromolyn"],e:"Candida albicans or Aspergillus niger infections occur in the mouth, pharynx and larynx."},
 {q:"What is the hoarseness called?",c:["Dysphonia","Dysphagia","Dyspnea","Dysgeusia"],e:"Dysphonia is voice change or hoarseness, from steroid effects on the laryngeal muscles plus local irritation. (Dysgeusia is the altered “funny” taste.)"},
 {q:"Which plan is best?",c:["Treat the thrush with an antifungal, continue the ICS, add a spacer, and rinse/gargle and spit after each dose","Stop all inhalers","Switch to long-term oral prednisone","Double the ICS dose"],e:"Keep the controller and reduce deposition."},
 {q:"Which factor would make his thrush MORE likely?",c:["A higher ICS dose or also taking oral steroids","Using a spacer","Rinsing after each dose","Using a lower dose"],e:"Fungal infection is dose-related and more likely with concurrent oral steroids."},
 {q:"What should follow-up include?",c:["Checking that the thrush has cleared, his voice has improved, his technique is correct and his asthma remains controlled","Nothing; these problems never recur","Checking sweat chloride","Liver enzymes"],e:"Education plus follow-up prevents recurrence while keeping asthma controlled."}
]},
{id:"c74",ws:1,u:"steroids",title:"Chapter 7 Case — Three inhalers, one routine",who:"Adult with severe late-phase asthma responses",text:"A patient with a history of severe late-phase asthma responses is prescribed an inhaled short-acting bronchodilator, an inhaled corticosteroid and a mast cell stabilizer (cromolyn). The patient asks you to explain, in plain language, when to use each one.",
 answer:{med:"Short-acting bronchodilator (albuterol): rescue for sudden symptoms, and first in the routine to open the airways. Mast cell stabilizer (cromolyn): every day and before known triggers, to keep attacks from starting. Inhaled corticosteroid: every day, last in the routine, then rinse, gargle and spit. Order: bronchodilator → cromolyn → ICS.",why:"Late-phase reactions are driven by inflammatory cells hours after exposure; a bronchodilator alone only treats the early bronchospasm. Cromolyn prevents mast cells from releasing mediators (blunting both phases if taken beforehand), and the ICS suppresses ongoing inflammation and late-phase responses. Giving the bronchodilator first opens the airways so the controllers reach deeper, and giving the ICS last lets the patient rinse away throat deposits. Side effects to mention: albuterol shakiness and fast heartbeat; cromolyn mild cough or throat irritation; ICS thrush and hoarseness. Expected benefits build over weeks: fewer and milder attacks, less rescue use, better sleep and steadier peak flows."},
 steps:[
 {q:"In plain language, when is the short-acting bronchodilator used?",c:["“For quick relief when you’re wheezing or tight, and first in your daily routine to open your airways.”","“Only once a month.”","“Only after the steroid.”","“Never at home.”"],e:"The SABA is the rescue drug, and it also goes first in the routine."},
 {q:"In plain language, when is cromolyn used?",c:["“Every day, and before your triggers, to stop attacks from starting; it won’t help once an attack has begun.”","“Only during an attack.”","“Once a week.”","“Only if the steroid isn’t working.”"],e:"Cromolyn is a preventive mast cell stabilizer."},
 {q:"In plain language, when is the inhaled corticosteroid used?",c:["“Every day, even when you feel fine, to calm the swelling in your airways; then rinse and spit.”","“Only when you’re short of breath.”","“Only in the fall.”","“As a rescue inhaler.”"],e:"ICS are daily maintenance drugs that control the late-phase inflammation."},
 {q:"What is the correct sequence?",c:["Bronchodilator → cromolyn → inhaled corticosteroid","Corticosteroid → cromolyn → bronchodilator","Cromolyn → corticosteroid → bronchodilator","Any order"],e:"Open the airways first, and give the ICS last so the patient can rinse."},
 {q:"Which side-effect counseling is correct?",c:["Albuterol: shakiness and fast heartbeat. Cromolyn: mild cough or throat irritation. ICS: thrush and hoarseness (prevent with spacer + rinse)","All three cause adrenal crisis","Cromolyn causes Cushing syndrome","Albuterol causes oral thrush"],e:"Each drug has its own side-effect profile, and cromolyn has very few."},
 {q:"What positive outcomes should the patient expect, and when?",c:["Over several weeks: fewer and milder attacks, less rescue-inhaler use, better sleep and steadier peak flows","Complete cure within 24 hours","No change for a year","Immediate relief from the ICS"],e:"Controllers work over weeks (ICS max 4–8 weeks; cromolyn 2–4 weeks)."}
]},
{id:"wm1",ws:1,u:"mucus",title:"Mucus Case 1 — CF teen with thick, green sputum",who:"15-year-old male · cystic fibrosis",text:"A 15-year-old male with confirmed CF presents for a routine pulmonary clinic visit. His parents report that although he does airway clearance therapy twice daily, his sputum has become increasingly thick, green and tenacious, making it hard to expectorate. Spirometry shows his FEV1 has declined to 65% of predicted. The physician wants to add a mucoactive agent.",
 answer:{med:"Dornase alfa (Pulmozyme) 2.5 mg (one ampule), inhaled undiluted by jet nebulizer once daily, given before airway clearance.",why:"His thick, green (purulent) sputum is full of extracellular DNA released by dead neutrophils, and that DNA makes the sputum much more viscous. Dornase alfa is recombinant human DNase I: it digests the extracellular DNA, lowering viscosity so secretions flow and can be cleared. It is indicated as maintenance therapy for the viscous secretions of CF, and it improves FEV1 and reduces exacerbations. Giving it before airway clearance lets the thinned secretions be mobilized."},
 steps:[
 {q:"Which mucoactive agent is MOST indicated?",c:["Dornase alfa (Pulmozyme)","Aerosolized acetylcysteine 20%","Sterile water by large-volume nebulizer","A leukotriene modifier"],e:"Dornase alfa is indicated as maintenance therapy for the viscous pulmonary secretions of cystic fibrosis."},
 {q:"Why does dornase alfa work especially well on thick, GREEN (purulent) CF sputum?",c:["Purulent sputum contains large amounts of extracellular DNA from neutrophils, which dornase alfa digests","Green sputum has extra disulfide bonds that dornase breaks","It kills the bacteria that turn sputum green","It draws water into the airway by osmosis"],e:"Dornase alfa is a recombinant form of human DNase I. Digesting extracellular DNA decreases viscosity and restores the mucus's ability to flow."},
 {q:"What is the standard dose and frequency?",c:["2.5 mg (one 2.5 ml ampule) inhaled once daily by jet nebulizer","2.5 mg diluted in 3 ml saline four times daily","25 mg once weekly","3 ml of a 20% solution three times daily"],e:"The usual dose is one 2.5 mg ampule once daily; some patients are prescribed it twice daily. The 20% solution in the last option is acetylcysteine."},
 {q:"Which instruction about preparing dornase alfa is correct?",c:["Don't dilute it or mix it with other drugs in the nebulizer; keep the ampules refrigerated and protected from light","Mix it with his albuterol to save time","Dilute it with 3 ml of sterile water","Store it at room temperature in sunlight"],e:"Dornase is a fragile protein (enzyme). Mixing it with other drugs can inactivate it, and heat and light degrade it."},
 {q:"When should he take it relative to his airway clearance therapy?",c:["Before airway clearance","After airway clearance","Only on days he skips airway clearance","Timing doesn't matter"],e:"Mucoactive drugs are given before physical airway clearance, so secretions are less viscous when he clears them."},
 {info:"His genotype report shows one copy of F508del. The physician also wants to start Trikafta.",q:"Is he eligible, and what is his regimen?",c:["Yes. AM: two orange tablets (elexacaftor 100/tezacaftor 50/ivacaftor 75 mg); PM: one ivacaftor 150 mg tablet, with fat-containing food","No, he needs two F508del copies","Yes. AM: two light orange tablets; PM: ivacaftor 75 mg","No, he is too old"],e:"Criteria are age 2 or older plus at least one F508del or other responsive mutation. At age 12 and up he takes the adult dose. He should keep up his dornase alfa and airway clearance unless his prescriber says otherwise."}
]},
{id:"wm2",ws:1,u:"mucus",title:"Mucus Case 2 — Smoke inhalation injury",who:"38-year-old female · intubated after a house fire",text:"A 38-year-old female is admitted to the ICU after being rescued from a house fire. She has soot in her oropharynx and was intubated for inhalation injury. Over the next 24 hours the RT notes she is developing thick airway casts that are starting to occlude the endotracheal tube and small airways. The team starts a protocol to prevent these fibrinous exudates from clogging the airways: a specific mucolytic combined with heparin and a bronchodilator.",
 answer:{med:"Nebulized acetylcysteine (NAC, commonly 3 ml of 20%), combined with nebulized heparin and a bronchodilator such as albuterol, typically every 4 hours as part of an inhalation-injury protocol.",why:"Smoke injury causes protein-rich, fibrin-containing exudate that forms airway casts. Heparin (an anticoagulant) limits fibrin formation, so casts don't form. Acetylcysteine breaks the disulfide bonds of mucin to thin the secretions and casts, and it is also an antioxidant (free-radical scavenger) against oxidant injury. Because NAC can cause bronchospasm, a bronchodilator is given with it. Together they keep the ETT and small airways open and reduce atelectasis and pneumonia."},
 steps:[
 {q:"Which mucolytic is used in this inhalation-injury protocol?",c:["Acetylcysteine (NAC)","Dornase alfa","7% hypertonic saline","Sterile distilled water"],e:"Nebulized heparin plus N-acetylcysteine, with a bronchodilator, is the classic protocol for smoke inhalation injury."},
 {q:"What is the heparin's role?",c:["As an anticoagulant, it limits fibrin formation so fibrinous casts don't form","It breaks disulfide bonds in mucus","It is a bronchodilator","It digests extracellular DNA"],e:"The casts are fibrinous exudate. Heparin prevents the fibrin from forming, and NAC thins and breaks up the mucus portion."},
 {q:"How does acetylcysteine thin the casts and secretions?",c:["Its free thiol groups replace the disulfide bonds linking mucin proteins, and it also acts as an antioxidant","It hydrates the sol layer like saline","It opens CFTR chloride channels","It increases β-receptor numbers"],e:"NAC breaks disulfide bonds, lowering viscosity right away. Its antioxidant action is the same property that makes it an acetaminophen-overdose antidote."},
 {q:"Why is a bronchodilator part of the protocol?",c:["Acetylcysteine is an airway irritant that can cause bronchospasm","Bronchodilators thin mucus directly","Heparin causes hypertension","Bronchodilators neutralize NAC's odor"],e:"NAC can trigger bronchospasm, especially in inflamed, reactive airways, so a bronchodilator such as albuterol is given with it or before it."},
 {q:"The protocol calls for 3 ml of 20% acetylcysteine. How many mg is that?",c:["600 mg","60 mg","200 mg","6,000 mg"],e:"20% = 200 mg/ml. 200 mg/ml × 3 ml = 600 mg."},
 {q:"Which route makes nebulized delivery into her airway possible here?",c:["In-line nebulization through the ventilator circuit / artificial airway","A nasal cannula","Oral tablets","A simple face mask over the ETT"],e:"Because she is intubated, aerosol is delivered in-line, and drugs can also be instilled directly through the artificial airway."}
]},
{id:"wm3",ws:1,u:"mucus",title:"Mucus Case 3 — COPD with sticky mucoid plugs",who:"68-year-old male · chronic bronchitis (COPD) exacerbation",text:"A 68-year-old male with chronic bronchitis (COPD) is hospitalized with an acute exacerbation. He has a frequent, loose-sounding cough but is struggling to move secretions. On auscultation the RT hears coarse inspiratory and expiratory crackles (rhonchi). His sputum is described as \"mucoid but extremely sticky,\" like small plugs.",
 answer:{med:"Aerosolized acetylcysteine (e.g., 3–5 ml of 20% or 6–10 ml of 10% by SVN, 3–4 times daily), given with or after a bronchodilator such as albuterol, followed by airway clearance.",why:"His secretions are mucoid (not purulent) and very sticky, a structure held together by disulfide bonds between mucin glycoproteins. NAC's free thiol groups break those bonds and lower viscosity right away. It can cause bronchospasm, especially in COPD, so a bronchodilator goes with it. Dornase alfa targets DNA in purulent CF sputum and isn't indicated here. Hypertonic saline can decrease lung function in COPD. Per lecture, data on aerosolized NAC are limited, so assess his response and stop if there's no benefit."},
 steps:[
 {q:"Which mucolytic best targets sticky, MUCOID (non-purulent) secretions?",c:["Acetylcysteine","Dornase alfa","Elexacaftor/tezacaftor/ivacaftor","A leukotriene modifier"],e:"NAC breaks the disulfide bonds that hold mucoid secretions together. Dornase acts on DNA, which is plentiful in purulent CF sputum."},
 {q:"Why is hypertonic saline a poor choice for this patient?",c:["It may decrease lung function in COPD and is the bland aerosol most likely to cause bronchospasm","It digests DNA","It is too isotonic to have any effect","It only works in children"],e:"Per lecture, hypertonic saline may decrease lung function in COPD, though it is beneficial in CF."},
 {q:"What must be given with aerosolized acetylcysteine for this patient?",c:["A bronchodilator such as albuterol","Heparin","Dornase alfa","An oral steroid in the same nebulizer"],e:"NAC is irritating and can cause bronchospasm, so it is given with a bronchodilator or after a pretreatment."},
 {q:"Acetylcysteine 400 mg by SVN is ordered. You have the 10% solution. How many ml?",c:["4 ml","2 ml","0.4 ml","40 ml"],e:"10% = 100 mg/ml. 400 mg ÷ 100 mg/ml = 4 ml."},
 {info:"Partway through the treatment, he develops new expiratory wheezing and his work of breathing increases.",q:"Best action?",c:["Stop the NAC, assess him, give a bronchodilator per protocol, and notify the provider","Continue, since wheezing shows the secretions are loosening","Add hypertonic saline","Increase the NAC concentration"],e:"Bronchospasm is NAC's key adverse effect. Stop the irritant and treat the bronchospasm."},
 {q:"What does the lecture say about the evidence for aerosolized NAC?",c:["No data show it is effective therapy for any lung disease, so assess his response and stop it if there's no benefit","It is proven first-line therapy for COPD","It is more effective than antibiotics","It cures chronic bronchitis"],e:"Despite in-vitro activity and long use, there are no data showing aerosolized NAC is effective, so it should be a trial with a clear goal."}
]},
{id:"wm4",ws:1,u:"mucus",title:"Mucus Case 4 — CF child, morning airway clearance",who:"8-year-old female · CF pulmonary exacerbation",text:"An 8-year-old girl with CF is admitted for a pulmonary exacerbation. The RT is planning her morning airway clearance therapy (ACT). The physician wants an inhaled agent that acts as an osmotic irritant to stimulate cough and increase secretion clearance. The agent is inexpensive and effective in CF, but the RT must be prepared for possible bronchospasm during administration.",
 answer:{med:"Hypertonic saline, usually 7% (4 ml by nebulizer twice daily), preceded by a bronchodilator such as albuterol, and given before or with airway clearance.",why:"Hypertonic saline is osmotic: it draws water into the airway surface liquid, deepening the sol layer and hydrating thick CF mucus. Its irritant effect also triggers cough. Both improve mucus clearance, and in turn lung function, in CF. It is the bland aerosol most likely to cause bronchospasm, so she is pretreated with a bronchodilator and monitored (breath sounds, SpO₂, work of breathing) throughout."},
 steps:[
 {q:"Which agent is the physician describing?",c:["Hypertonic saline (e.g., 7%)","0.45% saline","Dornase alfa","Acetylcysteine"],e:"Hypertonic saline (1.8–10%) is an inexpensive osmotic irritant that's beneficial in CF and is the bland aerosol most likely to cause bronchospasm."},
 {q:"How does it improve clearance?",c:["It osmotically draws water into the airway (deepening the sol layer) and irritates the airway to stimulate cough","It breaks disulfide bonds in mucin","It digests extracellular DNA","It corrects CFTR protein folding"],e:"It works as a bland/osmotic aerosol, not by breaking up the mucus molecule. Hydrating the sol layer plus inducing cough together improve mucus clearance."},
 {q:"What is a typical CF dose?",c:["4 ml of 7% saline by nebulizer twice daily","0.5 ml diluted in 3 ml normal saline once weekly","Continuous 10% saline by large-volume nebulizer","2.5 mg once daily"],e:"Hypertonic saline in CF is commonly 4 ml of 7%, twice daily, after a bronchodilator."},
 {q:"How should the RT prevent bronchospasm?",c:["Pretreat with a bronchodilator (albuterol) before the hypertonic saline","Give it right after an ICS with no bronchodilator","Dilute it with sterile water","Give it only at bedtime"],e:"Bronchodilator pretreatment is standard, and the RT watches for wheezing, chest tightness and desaturation."},
 {q:"What is the best order for her morning therapies?",c:["Bronchodilator → hypertonic saline → airway clearance → inhaled antibiotic","Inhaled antibiotic → airway clearance → hypertonic saline → bronchodilator","Airway clearance → bronchodilator → hypertonic saline","Hypertonic saline → inhaled antibiotic → bronchodilator"],e:"Open the airways first, hydrate the mucus, clear it, and then deposit the antibiotic on the cleared airways."},
 {info:"Midway through the hypertonic saline she coughs productively, then develops wheezing with SpO₂ dropping from 96% to 89%.",q:"How do you interpret this?",c:["Productive coughing is expected, but wheezing with desaturation suggests bronchospasm: stop, give a bronchodilator, reassess and notify","Everything is expected, so finish the treatment","She is having an allergic reaction to Trikafta","Switch to sterile water and continue"],e:"Cough is the desired effect. Bronchospasm is the adverse effect to watch for."}
]},
{id:"wm5",ws:1,u:"mucus",title:"Mucus Case 5 — Non-CF bronchiectasis",who:"55-year-old female · non-CF bronchiectasis",text:"A 55-year-old female with non-CF bronchiectasis reports a chronic productive cough that has become harder to manage. She expectorates large volumes of foul-smelling, purulent sputum. A chest CT confirms cylindrical airway dilation. Along with antibiotics and chest physiotherapy, the care team is considering a mucolytic to help liquefy her secretions for easier mobilization.",
 answer:{med:"Aerosolized acetylcysteine (e.g., 3–5 ml of 20% by SVN, 3–4 times daily) with a bronchodilator, given before chest physiotherapy. Hypertonic saline is another commonly used mucoactive option in bronchiectasis. Dornase alfa should NOT be used because she does not have CF.",why:"NAC breaks the disulfide bonds in mucus to liquefy secretions so chest physiotherapy can mobilize them. A bronchodilator prevents NAC-induced bronchospasm. Even though her sputum is purulent, dornase alfa is approved only for CF; in non-CF bronchiectasis trials it gave no benefit and was linked to more exacerbations and faster FEV1 decline. Mucoactive therapy is given before airway clearance so the thinner secretions are cleared."},
 steps:[
 {q:"A team member suggests dornase alfa because her sputum is purulent. Is it appropriate?",c:["No. It is indicated for CF; in non-CF bronchiectasis it showed no benefit and was linked to more exacerbations","Yes, it is first-line for all bronchiectasis","Yes, but only at double the dose","Only if mixed with acetylcysteine"],e:"Dornase alfa's indication is the viscous secretions of cystic fibrosis. Using it in non-CF bronchiectasis is a classic exam trap."},
 {q:"Which mucolytic is a reasonable choice for her?",c:["Acetylcysteine with a bronchodilator","Dornase alfa","Trikafta","An inhaled corticosteroid"],e:"NAC breaks disulfide bonds to liquefy secretions. (Hypertonic saline is also used as a mucoactive agent in bronchiectasis, though it is an osmotic agent, not a true mucolytic.)"},
 {q:"How does a mucolytic like NAC differ from a bland aerosol like normal saline?",c:["NAC directly changes the mucus molecule's structure; saline doesn't act on the molecule and may only dilute it","They work the same way","Saline breaks disulfide bonds; NAC only adds water","NAC digests DNA"],e:"Mucolytics break the molecular strands. Bland aerosols act on water content and irritation."},
 {q:"When should the mucolytic be given relative to chest physiotherapy?",c:["Before chest physiotherapy","After chest physiotherapy","At bedtime, separate from chest physiotherapy","Only during antibiotic infusions"],e:"Give mucoactive drugs before airway clearance to lower viscosity and improve clearance."},
 {q:"She is ordered 6 ml of 10% acetylcysteine. How many mg is that?",c:["600 mg","60 mg","6 mg","6,000 mg"],e:"10% = 100 mg/ml × 6 ml = 600 mg."}
]},
{id:"ws1",ws:1,u:"steroids",title:"Steroid Case 1 — Uncontrolled asthma on SABA only",who:"24-year-old female · asthma",text:"A 24-year-old female with asthma reports using her albuterol rescue inhaler 5–6 days per week for chest tightness. She often wakes at night short of breath and says her symptoms interfere with daily activities. Her only medication is an as-needed short-acting β2 agonist (SABA). Spirometry shows an FEV1 of 78% of predicted.",
 answer:{med:"Start a daily inhaled corticosteroid controller, preferably an ICS-formoterol combination (e.g., budesonide/formoterol) used daily and as needed, or a low-to-medium-dose ICS plus SABA as needed. Teach spacer use and rinsing after each dose.",why:"She has moderate persistent asthma: symptoms most days, night waking more than once a week, activity limitation and FEV1 60–80%. SABA-only therapy treats bronchospasm but not the underlying airway inflammation. Inhaled corticosteroids are the backbone of persistent asthma therapy. They block the immune and inflammatory response, reduce bronchial hyperresponsiveness and increase β-agonist responsiveness, with very low systemic risk at therapeutic doses. Expect improvement in 1–2 weeks and maximum benefit at 4–8 weeks."},
 steps:[
 {q:"How would you classify her asthma severity?",c:["Moderate persistent","Intermittent","Mild persistent","Severe persistent"],e:"Symptoms most days, night waking more than once a week, some activity limitation and FEV1 60–80% all point to moderate persistent asthma. Always classify by the most severe feature."},
 {q:"What is the indicated medication change?",c:["Add a daily inhaled corticosteroid controller, e.g., an ICS-formoterol combination such as budesonide/formoterol","Keep SABA only and use it more often","Start daily oral prednisone indefinitely","Use a leukotriene modifier as the preferred sole controller"],e:"Persistent asthma needs a daily anti-inflammatory controller, and an ICS is the backbone of that therapy."},
 {q:"Why are ICS the backbone of persistent-asthma therapy?",c:["They block the immune response and subsequent inflammation, reduce BHR, and increase β-agonist responsiveness","They give immediate bronchodilation within minutes","They thin mucus by breaking disulfide bonds","They block muscarinic receptors"],e:"Corticosteroids block both the initial immune response and the inflammatory process that follows, and they decrease eosinophils, lymphocytes and leukotriene production."},
 {q:"She asks when she'll notice a difference.",c:["Symptoms improve in 1–2 weeks, with maximum benefit at 4–8 weeks; FEV1 can take 3–6 weeks","Within 5 minutes","Within 4–6 hours","Only after a full year"],e:"ICS have a slow onset, so stress daily use even when she feels fine."},
 {q:"Which teaching point lowers her risk of oral thrush?",c:["Use a spacer/VHC and rinse, gargle and spit after each dose","Use it only when she's wheezy","Swallow after each puff","Take all puffs as fast as possible"],e:"A spacer and gargling after treatment reduce oropharyngeal deposition."},
 {q:"She asks if she can just take a pill (montelukast) instead of an inhaler. Best answer?",c:["Leukotriene modifiers are an alternative to low-dose ICS in MILD persistent asthma; for her moderate asthma an ICS-based controller is preferred","Yes, it works faster than albuterol for attacks","Yes, montelukast is a corticosteroid","No, leukotriene modifiers are only for COPD"],e:"Leukotriene modifiers are for long-term control, never rescue, and are considered alternatives to low-dose ICS in mild persistent asthma."}
]},
{id:"ws2",ws:1,u:"steroids",title:"Steroid Case 2 — COPD exacerbation on NIV",who:"70-year-old male · COPD, acute-on-chronic respiratory acidosis",text:"A 70-year-old male with long-standing COPD comes to the ED with acutely increased dyspnea and cough. Exam shows diminished breath sounds bilaterally and accessory muscle use. ABG: pH 7.30, PaCO₂ 67 mm Hg (acute-on-chronic respiratory acidosis). The team starts noninvasive ventilation and high-dose bronchodilators.",
 answer:{med:"A short course of systemic corticosteroid: prednisone 40 mg PO daily for 5 days, or IV methylprednisolone (e.g., 40 mg) while he can't safely take oral medication on NIV. No taper is needed for a short course.",why:"Systemic steroids are standard care for COPD exacerbations. They reduce airway inflammation and edema, improve FEV1 and oxygenation, shorten recovery and hospital stay, and lower the risk of treatment failure and early relapse. They also restore and increase β-receptor responsiveness (within 2–4 hours of IV dosing), improving his response to the high-dose bronchodilators. Inhaled steroids act too slowly (1–2 weeks) to help an acute exacerbation."},
 steps:[
 {q:"Which corticosteroid therapy is indicated now?",c:["A short course of systemic corticosteroid (IV methylprednisolone or oral prednisone)","Double his inhaled corticosteroid only","No steroids; bronchodilators alone","A leukotriene modifier"],e:"Oral or IV steroids are used for acute flare-ups and severe exacerbations; ICS are maintenance drugs."},
 {q:"He is on a full-face NIV mask and can't safely swallow pills. Which route?",c:["IV methylprednisolone, switching to oral when he can take PO","Inhaled beclomethasone through the NIV circuit","Hold steroids until he's off NIV","Intramuscular dornase alfa"],e:"Oral works as well as IV when the patient can take PO. IV is used when he can't."},
 {q:"How do systemic steroids help his bronchodilator therapy work?",c:["They increase the number and availability of β receptors within 2–4 hours after IV dosing","They are bronchodilators themselves","They block muscarinic receptors","They thin his secretions"],e:"Restoring β-agonist responsiveness is the rationale for giving an IV bolus in severe bronchospasm."},
 {q:"What is the usual exacerbation course, and does it need a taper?",c:["About 5 days (e.g., prednisone 40 mg daily); short courses don't need a taper","6 months, then stop abruptly","1 day only","At least a year, then taper over weeks"],e:"A taper is needed after PROLONGED therapy because of HPA suppression. A ~5-day burst does not suppress the HPA axis enough to require one."},
 {q:"Which adverse effect should be monitored most closely during his hospital stay?",c:["Hyperglycemia","Oral thrush","Cataracts","Buffalo hump"],e:"Short-term systemic steroids commonly raise blood glucose, and can also cause fluid retention, mood changes and insomnia. The other options are local or long-term effects."},
 {q:"Expected onset and peak once he switches to oral prednisone?",c:["Onset 4–6 hours; peak 24–48 hours","Onset 1–2 weeks; peak 4–8 weeks","Onset 5 minutes; peak 30 minutes","Onset 3 days; peak 3 weeks"],e:"OCS onset is 4–6 h with peak effect at 24–48 h."}
]},
{id:"ws3",ws:1,u:"steroids",title:"Steroid Case 3 — Thrush and worsening control on ICS",who:"32-year-old female · persistent asthma on beclomethasone pMDI",text:"A 32-year-old female with persistent asthma uses a conventional pMDI for ICS maintenance: low-dose beclomethasone dipropionate, 4 puffs per day at 42 mcg per puff. She reports increasingly frequent albuterol rescue use and has recently noticed a white coating inside her mouth.",
 answer:{med:"Add a spacer/valved holding chamber and have her rinse, gargle and spit after every dose. Get the thrush treated with an antifungal per the prescriber. After checking technique and adherence, step up therapy: an ICS-LABA combination (e.g., budesonide/formoterol or fluticasone/salmeterol) or a higher-dose ICS.",why:"The white coating is oropharyngeal candidiasis (Candida albicans) from ICS deposited in the mouth. Using a pMDI without a spacer deposits a lot of drug in the oropharynx, and a spacer plus rinsing reduces this. She should not stop her ICS. More frequent rescue use means her asthma is poorly controlled on 168 mcg/day (low dose). After confirming she uses the inhaler correctly and consistently, step up her controller."},
 steps:[
 {q:"What is her total daily beclomethasone dose?",c:["168 mcg/day","42 mcg/day","84 mcg/day","336 mcg/day"],e:"4 puffs × 42 mcg = 168 mcg per day, a low dose."},
 {q:"What is the white coating most likely to be?",c:["Oropharyngeal candidiasis (Candida albicans) from ICS deposition","Iatrogenic Cushing syndrome","Adrenal crisis","A leukotriene reaction"],e:"ICS can cause Candida albicans or Aspergillus niger infections of the mouth, pharynx and larynx. The risk is dose-related."},
 {q:"Which device change most reduces oropharyngeal deposition?",c:["Add a spacer/valved holding chamber to her pMDI","Remove the mouthpiece cap less often","Switch to taking it through her nose","Use a nebulizer with sterile water"],e:"Spacers trap the large particles that would otherwise land in the mouth, so more drug reaches the lungs."},
 {q:"Should she stop her ICS because of the thrush?",c:["No. Continue the ICS, treat the thrush, and rinse and spit after every dose","Yes, stop it permanently","Yes, switch to albuterol only","Yes, switch to daily oral prednisone"],e:"Thrush is a manageable local effect. Stopping her controller would make her asthma worse."},
 {q:"Her rescue use is increasing. What should you check FIRST before stepping up therapy?",c:["Inhaler technique and adherence","Her serum cortisol","A sputum culture for CF","Her liver enzymes"],e:"Poor technique, especially pMDI coordination without a spacer, and missed doses are the most common causes of poor control."},
 {q:"Technique and adherence are fine. What is an appropriate step-up?",c:["Switch to an ICS-LABA combination (e.g., budesonide/formoterol) or increase to a medium-dose ICS","Stop the ICS and use a leukotriene modifier as rescue","Add a second SABA","Start daily IV methylprednisolone"],e:"Escalating controller therapy, either a higher-dose ICS or adding a LABA, is the next step for uncontrolled persistent asthma."}
]},
{id:"ws4",ws:1,u:"steroids",title:"Steroid Case 4 — Failed cuff leak test",who:"45-year-old female · intubated 10 days after TBI",text:"A 45-year-old female has been intubated for 10 days after a severe traumatic brain injury. She passes a spontaneous breathing trial. Before extubation, the RT performs a cuff leak test, and no air leak is detected when the cuff is deflated. This puts her at high risk for glottic edema and post-extubation airway obstruction (stridor).",
 answer:{med:"A systemic (IV) corticosteroid such as methylprednisolone (e.g., 20 mg IV every 4 hours starting about 12 hours before extubation, or 40 mg IV at least 4 hours before), given at least 4 hours before extubation. Have nebulized racemic epinephrine ready afterward.",why:"Ten days of intubation causes inflammation and edema of the larynx and glottis, and a failed cuff leak test signals that edema. Corticosteroids suppress the inflammatory response and reduce laryngeal edema, which lowers the rates of post-extubation stridor and reintubation. They need several hours to work, so they must be given at least 4 hours before the tube is pulled; inhaled steroids act far too slowly for this."},
 steps:[
 {q:"What is the indicated medication before extubation?",c:["A systemic (IV) corticosteroid such as methylprednisolone","An inhaled corticosteroid MDI started the day of extubation","Dornase alfa","A leukotriene modifier"],e:"Systemic steroids before extubation reduce post-extubation stridor and reintubation in patients who fail a cuff leak test."},
 {q:"What is the rationale?",c:["Corticosteroids suppress inflammation and reduce laryngeal/glottic edema around the tube","They dilate the vocal cords directly","They thin secretions above the cuff","They increase respiratory drive"],e:"The anti-inflammatory action decreases capillary permeability and edema in the swollen laryngeal tissue."},
 {q:"When should the steroid be given relative to extubation?",c:["At least 4 hours before extubation (often started 12–24 h before)","5 minutes before extubation","Only after stridor develops","One week before extubation"],e:"Steroids are not immediate-acting, and their anti-inflammatory effects need hours to develop."},
 {q:"Why not use an inhaled corticosteroid for this?",c:["ICS take 1–2 weeks for initial effect, far too slow, and are designed for long-term maintenance","ICS are more toxic than IV steroids","ICS cause adrenal crisis","ICS cannot be given to adults"],e:"ICS onset is 1–2 weeks with full effect at 4–8 weeks."},
 {info:"She is extubated. Fifteen minutes later she develops high-pitched inspiratory stridor with increased work of breathing.",q:"Which aerosolized medication is usually given first?",c:["Racemic epinephrine","Acetylcysteine","Dornase alfa","Hypertonic saline"],e:"Racemic epinephrine's α-adrenergic vasoconstriction shrinks swollen upper-airway mucosa. Monitor closely and be ready to reintubate."},
 {q:"Which adverse effect of her steroid course is most relevant to monitor in the ICU?",c:["Hyperglycemia","Cushingoid moon face","Osteoporosis","Cataracts"],e:"Short-term systemic steroids commonly cause hyperglycemia. The other options are long-term effects."}
]},
{id:"ws5",ws:1,u:"steroids",title:"Steroid Case 5 — Emphysema needing all-day relief",who:"68-year-old male · emphysema-predominant COPD",text:"A 68-year-old male with emphysema-predominant COPD currently takes a daily inhaled corticosteroid by small-volume nebulizer and a short-acting anticholinergic every 6 hours for frequent symptoms. He needs symptom relief throughout the day. He follows instructions well and can generate a high inspiratory flow rate.",
 answer:{med:"Switch to once-daily long-acting maintenance bronchodilators: a LAMA/LABA combination (e.g., umeclidinium/vilanterol or tiotropium/olodaterol), delivered by DPI. Keep a SABA for rescue, stop the scheduled short-acting anticholinergic, and reassess the ICS (continue it, as triple therapy, only if he has frequent exacerbations or high blood eosinophils).",why:"Long-acting bronchodilators are the cornerstone of COPD maintenance and give 24-hour symptom relief that q6h short-acting drugs can't. ICS monotherapy isn't recommended in COPD, especially emphysema-predominant disease without eosinophilia, and it raises pneumonia risk. Because he generates high inspiratory flow and follows instructions, a DPI is ideal: it's breath-actuated, portable and faster than an SVN. A LAMA replaces his short-acting anticholinergic, so the two shouldn't be used together."},
 steps:[
 {q:"What is the biggest gap in his current regimen?",c:["He has no long-acting maintenance bronchodilator, so q6h short-acting therapy can't give all-day relief","His ICS dose is too low","He needs a mucolytic","He needs an oral steroid daily"],e:"Patients with frequent COPD symptoms need scheduled long-acting bronchodilators."},
 {q:"What is the best maintenance recommendation?",c:["A once-daily LAMA/LABA combination (e.g., umeclidinium/vilanterol)","Add a leukotriene modifier","Increase the nebulized ICS dose","Add 7% hypertonic saline"],e:"Long-acting muscarinic antagonists and β2 agonists are the backbone of COPD maintenance and give 24-hour bronchodilation."},
 {q:"Why is a DPI a good device for him?",c:["DPIs need a rapid, deep inhalation (high inspiratory flow), which he can generate, and they're breath-actuated and quick","DPIs need slow inhalation with a spacer","DPIs work best for patients who can't follow instructions","DPIs need a compressor"],e:"Device choice depends on the patient's inspiratory flow and ability to follow steps, and he can do both."},
 {q:"What should be done with his inhaled corticosteroid?",c:["Reassess it: ICS alone isn't recommended in COPD and raises pneumonia risk; keep ICS (as triple therapy) only with frequent exacerbations or high eosinophils","Double it","Switch it to daily oral prednisone","Stop it abruptly with no reassessment"],e:"In COPD, ICS are added on top of long-acting bronchodilators for selected patients, not used as stand-alone maintenance."},
 {q:"Once he starts a LAMA, what happens to his scheduled short-acting anticholinergic?",c:["Discontinue it (avoid two antimuscarinics) and use a SABA such as albuterol for rescue","Continue it every 6 hours","Increase it to every 2 hours","Mix it into the DPI"],e:"Duplicating anticholinergics adds side effects without added benefit."},
 {q:"Which DPI teaching point is correct?",c:["Exhale away from the device, then inhale quickly and deeply; rinse and spit if the inhaler contains an ICS","Exhale into the mouthpiece before inhaling","Inhale slowly over 5 seconds like a pMDI","Shake the DPI vigorously before each dose"],e:"Breathing into a DPI moistens and clumps the powder. A fast, forceful inhalation is needed to break up the powder (deaggregation)."}
]},
/* ---------- MUCUS CASES ---------- */
{id:"cm1",u:"mucus",title:"Maya — CF clinic visit",who:"Maya, 9-year-old girl, 27 kg",text:"Maya has cystic fibrosis and is homozygous for the F508del mutation. She uses dornase alfa daily and a high-frequency chest wall oscillation vest twice daily, but has had three exacerbations this year and thick, tenacious sputum. Her pulmonologist is considering Trikafta.",steps:[
 {q:"Is Maya an appropriate candidate for Trikafta?",c:["Yes — she is 2 years or older and has at least one F508del mutation","No — she must be 12 or older","No — she needs two different mutations","No — Trikafta is only for adults with COPD"],e:"Criteria: age ≥2 and at least one F508del (or other responsive) mutation. Maya meets both."},
 {q:"Which Trikafta regimen is correct for Maya (age 9, 27 kg)?",c:["AM: two light orange tablets (50/25/37.5 mg); PM: one light blue ivacaftor 75 mg tablet","AM: two orange tablets (100/50/75 mg); PM: ivacaftor 150 mg","AM: one packet granules (100/50/75 mg); PM: granules ivacaftor 75 mg","AM: one packet granules (80/40/60 mg); PM: granules ivacaftor 59.5 mg"],e:"Age 6 to <12 and <30 kg → two light orange tablets AM, one light blue ivacaftor 75 mg PM."},
 {q:"Maya’s mother asks how to give the medication.",c:["By mouth with fat-containing food, about 12 hours apart","On an empty stomach first thing in the morning","Crushed into her nebulizer","Once daily at bedtime with water only"],e:"Trikafta is taken orally with fatty foods, usually twice a day 12 hours apart."},
 {q:"Which explanation of how Trikafta works is most accurate?",c:["Correctors (elexacaftor, tezacaftor) get more CFTR protein to the cell surface; the potentiator (ivacaftor) helps the channel open","It digests the DNA in her mucus","It hydrates the sol layer like hypertonic saline","It blocks leukotrienes to reduce inflammation"],e:"The combination first increases the number of CFTR proteins at the surface and then boosts their function → thinner mucus."},
 {info:"Two months later Maya feels great. Her mother asks if she can stop the Pulmozyme and the vest.",q:"Best response?",c:["Continue all previous therapies unless her prescriber advises otherwise","Yes — Trikafta replaces all other CF therapies","Stop Pulmozyme but keep the vest","Stop the vest but double the Pulmozyme"],e:"Patients should continue all previous therapies unless advised otherwise — compliance and education are key."},
 {q:"When should Maya take her dornase alfa relative to her vest treatment?",c:["Before airway clearance","After airway clearance","At the same time as Trikafta only","Timing does not matter"],e:"Mucoactive drugs are given before physical airway clearance to decrease viscosity and enhance clearance."},
 {q:"Given Trikafta’s serious adverse effects, which monitoring makes the most sense?",c:["Liver function and eye exams (cataract screening)","Serum cortisol for adrenal suppression","Oral exam for thrush only","No monitoring is needed"],e:"Serious side effects include life-threatening liver damage and vision problems such as cataracts in children."}
]},
{id:"cm2",u:"mucus",title:"Mr. Delgado — sputum induction",who:"Mr. Delgado, 68-year-old man with COPD",text:"Mr. Delgado has a chronic cough, low-grade fevers and an abnormal chest X-ray. The physician needs a sputum sample, but he cannot produce one on his own. A sputum induction is ordered.",steps:[
 {q:"Which bland aerosol is most commonly used for sputum induction?",c:["Hypertonic saline","0.45% saline","0.9% saline","Bacteriostatic water"],e:"Hypertonic saline (1.8%–10%) is commonly used to induce a cough and sputum sample."},
 {q:"Why do these aerosols help produce a sample?",c:["They irritate the airway, causing cough and increasing production of thinner mucus","They break disulfide bonds in mucin","They open CFTR chloride channels","They increase β-receptor numbers"],e:"Bland aerosols are somewhat irritating; the irritation and cough from dense aerosols are what make them useful for sputum induction."},
 {q:"What is the main concern for THIS patient?",c:["Bronchospasm and a possible decrease in lung function because he has COPD","Adrenal crisis","Liver damage","Hyponatremia from absorbed water"],e:"Hypertonic saline is the bland aerosol most likely to cause bronchospasm and may decrease lung function in COPD."},
 {info:"Five minutes in, Mr. Delgado develops audible wheezing and increased work of breathing.",q:"Most appropriate action?",c:["Stop the treatment, assess him, and notify the provider/give a bronchodilator per protocol","Increase the nebulizer output to finish faster","Switch to sterile water and continue","Continue — wheezing means it is working"],e:"Bronchospasm is the key risk; stop the irritant, assess, and treat per protocol."},
 {info:"After the sample is collected, an albuterol treatment is ordered.",q:"Which solution is best as the well-tolerated diluent?",c:["0.9% normal saline","7% hypertonic saline","Distilled water in a large-volume nebulizer","20% acetylcysteine"],e:"Normal saline is isotonic, less irritating, less likely to cause bronchospasm, and frequently used as a diluent."}
]},
{id:"cm3",u:"mucus",title:"ICU — thick secretions on the ventilator",who:"Ms. Okafor, 45-year-old intubated patient",text:"Ms. Okafor is intubated after abdominal surgery. Suctioning returns small amounts of very thick, tenacious secretions. The physician orders acetylcysteine 400 mg by direct instillation; you have a 20% solution.",steps:[
 {q:"How many ml of 20% acetylcysteine do you instill?",c:["2 ml","4 ml","0.5 ml","20 ml"],e:"20% = 200 mg/ml. 400 mg ÷ 200 mg/ml = 2 ml."},
 {q:"Direct instillation is an accepted route for Ms. Okafor because she has:",c:["An artificial airway","A strong spontaneous cough","A nasal cannula","A peripheral IV"],e:"Direct instillation is performed on patients with artificial airways, during bronchoscopy, or via a transtracheal catheter."},
 {q:"How does acetylcysteine thin her secretions?",c:["Free thiol groups replace the disulfide bonds linking mucin proteins","It digests extracellular DNA","It simply adds water to the sol layer","It increases ciliary beat frequency"],e:"NAC substitutes free thiol groups for disulfide bonds, reducing viscosity immediately."},
 {q:"What should the RT recognize about the evidence for aerosolized NAC?",c:["No data show aerosolized NAC is effective therapy for any lung disease","It is proven to cure COPD","It is the standard maintenance therapy for CF","It is more effective than dornase alfa in CF"],e:"Despite in-vitro activity and long use, there are no data showing aerosolized NAC is effective for any lung disease."},
 {info:"A colleague suggests running continuous heated aerosol from a large-volume nebulizer at high output to “really soak” her secretions.",q:"What is the concern with this plan?",c:["Large volumes can produce runny, watery secretions that impair mucociliary function","It will cause adrenal suppression","Large-volume nebulizers cannot deliver significant aerosol","It will make secretions thicker"],e:"Large-volume/ultrasonic nebulizers can cause runny, watery secretions — thin secretions impair mucociliary function."},
 {info:"In the next bed, a patient with a strong cough and normal expiratory flows asks for “something to break up mucus.”",q:"Is mucoactive therapy likely to benefit him?",c:["Probably not — a strong cough with preserved airflow usually clears secretions without drugs","Yes — everyone with mucus benefits","Yes — give hypertonic saline routinely","Only if given after airway clearance"],e:"Patients with impaired cough and reduced expiratory airflow benefit most; those with preserved airflow and a strong cough usually don’t need it."}
]},
/* ---------- STEROID CASES ---------- */
{id:"cs1",u:"steroids",title:"Jordan — starting an inhaled corticosteroid",who:"Jordan, 14-year-old with mild persistent asthma",text:"Jordan is prescribed an inhaled corticosteroid MDI twice daily for maintenance plus albuterol as needed. You are doing his inhaler teaching.",steps:[
 {q:"Which instruction best reduces his risk of oral thrush?",c:["Use a spacer and rinse/gargle after each dose","Take the ICS right before bed and don’t rinse","Use the ICS only when wheezing","Hold the MDI at arm’s length"],e:"A spacer and gargling after treatment reduce oropharyngeal deposition."},
 {q:"Jordan asks how soon he will feel better.",c:["Initial improvement in 1–2 weeks; maximum benefit at 4–8 weeks","Within 5 minutes, like albuterol","Within 4–6 hours","Only after a year"],e:"ICS: symptoms improve in the first 1–2 weeks with maximum improvement at 4–8 weeks."},
 {info:"At follow-up, Jordan admits he only uses the ICS “when I’m wheezy.”",q:"What should you reinforce?",c:["The ICS is a daily maintenance/prevention drug, not a rescue inhaler — use albuterol for acute symptoms","That’s correct use","Switch the ICS to an oral steroid","Use the ICS four times in a row during attacks"],e:"ICS are for long-term daily maintenance and prevention; they have a slow onset."},
 {info:"Three weeks later he has white patches on his tongue and a sore mouth.",q:"What is the most likely cause?",c:["Oropharyngeal candidiasis (Candida albicans) from ICS deposition","Iatrogenic Cushing syndrome","Adrenal crisis","A leukotriene reaction"],e:"Candida albicans (or Aspergillus niger) infection of the mouth, pharynx or larynx can occur; risk is dose-related."},
 {q:"His parents ask about a tablet instead of an inhaled steroid. Which option fits mild persistent asthma?",c:["A leukotriene modifier as an alternative to low-dose ICS for long-term control","An oral steroid daily","Acetylcysteine tablets","No controller is needed"],e:"Leukotriene modifiers are considered alternatives to low-dose ICS in mild persistent asthma, for long-term control."},
 {q:"Jordan plays soccer and gets exercise-induced bronchospasm. When might the ICS reduce EIB sensitivity?",c:["After about 4 weeks of therapy","Within 2–4 hours","After the first dose","Never"],e:"EIB sensitivity decreases after about 4 weeks of corticosteroid therapy."}
]},
{id:"cs2",u:"steroids",title:"ED — status asthmaticus",who:"Mr. Reyes, 32-year-old in severe exacerbation",text:"Mr. Reyes arrives with a severe asthma exacerbation. He is tachypneic, using accessory muscles, and responding poorly to repeated albuterol. The physician orders IV methylprednisolone.",steps:[
 {q:"What is the main rationale for an IV steroid bolus here?",c:["Glucocorticoids restore β-agonist responsiveness by increasing the number and availability of β receptors","IV steroids are immediate bronchodilators","It prevents oral thrush","It replaces the need for albuterol"],e:"Restoring responsiveness to β-adrenergic stimulation is a key effect — the rationale for a bolus in status asthmaticus."},
 {q:"When would you expect the increase in β-receptor availability?",c:["Within 2–4 hours after IV administration","Within 5 minutes","After 1–2 weeks","After 4–8 weeks"],e:"β receptors increase within 2–4 hours after IV glucocorticoids."},
 {q:"A student suggests giving his inhaled corticosteroid as the main acute treatment. Why is that inappropriate?",c:["ICS take 1–2 weeks for initial improvement; systemic steroids are used for acute exacerbations","ICS are more dangerous than IV steroids","ICS have no anti-inflammatory effect","ICS cause adrenal crisis"],e:"ICS are for long-term maintenance; OCS/IV steroids are used for acute flare-ups and severe exacerbations."},
 {info:"He improves and is discharged on a short oral prednisone burst.",q:"Expected onset and peak effect of the oral steroid?",c:["Onset 4–6 hours; peak 24–48 hours","Onset 1–2 weeks; peak 4–8 weeks","Onset 5 minutes; peak 30 minutes","Onset 3 days; peak 3 weeks"],e:"OCS onset 4–6 hours, peak effect 24–48 hours."},
 {q:"Which effect on inflammatory cells do corticosteroids produce?",c:["Decrease eosinophils, basophils, monocytes, lymphocytes and macrophages","Increase eosinophils","Increase lymphocytes","Increase leukotriene production"],e:"Corticosteroids decrease these cells and block arachidonic acid metabolites (leukotrienes and prostaglandins)."},
 {q:"What is the best long-term controller plan after discharge?",c:["Daily inhaled corticosteroid maintenance","Daily oral prednisone indefinitely","Albuterol only","IV steroids weekly"],e:"ICS are the long-term maintenance/prevention therapy with very low systemic risk at therapeutic doses."}
]},
{id:"cs3",u:"steroids",title:"Mrs. Patel — long-term oral steroids",who:"Mrs. Patel, 61-year-old with severe asthma",text:"Mrs. Patel has taken daily oral prednisone for two years. She has a rounded face, a fat pad between her shoulders, purple abdominal striae, a slow-healing leg ulcer, thin arms and legs, and a recent vertebral compression fracture.",steps:[
 {q:"These findings are most consistent with:",c:["Iatrogenic Cushing (cushingoid) syndrome","Adrenal crisis","Oropharyngeal candidiasis","Leukotriene excess"],e:"Moon face, buffalo hump, striae, poor wound healing, muscle wasting and osteoporosis are cushingoid features."},
 {q:"Her vertebral fracture is best explained by:",c:["Steroid-induced osteoporosis","Cardiac hypertrophy","Oral thrush","Hypertonic saline use"],e:"Osteoporosis is among the systemic effects of long-term corticosteroids."},
 {info:"Upset about her appearance, Mrs. Patel says she will stop the prednisone today.",q:"What is the major danger of stopping abruptly?",c:["Acute adrenal crisis","Immediate cataracts","Thrush","Bronchospasm from the tablet"],e:"Atrophied adrenals cannot immediately make cortisol after sudden withdrawal → acute adrenal crisis."},
 {q:"Why are her adrenal glands unable to respond?",c:["Exogenous steroids suppressed the HPA axis; the body cannot tell drug from its own cortisol, so the adrenals atrophied","The prednisone destroyed her thyroid","Her liver stopped producing cortisol","Leukotrienes blocked the pituitary"],e:"HPA suppression → adrenal atrophy, because the body cannot distinguish endogenous from exogenous glucocorticoids."},
 {q:"Best plan to discuss with the team?",c:["Gradually taper the oral steroid over weeks–months while optimizing inhaled (localized) corticosteroid therapy","Stop prednisone today and start nothing","Double the prednisone to fix the symptoms","Switch to acetylcysteine"],e:"Taper over weeks or months; ICS act locally with very low systemic risk at therapeutic doses."},
 {q:"She asks whether steroids will reverse the long-standing scarring in her airways.",c:["Steroids can prevent or reduce remodeling but cannot completely reverse established smooth muscle hyperplasia or fibrosis","Yes, completely, within 4 weeks","Yes, but only with IV steroids","Steroids cause the scarring"],e:"Corticosteroids alone cannot completely reverse established remodeling."}
]},

{id:"cc1",u:"calc",title:"Pediatric floor — weight-based dose",who:"Liam, 3-year-old, 33 lb",text:"Liam has wheezing. The order is albuterol 0.15 mg/kg by small-volume nebulizer. You have albuterol 0.5% solution and unit-dose normal saline.",steps:[
 {q:"What is Liam’s weight in kg?",c:["15 kg","72.6 kg","16.5 kg","30 kg"],e:"33 lb ÷ 2.2 = 15 kg. Weight must be obtained (in kg) before calculating the dose."},
 {q:"What dose (mg) is ordered?",c:["2.25 mg","0.15 mg","4.95 mg","22.5 mg"],e:"0.15 mg/kg × 15 kg = 2.25 mg."},
 {q:"What is the concentration of 0.5% albuterol?",c:["5 mg/ml","0.5 mg/ml","50 mg/ml","0.05 mg/ml"],e:"Move the decimal one place right: 0.5% = 5 mg/ml."},
 {q:"How many ml of 0.5% albuterol do you draw up?",c:["0.45 ml","2.25 ml","4.5 ml","0.225 ml"],e:"2.25 mg ÷ 5 mg/ml = 0.45 ml."},
 {q:"You add 3 ml of normal saline. How much albuterol is now in the nebulizer?",c:["Still 2.25 mg","Less than 2.25 mg — the saline weakened it","More than 2.25 mg","0.45 mg"],e:"Diluent doesn’t change the amount of active drug — it is still 2.25 mg."}
]},
{id:"cc2",u:"calc",title:"Mucolytic orders",who:"Respiratory therapy department",text:"An order reads: acetylcysteine 600 mg via SVN. Your stock is the 20% vial.",steps:[
 {q:"20% acetylcysteine contains:",c:["200 mg/ml","20 mg/ml","2 mg/ml","2,000 mg/ml"],e:"20% → 200 mg/ml."},
 {q:"How many ml of 20% solution deliver 600 mg?",c:["3 ml","30 ml","1.2 ml","6 ml"],e:"600 mg ÷ 200 mg/ml = 3 ml."},
 {info:"Pharmacy is out of the 20% vial and sends the 10% vial instead.",q:"How many ml of 10% solution deliver 600 mg?",c:["6 ml","3 ml","60 ml","0.6 ml"],e:"10% = 100 mg/ml → 600 ÷ 100 = 6 ml. Half the concentration means double the volume."},
 {q:"In this solution, acetylcysteine is the:",c:["Solute","Solvent","Diluent","Schedule"],e:"The solute is the active ingredient dissolved in the solution."},
 {q:"A 10% vial label could also be written as:",c:["100 mg/ml","10 mg/ml","1 mg/ml","1,000 mg/ml"],e:"10% → move decimal one place right → 100 mg/ml."}
]},
{id:"cc3",u:"calc",title:"Double-checking a colleague",who:"Adult patient, albuterol 2.5 mg ordered",text:"A colleague has drawn up 5 ml of albuterol 0.5% for an order of albuterol 2.5 mg and asks you to double-check before giving it.",steps:[
 {q:"How many mg are in what your colleague drew up?",c:["25 mg","2.5 mg","5 mg","0.25 mg"],e:"0.5% = 5 mg/ml × 5 ml = 25 mg — ten times the ordered dose."},
 {q:"What is the correct volume for 2.5 mg?",c:["0.5 ml","5 ml","2.5 ml","1 ml"],e:"2.5 mg ÷ 5 mg/ml = 0.5 ml."},
 {q:"What likely caused the error?",c:["Confusing the dose volume with the diluent volume / skipping the % → mg/ml conversion","Using the wrong patient weight","Using a solvent instead of solute","Dornase interaction"],e:"Always convert % to mg/ml, then set up the proportion. Diluent volume is separate from drug volume."},
 {q:"Albuterol 0.083% unit dose contains about how many mg/ml?",c:["0.83 mg/ml","8.3 mg/ml","0.083 mg/ml","83 mg/ml"],e:"0.083% → move decimal one place right → 0.83 mg/ml (a 3 ml unit dose ≈ 2.5 mg)."}
]}
];

/* ======================= HELPERS ======================= */
const $ = (s, el=document) => el.querySelector(s);
const app = $("#app");
const LETTERS = "ABCDEFG";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const fmt = n => String(Math.round(n*1000)/1000);
const KEY = "rcpharm-prep-v1";
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch(e){} }
let saved = Object.assign({missed:[], cases:{}, quizzes:0}, load());
function markMissed(id, wrong){
  const s = new Set(saved.missed); wrong ? s.add(id) : s.delete(id); saved.missed = [...s]; save();
}
const unitTag = u => `<span class="tag">${UNITS[u].short}</span>`;

/* ======================= STATE ======================= */
const state = { tab:"guide", unit:"all", set:"all", obj:"all", len:10, mode:"practice", missedOnly:false,
  quiz:null, caseId:null, caseStep:0, caseAns:[], caseDraft:{}, calcType:"mixed", calc:null, calcStats:{c:0,t:0,streak:0} };

/* ======================= QUIZ ======================= */
function pool(){
  return Q.filter(q => (state.set==="all"||(state.set==="lecture"&&!q.b)||(state.set==="review"&&q.b===1)||(state.set==="built"&&q.b===2)) && (state.unit==="all"||q.u===state.unit) && (state.obj==="all"||q.o===state.obj) && (!state.missedOnly||saved.missed.includes(q.id)));
}
function chips(k, opts, cur){
  return `<div class="chips">${opts.map(([v,l]) => `<button class="chip${String(v)===String(cur)?" on":""}" data-act="set" data-k="${k}" data-v="${v}">${l}</button>`).join("")}</div>`;
}
const unitOpts = () => [["all","All"], ...Object.entries(UNITS).map(([k,v]) => [k, v.short])];

function renderQuizSetup(){
  const p = pool();
  const n = state.len==="all" ? p.length : Math.min(state.len, p.length);
  const objs = Object.entries(OBJ).filter(([k,v]) => state.unit==="all" || v.u===state.unit);
  const counts = u => Q.filter(q=>q.u===u).length;
  app.innerHTML = `
  <section class="card">
    <h2>Practice quiz</h2>
    <p class="muted small">${Q.length} questions · Mucus ${counts("mucus")} · Steroids ${counts("steroids")} · Calc ${counts("calc")}</p>
    <span class="label">Topic</span>${chips("unit", unitOpts(), state.unit)}
    <span class="label">Question set</span>${chips("set", [["all","All"],["lecture","Lecture slides"],["review","Review quizzes ("+Q.filter(q=>q.b===1).length+")"],["built","Extra practice"]], state.set)}
    <span class="label">Learning objective</span>
    <select data-act="obj">
      <option value="all">All objectives</option>
      ${objs.map(([k,v]) => `<option value="${k}" ${state.obj===k?"selected":""}>${esc(v.t)}</option>`).join("")}
    </select>
    <span class="label">Length</span>${chips("len", [[10,"10"],[20,"20"],["all","All"]], state.len)}
    <span class="label">Mode</span>${chips("mode", [["practice","Practice · instant feedback"],["exam","Exam · score at end"]], state.mode)}
    <label class="toggle"><input type="checkbox" data-act="missed" ${state.missedOnly?"checked":""}> Only questions I’ve missed (${saved.missed.length})</label>
    <button class="btn primary block" data-act="start" ${n?"":"disabled"}>${n ? `Start · ${n} question${n>1?"s":""}` : "No questions match"}</button>
  </section>
  <section class="card">
    <h3>Learning objectives</h3>
    ${Object.keys(UNITS).filter(u => state.unit==="all"||state.unit===u).map(u => `
      <p class="small muted" style="margin:12px 0 4px"><b>${UNITS[u].name}</b></p>
      <ul class="obj-list">${Object.entries(OBJ).filter(([k,v])=>v.u===u).map(([k,v]) =>
        `<li><button data-act="quizObj" data-k="${k}">${esc(v.t)}</button> <span class="muted small">(${Q.filter(q=>q.o===k).length})</span></li>`).join("")}</ul>`).join("")}
  </section>`;
}

function startQuiz(items){
  state.quiz = { items: items.map(q => ({q, order: shuffle(q.c.map((_,i)=>i)), pick:null})), i:0, mode:state.mode, done:false };
  saved.quizzes++; save(); render(); window.scrollTo(0,0);
}
const isRight = it => it.pick!==null && it.order[it.pick]===0;

function renderQuestion(){
  const z = state.quiz, it = z.items[z.i], q = it.q;
  const reveal = z.mode==="practice" && it.pick!==null;
  const score = z.items.filter(isRight).length, answered = z.items.filter(x=>x.pick!==null).length;
  const last = z.i === z.items.length-1;
  app.innerHTML = `
  <section class="card">
    <div class="row between small muted">
      <span>Question ${z.i+1} of ${z.items.length}</span>
      <span>${z.mode==="practice" ? `Score ${score}/${answered}` : "Exam mode"}</span>
    </div>
    <div class="progress"><i style="width:${(z.i+1)/z.items.length*100}%"></i></div>
    <div>${unitTag(q.u)}${q.b===1?`<span class="tag">Review quiz</span>`:""}<span class="tag gold">${esc(OBJ[q.o].t)}</span></div>
    <h2 style="margin-top:10px">${esc(q.q)}</h2>
    <div class="choices">
      ${it.order.map((oi,di) => {
        let cls = "choice";
        if (reveal){ if (oi===0) cls+=" correct"; else if (di===it.pick) cls+=" wrong"; else cls+=" dim"; }
        else if (di===it.pick) cls+=" sel";
        return `<button class="${cls}" data-act="pick" data-i="${di}" ${reveal?"disabled":""}><span class="letter">${LETTERS[di]}</span><span>${esc(q.c[oi])}</span></button>`;
      }).join("")}

}

/* ======================= CALC DRILL ======================= */
const NEB = [
  {d:"albuterol", p:0.5, doses:[1.25,2.5,5]},
  {d:"acetylcysteine", p:10, doses:[300,400,500,600,800,1000]},
  {d:"acetylcysteine", p:20, doses:[200,400,500,600,800,1000]},
  {d:"ipratropium bromide", p:0.02, doses:[0.5]},
  {d:"cromolyn sodium", p:1, doses:[20]}
];
const CALC_TYPES = [["mixed","Mixed"],["pct","% → mg/ml"],["mgml","mg/ml → %"],["vol","ml to give"],["wt","Weight-based"],["mgin","mg in volume"],["surf","Surfactant"]];

function genCalc(type){
  const t = type==="mixed" ? pick(["pct","mgml","vol","vol","wt","wt","mgin","surf"]) : type;
  if (t==="pct"){
    const p = pick([0.02,0.083,0.1,0.25,0.5,1,2,5,7.5,10,20]); const a = p*10;
    return {t, prompt:`A solution is labeled <b>${fmt(p)}%</b>. How many mg/ml does it contain?`, ans:a, unit:"mg/ml",
      steps:[`% → mg/ml: move the decimal point one place to the right.`, `${fmt(p)}% = ${fmt(a)} mg/ml`]};
  }
  if (t==="mgml"){
    const m = pick([0.2,0.83,1,2.5,5,10,20,50,75,100,200]); const a = m/10;
    return {t, prompt:`A solution contains <b>${fmt(m)} mg/ml</b>. What is its strength as a percentage?`, ans:a, unit:"%",
      steps:[`mg/ml → %: move the decimal point one place to the left.`, `${fmt(m)} mg/ml = ${fmt(a)}%`]};
  }
  if (t==="vol"){
    const n = pick(NEB), dose = pick(n.doses), conc = n.p*10, a = dose/conc;
    return {t, prompt:`<b>${n.d[0].toUpperCase()+n.d.slice(1)} ${fmt(dose)} mg</b> is ordered per aerosol dose. You have a <b>${fmt(n.p)}%</b> solution. How many ml should you deliver?`, ans:a, unit:"ml",
      steps:[`Convert % to mg/ml: ${fmt(n.p)}% = ${fmt(conc)} mg/ml`, `Proportion: ${fmt(conc)} mg / 1 ml = ${fmt(dose)} mg / x ml`, `x = ${fmt(dose)} ÷ ${fmt(conc)} = <b>${fmt(a)} ml</b>`]};
  }
  if (t==="wt"){
    const mgkg = pick([0.05,0.1,0.15,0.2]), kg = pick([10,12,15,18,20,25,30]), lb = Math.random()<0.5;
    const p = 0.5, conc = 5, dose = mgkg*kg, a = Math.round(dose/conc*100)/100;
    const w = lb ? `${fmt(kg*2.2)} lb` : `${kg} kg`;
    const st = [];
    if (lb) st.push(`Convert to kg: ${fmt(kg*2.2)} lb ÷ 2.2 = ${kg} kg`);
    st.push(`Dose = ${fmt(mgkg)} mg/kg × ${kg} kg = ${fmt(dose)} mg`, `Convert % to mg/ml: ${p}% = ${conc} mg/ml`, `Volume = ${fmt(dose)} mg ÷ ${conc} mg/ml = <b>${fmt(a)} ml</b>`);
    return {t, prompt:`A drug is ordered at <b>${fmt(mgkg)} mg/kg</b>. The patient weighs <b>${w}</b>. You have a <b>${p}%</b> solution. How many ml should you deliver? <span class="muted small">(round to 2 decimals)</span>`, ans:a, unit:"ml", steps:st};
  }
  if (t==="surf"){
    const sf = pick([{n:"Beractant (Survanta)",d:4},{n:"Calfactant (Infasurf)",d:3},{n:"Poractant alfa (Curosurf), initial dose",d:2.5}]);
    const g = pick([600,750,800,900,1000,1100,1200,1250,1400,1500,1600,1800,2000]), kg = g/1000, a = Math.round(kg*sf.d*100)/100;
    return {t, prompt:`<b>${sf.n}</b> is ordered for an infant weighing <b>${g} g</b>. How many ml should be instilled? <span class="muted small">(Survanta 4 ml/kg · Infasurf 3 ml/kg · Curosurf 2.5 ml/kg initial)</span>`, ans:a, unit:"ml",
      steps:[`Convert grams to kg: ${g} g ÷ 1000 = ${fmt(kg)} kg`, `${fmt(kg)} kg × ${sf.d} ml/kg = <b>${fmt(a)} ml</b>`]};
  }
  const v = pick([0.5,1,2,2.5,3,4]), p = pick([0.5,1,2,10,20]), a = v*p*10;
  return {t:"mgin", prompt:`How many mg of active drug are in <b>${fmt(v)} ml</b> of a <b>${fmt(p)}%</b> solution? (Diluent added afterward doesn’t change this.)`, ans:a, unit:"mg",
    steps:[`${fmt(p)}% = ${fmt(p*10)} mg/ml`, `${fmt(p*10)} mg/ml × ${fmt(v)} ml = <b>${fmt(a)} mg</b>`]};
}

function renderCalc(){
  if (!state.calc) state.calc = {...genCalc(state.calcType), input:"", checked:false, ok:false};
  const z = state.calc, s = state.calcStats;
  app.innerHTML = `
  <section class="card">
    <h2>Dose-calculation drill</h2>
    <p class="muted small">Unlimited randomized problems with worked solutions, using the methods from the Calculating Drug Doses slides.</p>
    <span class="label">Problem type</span>${chips("calcType", CALC_TYPES, state.calcType)}
    <div class="stats">
      <div class="stat"><b>${s.c}/${s.t}</b><span>Correct</span></div>
      <div class="stat"><b>${s.t ? Math.round(s.c/s.t*100) : 0}%</b><span>Accuracy</span></div>
      <div class="stat"><b>${s.streak}</b><span>Streak</span></div>
    </div>
  </section>
  <section class="card">
    <p class="prompt">${z.prompt}</p>
    <div class="answer-row">
      <input type="text" inputmode="decimal" id="calcIn" placeholder="Your answer" value="${esc(z.input)}" ${z.checked?"disabled":""} autocomplete="off">
      <span class="unit-suffix">${z.unit}</span>
    </div>
    ${z.checked ? `<div class="feedback ${z.ok?"":"bad"}"><b>${z.ok?"Correct":"Answer: "+fmt(z.ans)+" "+z.unit}</b><ol class="steps">${z.steps.map(x=>`<li>${x}</li>`).join("")}</ol></div>` : ""}
    <div class="row end nav">
      ${z.checked ? `<button class="btn primary" data-act="calcNext">Next problem</button>` :
        `<button class="btn" data-act="calcSkip">Skip</button><button class="btn primary" data-act="calcCheck">Check</button>`}
    </div>
  </section>`;
  const inp = $("#calcIn");
  if (inp && !z.checked){
    inp.addEventListener("input", e => { z.input = e.target.value; });
    inp.addEventListener("keydown", e => { if (e.key==="Enter") checkCalc(); });
  }
}
function checkCalc(){
  const z = state.calc, v = parseFloat(String(z.input).replace(/,/g,""));
  if (isNaN(v)) { const i=$("#calcIn"); if(i){ i.focus(); i.placeholder="Enter a number"; } return; }
  z.ok = Math.abs(v - z.ans) <= Math.max(0.011, Math.abs(z.ans)*0.01);
  z.checked = true;
  const s = state.calcStats; s.t++; if (z.ok){ s.c++; s.streak++; } else s.streak = 0;
  render();
}
